content:`
<h2>17.1 Devices in a Small Network</h2>
<h3>17.1.1 Small Network Topologies</h3>
<p>A small network typically includes:</p>
<ul>
  <li>A router (connects to the internet and provides default gateway).</li>
  <li>One or more switches (connect end devices).</li>
  <li>A wireless access point.</li>
  <li>End devices (PCs, printers, phones, IoT devices).</li>
  <li>A firewall (may be integrated into the router for SOHO).</li>
</ul>

<h3>17.1.2 Device Selection for a Small Network</h3>
<p>Considerations:</p>
<ul>
  <li><strong>Cost</strong> &mdash; budget vs features.</li>
  <li><strong>Speed and ports</strong> &mdash; number of ports; Gigabit vs Fast Ethernet.</li>
  <li><strong>Expandability</strong> &mdash; room to grow.</li>
  <li><strong>Manageability</strong> &mdash; managed vs unmanaged switches.</li>
  <li><strong>Features</strong> &mdash; VLANs, PoE, security features.</li>
  <li><strong>Reliability</strong> &mdash; redundancy options.</li>
</ul>

<h3>17.1.3 IP Addressing for a Small Network</h3>
<ul>
  <li>Plan address ranges (usually one or a few subnets).</li>
  <li>Use a private range (192.168.x.x or 10.x.x.x).</li>
  <li>Static addressing for routers, switches, servers, printers.</li>
  <li>DHCP for workstations and mobile devices.</li>
  <li>Reserve a block for future growth.</li>
</ul>

<h3>17.1.4 Redundancy in a Small Network</h3>
<ul>
  <li>Dual ISP links (or a cellular backup).</li>
  <li>Redundant switches (stacked or with STP).</li>
  <li>Dual power supplies / UPS.</li>
  <li>RAID on servers.</li>
  <li>Regular backups.</li>
</ul>

<h3>17.1.5 Traffic Management</h3>
<ul>
  <li>QoS to prioritise voice and video.</li>
  <li>Traffic shaping on the WAN link.</li>
  <li>Monitoring for bandwidth hogs.</li>
  <li>Blocking or rate-limiting non-essential traffic.</li>
</ul>

<h2>17.2 Small Network Applications and Protocols</h2>
<h3>17.2.1 Common Applications</h3>
<ul>
  <li>Web browsers and web servers (HTTP/HTTPS).</li>
  <li>Email clients (SMTP, POP3, IMAP).</li>
  <li>File sharing (SMB, FTP, SFTP).</li>
  <li>Remote access (SSH, RDP, VPN).</li>
  <li>DNS, DHCP, NTP.</li>
  <li>Print services (IPP, SMB).</li>
</ul>

<h3>17.2.2 Common Protocols</h3>
<table>
  <tr><th>Protocol</th><th>Port</th><th>Purpose</th></tr>
  <tr><td>HTTP / HTTPS</td><td>80 / 443</td><td>Web</td></tr>
  <tr><td>DNS</td><td>53</td><td>Name resolution</td></tr>
  <tr><td>DHCP</td><td>67 / 68</td><td>IP configuration</td></tr>
  <tr><td>SMTP / POP3 / IMAP</td><td>25 / 110 / 143</td><td>Email</td></tr>
  <tr><td>FTP / TFTP / SFTP</td><td>20-21 / 69 / 22</td><td>File transfer</td></tr>
  <tr><td>SSH / Telnet</td><td>22 / 23</td><td>Remote access</td></tr>
  <tr><td>SNMP</td><td>161 / 162</td><td>Network management</td></tr>
  <tr><td>NTP</td><td>123</td><td>Time sync</td></tr>
</table>

<h3>17.2.3 Voice and Video Applications</h3>
<ul>
  <li><strong>VoIP</strong> &mdash; SIP for signalling, RTP for voice.</li>
  <li>Requires QoS (voice = EF DSCP 46).</li>
  <li>Latency target: &lt;150 ms.</li>
  <li>Jitter target: &lt;30 ms.</li>
  <li>Packet loss: &lt;1%.</li>
  <li>PoE switches power IP phones.</li>
</ul>

<h2>17.3 Scale to Larger Networks</h2>
<h3>17.3.1 Small Network Growth</h3>
<p>As a network grows, add:</p>
<ul>
  <li>More switches / stack them.</li>
  <li>VLANs for segmentation.</li>
  <li>Routing between VLANs (Layer 3 switch or router-on-a-stick).</li>
  <li>Redundancy (STP, EtherChannel, HSRP/VRRP).</li>
  <li>Dedicated firewall and IPS.</li>
  <li>Centralised management (SNMP, syslog).</li>
  <li>AAA server for authentication.</li>
</ul>

<h3>17.3.2 Protocol Analysis</h3>
<p>Use protocol analysers (Wireshark, tcpdump) to:</p>
<ul>
  <li>Identify bandwidth hogs.</li>
  <li>Detect malformed packets.</li>
  <li>Observe protocol behaviour (handshakes, retransmissions).</li>
  <li>Troubleshoot application performance.</li>
</ul>

<h3>17.3.3 Employee Network Utilization</h3>
<ul>
  <li>Baseline normal usage.</li>
  <li>Monitor peak hours.</li>
  <li>Plan bandwidth upgrades based on data, not guesswork.</li>
  <li>Apply policy: acceptable use, BYOD, guest network.</li>
</ul>

<h2>17.4 Verify Connectivity</h2>
<h3>17.4.1 Verify Connectivity with Ping</h3>
<p>Test connectivity in layers:</p>
<ol>
  <li><code>ping 127.0.0.1</code> &mdash; loopback</li>
  <li><code>ping</code> own IP &mdash; NIC</li>
  <li><code>ping</code> default gateway &mdash; local network</li>
  <li><code>ping</code> remote IP &mdash; routing</li>
  <li><code>ping</code> remote hostname &mdash; DNS</li>
</ol>

<h3>17.4.2 Extended Ping</h3>
<pre class="cli"><span class="cmt">! Cisco IOS extended ping:</span>
Router# <span class="prompt">ping</span>

<h3>17.4.3&ndash;17.4.4 Verify with Traceroute</h3>
<p>Use <code>traceroute</code> on Cisco, <code>tracert</code> on Windows. Extended traceroute adds source selection, probe count, and TTL range.</p>

<h3>17.4.5 Network Baseline</h3>
<p>A <strong>baseline</strong> is a documented snapshot of normal network performance:</p>
<ul>
  <li>Link utilisation over time.</li>
  <li>Latency and jitter.</li>
  <li>Error rates.</li>
  <li>Traffic patterns.</li>
  <li>Peak times.</li>
</ul>
<p>Baselines let you spot anomalies and prove improvements.</p>

<h2>17.6 Troubleshooting Methodologies</h2>
<h3>17.6.1 Basic Troubleshooting Approaches</h3>
<table>
  <tr><th>Approach</th><th>Method</th></tr>
  <tr><td>Top-down</td><td>Start at Layer 7 and work down</td></tr>
  <tr><td>Bottom-up</td><td>Start at Layer 1 and work up</td></tr>
  <tr><td>Divide-and-conquer</td><td>Start in the middle (Layer 3) and move up or down</td></tr>
  <tr><td>Follow-the-path</td><td>Trace traffic from source to destination</td></tr>
  <tr><td>Compare-configurations</td><td>Diff a working device against a broken one</td></tr>
  <tr><td>Substitution</td><td>Swap a suspect part with a known-good one</td></tr>
</table>

<h3>17.6.2 Resolve or Escalate?</h3>
<p>Escalate when:</p>
<ul>
  <li>The problem is beyond your authority or knowledge.</li>
  <li>It affects critical services.</li>
  <li>It requires a vendor or ISP.</li>

<h3>17.6.3 The debug Command</h3>

<div class="callout red"><b>Warning</b>Never leave debugging running on a production device. It can overwhelm the CPU and cause outages.</div>

<h3>17.6.4 The terminal monitor Command</h3>
<p>When connected via Telnet or SSH, log messages are not displayed by default. <code>terminal monitor</code> enables them for the current session. <code>terminal no monitor</code> disables them.</p>

<script>
/* ============================================================
   APP LOGIC — Complete Edition engine
   ============================================================ */
const $ = s => document.querySelector(s);
const navEl = $('#nav');
const contentEl = $('#content');
const crumbEl = $('#crumb');

const PARTS = [
  { n:1, title:'Part 1 · Network Foundations', desc:'Modules 1–4 · Introduction to networks, switch configuration, protocols and models, physical layer' },
  { n:2, title:'Part 2 · Data Link to Network Layer', desc:'Modules 5–8 · Number systems, data link layer, Ethernet switching, network layer' },
  { n:3, title:'Part 3 · Addressing', desc:'Modules 9–12 · Address resolution, router configuration, IPv4 addressing, IPv6 addressing' },
  { n:4, title:'Part 4 · Upper Layers, Security & Small Networks', desc:'Modules 13–17 · ICMP, transport layer, application layer, security, building a small network' }
];

const STORAGE_KEY = 'ccna.complete.progress';

let progress = {};
try { progress = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e){ progress = {}; }
function saveProgress(){ try { localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); } catch(e){} }

/* Build an ordered list of modules from the registered data chunks */
const BOOK = [];
for(let i = 1; i <= 17; i++){
  const key = 'm' + i;
  if(window.CCNA_MODULES[key]) BOOK.push(window.CCNA_MODULES[key]);
}
/* Keep parts contiguous and modules in numeric order */
BOOK.sort((a,b) => (a.part - b.part) || (parseInt(a.id.slice(1),10) - parseInt(b.id.slice(1),10)));

let currentChapter = -1;
let quiz = null;

function moduleNumber(ch){
  return parseInt(String(ch.id).replace(/\D/g,''), 10);
}

function buildNav(){
  navEl.innerHTML = '';

  const home = document.createElement('div');
  home.className = 'navitem' + (currentChapter === -1 ? ' active' : '');
  home.innerHTML = '<span class="num">&#9733;</span><span>Home &amp; Contents</span>';
  home.onclick = () => showHome();
  navEl.appendChild(home);

  let lastPart = null;
  BOOK.forEach((ch, i) => {
    if(ch.part !== lastPart){
      lastPart = ch.part;
      const p = document.createElement('div');
      p.className = 'navpart';
      p.textContent = 'Part ' + ch.part;
      navEl.appendChild(p);
    }
    const done = progress[ch.id];
    const d = document.createElement('div');
    d.className = 'navitem' + (currentChapter === i ? ' active' : '');
    d.innerHTML = '<span class="num">'+moduleNumber(ch)+'</span><span>'+ch.title+'</span>' +
      (done ? '<span class="tick">&#10003;</span>' : '');
    d.onclick = () => showChapter(i);
    navEl.appendChild(d);
  });

  const ep = document.createElement('div');
  ep.className = 'navpart';
  ep.textContent = 'Assessment';
  navEl.appendChild(ep);
  const ex = document.createElement('div');
  ex.className = 'navitem' + (currentChapter === 'exam' ? ' active' : '');
  const prev = examProgress();
  ex.innerHTML = '<span class="num">\u2605</span><span>Final Exam &mdash; '+EXAM_SIZE+' questions</span>' +
    (prev ? '<span class="tick">'+(Math.round(prev.score/prev.total*100))+'%</span>' : '');
  ex.onclick = () => showExamPage();
  navEl.appendChild(ex);

  updateProgressBar();
}

function updateProgressBar(){
  let done = 0;
  BOOK.forEach(ch => { if(progress[ch.id]) done++; });
  const pct = BOOK.length ? Math.round(done / BOOK.length * 100) : 0;
  $('#pctBar').style.width = pct + '%';
  $('#pctText').textContent = pct + '%';
}

function totalQuestions(){
  return BOOK.reduce((sum, ch) => sum + ch.quiz.length, 0);
}

function overallScore(){
  let score = 0, total = 0;
  BOOK.forEach(ch => { if(progress[ch.id]){ score += progress[ch.id].score; } });
  BOOK.forEach(ch => { if(progress[ch.id]){ total += progress[ch.id].total; } });
  return { score, total };
}

function showHome(){
  currentChapter = -1;
  crumbEl.innerHTML = 'Home';

  let cardsHtml = '';
  let currentPart = 0;
  let partCards = [];

  function flushPart(){
    if(partCards.length === 0) return;
    const meta = PARTS.find(p => p.n === currentPart) || { title:'Part '+currentPart, desc:'' };
    cardsHtml +=
      '<div class="parthead">' +
        '<div class="kicker">Part '+currentPart+'</div>' +
        '<div class="ttl">'+meta.title+'</div>' +
        '<div class="desc">'+meta.desc+'</div>' +
      '</div>' +
      '<div class="homecards">' + partCards.join('') + '</div>';
    partCards = [];
  }

  BOOK.forEach((ch,i) => {
    if(ch.part !== currentPart){ flushPart(); currentPart = ch.part; }
    const done = progress[ch.id];
    partCards.push('<div class="homecard" data-i="'+i+'">' +
      '<div class="n">MODULE '+moduleNumber(ch)+'</div>' +
      '<div class="tt">'+ch.title+'</div>' +
      '<div class="dd">'+ch.sub+'</div>' +
      '<div class="st">'+(done ? '&#10003; Completed &mdash; score '+done.score+'/'+done.total : ch.quiz.length+'-question quiz')+'</div>' +
      '</div>');
  });
  flushPart();

  let completed = 0;
  BOOK.forEach(ch => { if(progress[ch.id]) completed++; });
  const qTotal = totalQuestions();
  const ov = overallScore();

  contentEl.innerHTML =
    '<h1>CCNA Study Guide</h1>' +
    '<p class="subtitle">Complete Edition &middot; Modules 1&ndash;17 &middot; Introduction to Networks (ITN)</p>' +
    '<p>All four parts of the CCNA study guide merged into a single app: <strong>17 modules</strong> of teaching content with real Cisco IOS commands, plus <strong>' + qTotal + ' quiz questions</strong> with instant feedback &mdash; and a <strong>100-question final exam</strong> drawn from every module. Your scores save automatically in this browser.</p>' +
    '<div class="statgrid">' +
      '<div class="stat"><div class="v">17</div><div class="l">Modules</div></div>' +
      '<div class="stat"><div class="v">'+qTotal+'</div><div class="l">Module questions</div></div>' +
      '<div class="stat"><div class="v">100</div><div class="l">Final exam</div></div>' +
      '<div class="stat"><div class="v">'+completed+'/17</div><div class="l">Modules completed</div></div>' +
      '<div class="stat"><div class="v">'+(ov.total ? ov.score+'/'+ov.total : '&mdash;')+'</div><div class="l">Questions correct</div></div>' +
    '</div>' +
    '<div class="callout blue"><b>How to use this guide</b>Read a module carefully, then take the quiz. Each module has a 30-question quiz with instant feedback. Your scores save automatically &mdash; retake any quiz as often as you like. Use <em>Prev</em> and <em>Next</em> to move between modules, or jump to any module from the sidebar.</div>' +
    examHero() +
    '<h2 style="border:none;padding:0;margin-bottom:0">&nbsp;</h2>' +
    cardsHtml;

  contentEl.querySelectorAll('.homecard').forEach(c => {
    c.onclick = () => showChapter(parseInt(c.dataset.i,10));
  });
  const eb = contentEl.querySelector('#startExamBtn');
  if(eb) eb.onclick = () => { showExamPage(); };
  const ev = contentEl.querySelector('#examViewBtn');
  if(ev) ev.onclick = () => showExamPage();
  buildNav();
  window.scrollTo(0,0);
}

function examHero(){
  const prev = examProgress();
  return '<div class="examhero">' +
    '<span class="badge">Final Exam</span>' +
    '<h2>CCNA Practice Exam</h2>' +
    '<p>Test yourself across the whole course. '+EXAM_SIZE+' questions are drawn from all 17 modules, shuffled fresh every attempt, with a per-module breakdown at the end so you can see exactly where to revise.</p>' +
    '<div class="metrics">' +
      '<div><b>'+EXAM_SIZE+'</b>questions</div>' +
      '<div><b>17</b>modules covered</div>' +
      '<div><b>60%</b>pass mark</div>' +
      '<div><b>\u221e</b>retakes</div>' +
    '</div>' +
    '<button class="btn btn-gold btn-lg" id="startExamBtn">'+(prev ? 'Retake the final exam' : 'Start the final exam')+'</button>' +
    (prev ? '<div class="prev">Last attempt: <b style="color:#fff">'+prev.score+'/'+prev.total+'</b> ('+Math.round(prev.score/prev.total*100)+'%) on '+prev.date+'</div>' : '') +
  '</div>';
}

function showChapter(i){
  currentChapter = i;
  const ch = BOOK[i];
  crumbEl.innerHTML = '<b>Module '+moduleNumber(ch)+'</b> &nbsp;&middot;&nbsp; Part '+ch.part+' &nbsp;&middot;&nbsp; '+ch.title;
  contentEl.innerHTML =
    '<h1>'+ch.title+'</h1>' +
    '<p class="subtitle">'+ch.sub+'</p>' +
    ch.content +
    '<div class="quizwrap" id="quizArea"></div>';

  renderQuizIntro(i);
  buildNav();
  window.scrollTo(0,0);
}

function renderQuizIntro(i){
  const ch = BOOK[i];
  const area = $('#quizArea');
  const done = progress[ch.id];
  const n = ch.quiz.length;
  area.innerHTML =
    '<h2 style="border:none;margin-top:0">Module Quiz</h2>' +
    '<p style="font-family:system-ui,sans-serif;color:#5c6b7a;font-size:15px">'+n+' questions &middot; multiple choice &middot; instant feedback &middot; retake as often as you like.</p>' +
    (done ? '<div class="callout green"><b>Previous result</b>You scored '+done.score+' out of '+done.total+' on this module.</div>' : '') +
    '<button class="btn btn-gold" id="startQuizBtn" style="margin-top:10px">'+(done ? 'Retake the quiz' : 'Start the '+n+'-question quiz')+'</button>';
  $('#startQuizBtn').onclick = () => startQuiz(i);
}

function startQuiz(i){
  quiz = { ch: i, i: 0, answers: new Array(BOOK[i].quiz.length).fill(null), locked: false };
  renderQuestion();
}

/* ============================================================
   FINAL EXAM — 100 questions sampled from every module
   ============================================================ */
const EXAM_KEY = 'ccna.complete.finalExam';
const EXAM_SIZE = 100;

function examQuestions(){
  // Take the questions from every module, tagged with their source module,
  // then sample evenly so each module is represented in proportion.
  const pool = [];
  BOOK.forEach((ch, ci) => {
    ch.quiz.forEach((q, qi) => {
      pool.push({ q: q, ci: ci, qi: qi, id: ch.id, mod: moduleNumber(ch), part: ch.part, title: ch.title });
    });
  });

  // Even spread: walk every module round-robin until we have EXAM_SIZE items.
  // Modules are visited in a rotating order so no single module dominates a section.
  const byModule = BOOK.map((ch, ci) => ch.quiz.map((q, qi) => ({ q: q, ci: ci, qi: qi })));
  const picked = [];
  const cursors = byModule.map(() => 0);
  let guard = 0;
  while(picked.length < EXAM_SIZE && guard < 5000){
    guard++;
    let progressed = false;
    for(let m = 0; m < byModule.length && picked.length < EXAM_SIZE; m++){
      const c = cursors[m];
      if(c < byModule[m].length){
        picked.push(byModule[m][c]);
        cursors[m] = c + 1;
        progressed = true;
      }
    }
    if(!progressed) break;
  }
  return shuffle(picked).slice(0, EXAM_SIZE).map(p => {
    const ch = BOOK[p.ci];
    return { q: ch.quiz[p.qi], mod: moduleNumber(ch), title: ch.title, part: ch.part, chId: ch.id };
  });
}

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function examProgress(){
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(EXAM_KEY) || 'null'); } catch(e){ saved = null; }
  return saved;
}

function startFinalExam(){
  quiz = {
    final: true,
    i: 0,
    questions: examQuestions(),
    answers: new Array(EXAM_SIZE).fill(null),
    locked: false,
    startedAt: Date.now()
  };
  renderFinalQuestion();
}

/* Dedicated exam page — reachable from the sidebar and the home hero */
function showExamPage(){
  currentChapter = 'exam';
  crumbEl.innerHTML = '<b>Final Exam</b> &nbsp;&middot;&nbsp; '+EXAM_SIZE+' questions from all 17 modules';
  contentEl.innerHTML =
    '<div class="quizwrap" id="quizArea" style="border-top:none;padding-top:0;margin-top:0"></div>';
  renderFinalIntro();
  buildNav();
  window.scrollTo(0,0);
}

function renderFinalIntro(){
  const prev = examProgress();
  const area = $('#quizArea');
  area.innerHTML =
    '<div class="finalcard">' +
      '<div class="finalbadge">Final Exam</div>' +
      '<h2 class="finaltitle">CCNA Practice Exam</h2>' +
      '<p class="finalsub">'+EXAM_SIZE+' questions drawn from all 17 modules &middot; shuffled every attempt &middot; instant feedback &middot; weak-area breakdown at the end.</p>' +
      '<div class="finalmeta"><span><b>'+EXAM_SIZE+'</b> questions</span><span><b>17</b> modules</span><span><b>60%</b> to pass</span><span><b>Unlimited</b> retakes</span></div>' +
      (prev ? '<div class="callout green"><b>Last attempt</b>You scored '+prev.score+' out of '+prev.total+' ('+Math.round(prev.score/prev.total*100)+'%) on '+prev.date+'.</div>' : '') +
      '<button class="btn btn-gold btn-lg" id="startExamBtn">'+(prev ? 'Take the exam again' : 'Start the 100-question exam')+'</button>' +
    '</div>';
  $('#startExamBtn').onclick = () => startFinalExam();
}

function renderFinalQuestion(){
  const item = quiz.questions[quiz.i];
  const q = item.q;
  const total = quiz.questions.length;
  const answered = quiz.answers.filter(a => a !== null).length;
  const correctSoFar = quiz.answers.filter((a, idx) => a !== null && a === quiz.questions[idx].q[2]).length;
  const pct = Math.round((answered / total) * 100);

  const letters = ['A','B','C','D','E'];
  const opts = q[1].split('|');
  let optHtml = '';
  opts.forEach((o, oi) => {
    optHtml += '<button class="opt" data-o="'+oi+'"><span class="k">'+letters[oi]+'.</span><span>'+o+'</span></button>';
  });

  $('#quizArea').innerHTML =
    '<div class="quizcard">' +
      '<div class="quizhead">' +
        '<span class="pill">Question '+(quiz.i+1)+' of '+total+'</span>' +
        '<span class="modtag">Module '+item.mod+'</span>' +
        '<span>Score: <b style="color:#101c2c">'+correctSoFar+'</b></span>' +
      '</div>' +
      '<div class="bar"><span style="width:'+pct+'%"></span></div>' +
      '<div class="qtext">'+q[0]+'</div>' +
      '<div class="opts">'+optHtml+'</div>' +
      '<div class="fb" id="fb"></div>' +
      '<div class="qactions"><button class="btn btn-primary" id="quizNextBtn" disabled>'+(quiz.i === total-1 ? 'Finish exam' : 'Next question &rarr;')+'</button></div>' +
    '</div>';

  $('#quizArea').querySelectorAll('.opt').forEach(b => {
    b.onclick = () => chooseAnswer(parseInt(b.dataset.o,10));
  });
  $('#quizNextBtn').onclick = nextQuestion;
}

function showFinalResults(){
  const total = quiz.questions.length;
  let correct = 0;
  quiz.answers.forEach((a, i) => { if(a === quiz.questions[i].q[2]) correct++; });
  const pct = Math.round(correct / total * 100);
  const pass = pct >= 60;

  // Per-module breakdown so weak areas are visible
  const stats = {};
  quiz.questions.forEach((item, i) => {
    const k = item.mod;
    if(!stats[k]) stats[k] = { mod: k, title: item.title, right: 0, seen: 0 };
    stats[k].seen++;
    if(quiz.answers[i] === item.q[2]) stats[k].right++;
  });
  const rows = Object.values(stats).sort((a,b) => a.mod - b.mod);
  const weak = rows.filter(r => r.right / r.seen < 0.6).sort((a,b) => (a.right/a.seen) - (b.right/b.seen));

  try {
    localStorage.setItem(EXAM_KEY, JSON.stringify({
      score: correct, total: total,
      date: new Date().toLocaleDateString()
    }));
  } catch(e){}

  let breakdown = '<div class="breakdown"><h3>Performance by module</h3><div class="bdgrid">';
  rows.forEach(r => {
    const p = Math.round(r.right / r.seen * 100);
    const cls = p >= 75 ? 'hi' : (p >= 60 ? 'mid' : 'lo');
    breakdown += '<div class="bdrow">' +
      '<span class="bdmod">M'+r.mod+'</span>' +
      '<span class="bdname">'+r.title.replace(/^Module \d+: /,'')+'</span>' +
      '<span class="bdbar"><i class="'+cls+'" style="width:'+p+'%"></i></span>' +
      '<span class="bdscore">'+r.right+'/'+r.seen+'</span>' +
      '</div>';
  });
  breakdown += '</div></div>';

  let advice = '';
  if(weak.length){
    advice = '<div class="callout red" style="text-align:left;margin-top:26px"><b>Study these first</b>' +
      weak.slice(0,5).map(w => 'Module '+w.mod+' &mdash; '+w.title.replace(/^Module \d+: /,'')+' ('+Math.round(w.right/w.seen*100)+'%)').join('<br>') + '</div>';
  }

  let reviewHtml = '';
  const wrong = [];
  quiz.answers.forEach((a, i) => { if(a !== quiz.questions[i].q[2]) wrong.push(i); });
  if(wrong.length){
    reviewHtml += '<div class="review"><h3>Review your '+wrong.length+' missed question'+(wrong.length>1?'s':'')+'</h3>';
    wrong.forEach(i => {
      const item = quiz.questions[i];
      const q = item.q;
      const opts = q[1].split('|');
      reviewHtml += '<div class="reviewitem">' +
        '<div class="qq">Q'+(i+1)+' (Module '+item.mod+'). '+q[0]+'</div>' +
        '<div class="aa">Your answer: '+(quiz.answers[i] !== null ? opts[quiz.answers[i]] : 'Not answered')+'</div>' +
        '<div class="bb">Correct answer: '+opts[q[2]]+'</div>' +
        (q[3] ? '<div class="ex">'+q[3]+'</div>' : '') +
        '</div>';
    });
    reviewHtml += '</div>';
  } else {
    reviewHtml = '<div class="callout green" style="text-align:left;margin-top:28px"><b>Perfect score</b>You answered every question correctly.</div>';
  }

  const verdict = pct >= 90 ? 'Exam ready' : pct >= 75 ? 'Strong result' : (pass ? 'Passed' : 'Not yet');
  const sub = pct >= 90 ? 'Excellent. You are ready for the real exam.'
    : pct >= 75 ? 'A solid pass. Tighten up the weak modules below.'
    : pass ? 'You passed. Review the weak modules and retake for a higher score.'
    : 'Below the 60% pass mark — work through the weak modules and retake.';
  const ringColor = pct >= 90 ? '#1f7a4d' : pct >= 75 ? '#2f6f8f' : pass ? '#c8963e' : '#b3261e';

  $('#quizArea').innerHTML =
    '<div class="quizcard">' +
      '<div class="result">' +
        '<div class="score-ring" style="background:conic-gradient('+ringColor+' '+pct+'%, #ece6d9 0)">' +
          '<div class="inner"><div class="num">'+pct+'%</div><div class="den">'+correct+' / '+total+'</div></div>' +
        '</div>' +
        '<div class="verdict">'+verdict+(pass ? ' <span class="passpill">PASS</span>' : ' <span class="failpill">FAIL</span>')+'</div>' +
        '<div class="verdict-sub">'+sub+'</div>' +
        '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">' +
          '<button class="btn btn-gold" id="retryBtn">&#8635; Retake exam (new questions)</button>' +
          '<button class="btn btn-ghost" id="homeBtn">Back to contents</button>' +
        '</div>' +
      '</div>' +
      advice +
      breakdown +
      reviewHtml +
    '</div>';

  $('#retryBtn').onclick = () => startFinalExam();
  $('#homeBtn').onclick = () => showHome();

  buildNav();
  document.querySelector('.quizcard').scrollIntoView({behavior:'smooth', block:'start'});
}

function renderQuestion(){
  if(quiz.final) return renderFinalQuestion();
  const ch = BOOK[quiz.ch];
  const q = ch.quiz[quiz.i];
  const total = ch.quiz.length;
  const answered = quiz.answers.filter(a => a !== null).length;
  const correctSoFar = quiz.answers.filter((a,idx) => a !== null && a === ch.quiz[idx][2]).length;
  const pct = Math.round((answered/total)*100);

  const letters = ['A','B','C','D','E'];
  const opts = q[1].split('|');
  let optHtml = '';
  opts.forEach((o, oi) => {
    optHtml += '<button class="opt" data-o="'+oi+'"><span class="k">'+letters[oi]+'.</span><span>'+o+'</span></button>';
  });

  $('#quizArea').innerHTML =
    '<div class="quizcard">' +
      '<div class="quizhead">' +
        '<span class="pill">Question '+(quiz.i+1)+' of '+total+'</span>' +
        '<span>Score so far: <b style="color:#101c2c">'+correctSoFar+'</b></span>' +
      '</div>' +
      '<div class="bar"><span style="width:'+pct+'%"></span></div>' +
      '<div class="qtext">'+q[0]+'</div>' +
      '<div class="opts">'+optHtml+'</div>' +
      '<div class="fb" id="fb"></div>' +
      '<div class="qactions"><button class="btn btn-primary" id="quizNextBtn" disabled>'+(quiz.i === total-1 ? 'Finish &amp; see results' : 'Next question &rarr;')+'</button></div>' +
    '</div>';

  const card = $('#quizArea');
  card.querySelectorAll('.opt').forEach(b => { b.onclick = () => chooseAnswer(parseInt(b.dataset.o,10)); });
  $('#quizNextBtn').onclick = nextQuestion;
}

function chooseAnswer(oi){
  if(quiz.locked) return;
  quiz.locked = true;
  const q = quiz.final ? quiz.questions[quiz.i].q : BOOK[quiz.ch].quiz[quiz.i];
  const correct = q[2];
  quiz.answers[quiz.i] = oi;

  $('#quizArea').querySelectorAll('.opt').forEach((b, idx) => {
    b.disabled = true;
    if(idx === correct) b.classList.add('correct');
    if(idx === oi && oi !== correct) b.classList.add('wrong');
  });

  const fb = $('#fb');
  if(oi === correct){
    fb.className = 'fb good show';
    fb.innerHTML = '<span class="tag">&#10003; Correct</span>' + (q[3] || '');
  } else {
    fb.className = 'fb bad show';
    fb.innerHTML = '<span class="tag">&#10007; Not quite</span>Correct answer: <strong>'+q[1].split('|')[correct]+'</strong>' +
      (q[3] ? '<br><span style="color:#5c6b7a;font-size:14.5px">'+q[3]+'</span>' : '');
  }
  $('#quizNextBtn').disabled = false;
}

function nextQuestion(){
  if(quiz.final){
    if(quiz.i < quiz.questions.length - 1){
      quiz.i++;
      quiz.locked = false;
      renderFinalQuestion();
      document.querySelector('.quizcard').scrollIntoView({behavior:'smooth', block:'start'});
    } else {
      showFinalResults();
    }
    return;
  }
  const ch = BOOK[quiz.ch];
  if(quiz.i < ch.quiz.length - 1){
    quiz.i++;
    quiz.locked = false;
    renderQuestion();
    document.querySelector('.quizcard').scrollIntoView({behavior:'smooth', block:'start'});
  } else {
    showResults();
  }
}

function showResults(){
  if(quiz.final) return showFinalResults();
  const ch = BOOK[quiz.ch];
  const total = ch.quiz.length;
  let correct = 0;
  quiz.answers.forEach((a, i) => { if(a === ch.quiz[i][2]) correct++; });
  const pct = Math.round(correct/total*100);

  progress[ch.id] = { score: correct, total: total };
  saveProgress();

  let verdict, sub, ringColor;
  if(pct >= 90){ verdict = 'Outstanding'; sub = 'You have mastered this module. Move on with confidence.'; ringColor = '#1f7a4d'; }
  else if(pct >= 75){ verdict = 'Well done'; sub = 'A solid grasp. Review the missed items and continue.'; ringColor = '#2f6f8f'; }
  else if(pct >= 60){ verdict = 'Passed'; sub = 'You have the basics. Re-read the sections covering your missed questions.'; ringColor = '#c8963e'; }
  else { verdict = 'Keep studying'; sub = 'Re-read the module and try again — CCNA rewards repetition.'; ringColor = '#b3261e'; }

  let reviewHtml = '';
  const wrong = [];
  quiz.answers.forEach((a, i) => { if(a !== ch.quiz[i][2]) wrong.push(i); });
  if(wrong.length){
    reviewHtml += '<div class="review"><h3>Review your '+wrong.length+' missed question'+(wrong.length>1?'s':'')+'</h3>';
    wrong.forEach(i => {
      const q = ch.quiz[i];
      const opts = q[1].split('|');
      reviewHtml += '<div class="reviewitem">' +
        '<div class="qq">Q'+(i+1)+'. '+q[0]+'</div>' +
        '<div class="aa">Your answer: '+(quiz.answers[i] !== null ? opts[quiz.answers[i]] : 'Not answered')+'</div>' +
        '<div class="bb">Correct answer: '+opts[q[2]]+'</div>' +
        (q[3] ? '<div class="ex">'+q[3]+'</div>' : '') +
        '</div>';
    });
    reviewHtml += '</div>';
  } else {
    reviewHtml = '<div class="callout green" style="text-align:left;margin-top:28px"><b>Perfect score</b>You answered every question correctly.</div>';
  }

  const isLast = quiz.ch === BOOK.length - 1;

  $('#quizArea').innerHTML =
    '<div class="quizcard">' +
      '<div class="result">' +
        '<div class="score-ring" style="background:conic-gradient('+ringColor+' '+pct+'%, #ece6d9 0)">' +
          '<div class="inner"><div class="num">'+pct+'%</div><div class="den">'+correct+' / '+total+'</div></div>' +
        '</div>' +
        '<div class="verdict">'+verdict+'</div>' +
        '<div class="verdict-sub">'+sub+'</div>' +
        '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">' +
          '<button class="btn btn-ghost" id="retryBtn">&#8635; Retake quiz</button>' +
          (!isLast ? '<button class="btn btn-gold" id="nextChBtn">Next module &rarr;</button>'
                   : '<button class="btn btn-gold" id="homeBtn">Back to contents</button>') +
        '</div>' +
      '</div>' +
      reviewHtml +
    '</div>';

  $('#retryBtn').onclick = () => startQuiz(quiz.ch);
  if(!isLast) $('#nextChBtn').onclick = () => showChapter(quiz.ch + 1);
  else $('#homeBtn').onclick = () => showHome();

  buildNav();
  document.querySelector('.quizcard').scrollIntoView({behavior:'smooth', block:'start'});
}

$('#prevBtn').onclick = () => {
  if(currentChapter === -1) return;
  if(currentChapter === 'exam'){ showHome(); return; }
  if(currentChapter === 0) showHome(); else showChapter(currentChapter - 1);
};
$('#nextBtn').onclick = () => {
  if(currentChapter === -1) showChapter(0);
  else if(currentChapter === 'exam') showHome();
  else if(currentChapter < BOOK.length - 1) showChapter(currentChapter + 1);
  else showExamPage();
};

document.addEventListener('keydown', e => {
  if(e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if(e.key === 'ArrowLeft') $('#prevBtn').click();
  if(e.key === 'ArrowRight') $('#nextBtn').click();
});

showHome();
</script>
</body>
</html>
