<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCNA Study Guide — Complete (All 17 Modules)</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --paper:#f7f4ed; --ink:#1f2933; --muted:#5c6b7a; --line:#ddd6c8;
    --navy:#101c2c; --navy2:#1b2c44; --accent:#c8963e; --accent2:#2f6f8f;
    --ok:#1f7a4d; --bad:#b3261e; --radius:10px;
  }
  body{
    font-family:Georgia,'Times New Roman',serif;
    background:var(--paper); color:var(--ink); line-height:1.75; font-size:17px;
  }
  .app{display:flex;min-height:100vh}
  aside{
    width:340px; flex:0 0 340px; background:var(--navy); color:#cbd8e6;
    position:fixed; top:0; bottom:0; left:0; overflow-y:auto; padding:0 0 40px;
  }
  aside .brand{
    padding:24px 22px 18px; border-bottom:1px solid rgba(255,255,255,.12);
    position:sticky; top:0; background:var(--navy); z-index:5;
  }
  aside .brand h1{font-size:18px;color:#fff;letter-spacing:.4px;line-height:1.35}
  aside .brand p{font-size:12px;color:#8fa6bd;font-family:system-ui,sans-serif;margin-top:5px;line-height:1.5}
  nav{padding:14px 12px}
  .navpart{
    font-family:system-ui,sans-serif; font-size:10.5px; font-weight:700; letter-spacing:1.1px;
    text-transform:uppercase; color:#6d8399; padding:16px 12px 7px;
  }
  .navitem{
    display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border-radius:8px;
    cursor:pointer; font-family:system-ui,-apple-system,sans-serif; font-size:13.5px;
    color:#b9c9da; margin-bottom:3px; transition:.15s; line-height:1.45;
  }
  .navitem:hover{background:var(--navy2); color:#fff}
  .navitem.active{background:var(--accent); color:#1a1206; font-weight:600}
  .navitem .num{
    font-size:11px; font-weight:700; min-width:22px; height:20px; border-radius:5px;
    background:rgba(255,255,255,.12); display:grid; place-items:center; margin-top:2px;
  }
  .navitem.active .num{background:rgba(0,0,0,.22); color:#fff}
  .navitem .tick{margin-left:auto; color:#5fd39a; font-weight:700}
  .navitem.active .tick{color:#0b3d24}
  .progressbox{padding:16px 22px; font-family:system-ui,sans-serif; font-size:12.5px; color:#8fa6bd}
  .progressbox .outer{height:7px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden;margin-top:8px}
  .progressbox .inner{height:100%;background:linear-gradient(90deg,var(--accent),#e2c073);width:0%;transition:.4s}

  main{margin-left:340px; flex:1; padding:0 clamp(18px,5vw,72px) 120px; max-width:1020px}
  .topbar{
    display:flex; justify-content:space-between; align-items:center; gap:14px;
    padding:18px 0 14px; border-bottom:2px solid var(--line); margin-bottom:34px;
    font-family:system-ui,sans-serif; font-size:13px; color:var(--muted);
  }
  .topbar b{color:var(--navy)}
  .btn{
    font-family:system-ui,sans-serif; font-size:13.5px; font-weight:600; cursor:pointer;
    border:none; border-radius:8px; padding:10px 18px; transition:.15s;
  }
  .btn-primary{background:var(--navy); color:#fff}
  .btn-primary:hover{background:#25384f}
  .btn-gold{background:var(--accent); color:#22190a}
  .btn-gold:hover{background:#dca94d}
  .btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--muted)}
  .btn-ghost:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  h1{font-size:clamp(26px,3.4vw,38px); line-height:1.2; color:var(--navy); margin-bottom:8px; letter-spacing:-.4px}
  .subtitle{font-family:system-ui,sans-serif; font-size:14px; color:var(--muted); margin-bottom:34px}
  h2{
    font-size:22px; color:var(--navy); margin:44px 0 14px; padding-bottom:8px;
    border-bottom:1px solid var(--line);
  }
  h3{font-size:17.5px; color:var(--accent2); margin:26px 0 8px; font-family:system-ui,sans-serif}
  h4{font-size:15.5px; color:var(--navy); margin:18px 0 6px; font-family:system-ui,sans-serif}
  p{margin-bottom:14px}
  ul,ol{margin:0 0 16px 24px}
  li{margin-bottom:7px}
  strong{color:#0f1b28}
  code{
    font-family:ui-monospace,Consolas,monospace; font-size:14px; background:#eae4d6;
    padding:1.5px 6px; border-radius:5px; color:#7a3d10;
  }
  pre.cli{
    background:#101c2c; color:#d7e3f0; padding:16px 20px; border-radius:10px;
    overflow-x:auto; font-family:ui-monospace,Consolas,monospace; font-size:13.8px;
    line-height:1.65; margin:16px 0 22px;
  }
  pre.cli .prompt{color:#7dc4ff}
  pre.cli .cmt{color:#7a90a8}
  table{
    width:100%; border-collapse:collapse; margin:18px 0 24px; font-size:14.8px;
    font-family:system-ui,sans-serif; background:#fff; border-radius:var(--radius); overflow:hidden;
    box-shadow:0 1px 3px rgba(0,0,0,.07);
  }
  th{background:var(--navy); color:#fff; text-align:left; padding:11px 14px; font-size:13.5px; font-weight:600}
  td{padding:10px 14px; border-top:1px solid #eee7d8; vertical-align:top}
  tr:nth-child(even) td{background:#fbf9f4}
  .callout{
    background:#fff8e8; border-left:5px solid var(--accent); padding:15px 20px;
    border-radius:0 8px 8px 0; margin:20px 0; font-size:16px;
  }
  .callout.blue{background:#eef6fb; border-left-color:var(--accent2)}
  .callout.green{background:#eefaf3; border-left-color:var(--ok)}
  .callout.red{background:#fdefee; border-left-color:var(--bad)}
  .callout b{font-family:system-ui,sans-serif;font-size:13px;text-transform:uppercase;letter-spacing:.6px;display:block;margin-bottom:5px;color:var(--muted)}

  .quizwrap{margin-top:60px; border-top:3px double var(--line); padding-top:34px}
  .quizcard{
    background:#fff; border:1px solid var(--line); border-radius:14px; padding:28px 30px;
    box-shadow:0 4px 18px rgba(16,28,44,.07);
  }
  .quizhead{
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;
    font-family:system-ui,sans-serif; font-size:13px; color:var(--muted); margin-bottom:14px;
  }
  .quizhead .pill{background:#eef2f6;border-radius:99px;padding:4px 13px;font-weight:600;color:var(--navy)}
  .bar{height:8px;background:#ece6d9;border-radius:99px;overflow:hidden;margin-bottom:26px}
  .bar span{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),#63a8c9);width:0;transition:.35s}
  .qtext{font-size:19px; font-weight:600; color:var(--navy); margin-bottom:22px; line-height:1.5; font-family:system-ui,sans-serif}
  .opts{display:flex;flex-direction:column;gap:11px}
  .opt{
    text-align:left; font-family:system-ui,sans-serif; font-size:15.5px; padding:14px 18px;
    background:#fbf9f4; border:1.5px solid var(--line); border-radius:10px; cursor:pointer;
    transition:.14s; color:var(--ink); display:flex; gap:12px; align-items:flex-start; line-height:1.5;
  }
  .opt .k{font-weight:700; color:var(--accent2); min-width:20px;}
  .opt:hover:not(:disabled){border-color:var(--accent2); background:#f2f8fb; transform:translateX(3px)}
  .opt:disabled{cursor:default}
  .opt.correct{background:#eaf9f1;border-color:var(--ok);color:#0f4d30;font-weight:600}
  .opt.correct .k{color:var(--ok)}
  .opt.wrong{background:#fdedec;border-color:var(--bad);color:#7a1810}
  .opt.wrong .k{color:var(--bad)}
  .fb{margin-top:20px;padding:15px 18px;border-radius:10px;font-size:15.5px;display:none;font-family:system-ui,sans-serif}
  .fb.show{display:block}
  .fb.good{background:#eaf9f1;border-left:5px solid var(--ok)}
  .fb.bad{background:#fdedec;border-left:5px solid var(--bad)}
  .fb .tag{font-weight:700;display:block;margin-bottom:4px}
  .qactions{margin-top:22px;display:flex;justify-content:flex-end;gap:10px}

  .result{text-align:center;padding:14px 0}
  .score-ring{
    width:150px;height:150px;border-radius:50%;margin:0 auto 22px;display:grid;place-items:center;
    font-family:system-ui,sans-serif;
  }
  .score-ring .inner{width:118px;height:118px;background:#fff;border-radius:50%;display:grid;place-items:center;flex-direction:column}
  .score-ring .num{font-size:38px;font-weight:800;color:var(--navy);line-height:1}
  .score-ring .den{font-size:13px;color:var(--muted);margin-top:3px}
  .verdict{font-size:22px;font-weight:700;color:var(--navy);margin-bottom:6px;font-family:system-ui,sans-serif}
  .verdict-sub{color:var(--muted);font-family:system-ui,sans-serif;font-size:14.5px;margin-bottom:26px}
  .review{text-align:left;margin-top:30px;border-top:1px solid var(--line);padding-top:24px}
  .review h3{margin-top:0}
  .reviewitem{border-left:4px solid var(--bad);background:#fdf6f5;padding:13px 17px;border-radius:0 8px 8px 0;margin-bottom:12px;font-family:system-ui,sans-serif;font-size:14.5px}
  .reviewitem .qq{font-weight:600;color:var(--navy);margin-bottom:6px}
  .reviewitem .aa{color:var(--bad)}
  .reviewitem .bb{color:var(--ok);font-weight:600}
  .reviewitem .ex{color:var(--muted);font-size:13.5px;margin-top:5px;font-style:italic}

  .homecards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:22px}
  .homecard{
    background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;cursor:pointer;
    font-family:system-ui,sans-serif;transition:.16s;
  }
  .homecard:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 6px 18px rgba(16,28,44,.09)}
  .homecard .n{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:1px}
  .homecard .tt{font-size:15.5px;font-weight:600;color:var(--navy);margin:5px 0 5px;line-height:1.35}
  .homecard .dd{font-size:12.6px;color:var(--muted);line-height:1.5}
  .homecard .st{font-size:11.5px;margin-top:9px;font-weight:600;color:var(--ok)}

  .parthead{
    margin:56px 0 18px; padding-bottom:12px; border-bottom:3px double var(--line);
    font-family:system-ui,sans-serif;
  }  .parthead .kicker{font-size:11px;font-weight:700;letter-spacing:1.4px;color:var(--accent);text-transform:uppercase}
  .parthead .ttl{font-size:24px;font-weight:700;color:var(--navy);margin-top:4px;font-family:Georgia,serif}
  .parthead .desc{font-size:13.5px;color:var(--muted);margin-top:6px}

  .statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:22px 0 6px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;font-family:system-ui,sans-serif}
  .stat .v{font-size:26px;font-weight:800;color:var(--navy);line-height:1.1}
  .stat .l{font-size:12px;color:var(--muted);margin-top:3px}

  /* ---------- Final exam ---------- */
  .examhero{
    background:linear-gradient(135deg,var(--navy) 0%,#22374f 55%,#2f4a66 100%);
    color:#eaf1f8; border-radius:16px; padding:30px 34px; margin:30px 0 10px;
    font-family:system-ui,sans-serif; position:relative; overflow:hidden;
    box-shadow:0 8px 26px rgba(16,28,44,.18);
  }
  .examhero:after{
    content:''; position:absolute; right:-60px; top:-60px; width:220px; height:220px;
    border-radius:50%; background:rgba(200,150,62,.13);
  }
  .examhero .badge{
    display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:1.3px;
    text-transform:uppercase; background:var(--accent); color:#241a06;
    padding:4px 11px; border-radius:99px;
  }
  .examhero h2{font-size:25px; color:#fff; margin:12px 0 7px; border:none; padding:0; font-family:Georgia,serif}
  .examhero p{font-size:14px; color:#bed0e2; margin-bottom:18px; max-width:620px}
  .examhero .metrics{display:flex; flex-wrap:wrap; gap:22px; margin-bottom:20px; position:relative; z-index:1}
  .examhero .metrics div{font-size:12px; color:#8fa6bd}
  .examhero .metrics b{display:block; font-size:20px; color:#fff; font-weight:800}
  .btn-lg{padding:13px 26px; font-size:14.5px}
  .examhero .prev{font-size:12.5px; color:#8fa6bd; margin-top:14px; position:relative; z-index:1}

  .finalcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:30px 34px;box-shadow:0 4px 18px rgba(16,28,44,.07);font-family:system-ui,sans-serif}
  .finalbadge{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;background:var(--navy);color:#fff;padding:4px 11px;border-radius:99px}
  .finaltitle{font-size:24px;color:var(--navy);margin:12px 0 6px;border:none;padding:0}
  .finalsub{font-size:14px;color:var(--muted);margin-bottom:20px}
  .finalmeta{display:flex;flex-wrap:wrap;gap:20px;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:20px;font-size:12.5px;color:var(--muted)}
  .finalmeta b{color:var(--navy);font-size:15px;display:block}
  .modtag{background:#fdf4e3;color:#8a6420;border-radius:99px;padding:3px 11px;font-size:11.5px;font-weight:700}

  .passpill{background:#1f7a4d;color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;vertical-align:middle;letter-spacing:.6px}
  .failpill{background:#b3261e;color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;vertical-align:middle;letter-spacing:.6px}

  .breakdown{margin-top:32px;border-top:1px solid var(--line);padding-top:24px;text-align:left}
  .breakdown h3{margin-top:0}
  .bdgrid{display:flex;flex-direction:column;gap:7px}
  .bdrow{display:grid;grid-template-columns:44px 1fr 130px 52px;align-items:center;gap:10px;font-family:system-ui,sans-serif;font-size:12.8px}
  .bdmod{font-weight:700;color:var(--accent2);font-size:11.5px}
  .bdname{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bdbar{height:7px;background:#ece6d9;border-radius:99px;overflow:hidden}
  .bdbar i{display:block;height:100%;border-radius:99px}
  .bdbar i.hi{background:#1f7a4d} .bdbar i.mid{background:#c8963e} .bdbar i.lo{background:#b3261e}
  .bdscore{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
  @media(max-width:700px){
    .bdrow{grid-template-columns:38px 1fr 52px;grid-template-areas:'m n s' 'm b b'}
    .bdmod{grid-area:m} .bdname{grid-area:n} .bdbar{grid-area:b} .bdscore{grid-area:s}
  }

  @media(max-width:900px){
    aside{position:static;width:100%;flex:none;max-height:none}
    .app{flex-direction:column}
    main{margin-left:0;padding:0 20px 90px}
    aside{position:relative;top:auto;bottom:auto}
    aside .brand{position:static}
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <h1>CCNA Study Guide</h1>
      <p>Complete Edition &middot; Modules 1&ndash;17 &middot; Introduction to Networks<br>17 modules &middot; 510 quiz questions</p>
    </div>
    <nav id="nav"></nav>
    <div class="progressbox">
      <div>Overall progress <b id="pctText" style="color:#fff">0%</b></div>
      <div class="outer"><div class="inner" id="pctBar"></div></div>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <div id="crumb">Home</div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost" id="prevBtn">&larr; Prev</button>
        <button class="btn btn-ghost" id="nextBtn">Next &rarr;</button>
      </div>
    </div>
    <div id="content"></div>
  </main>
</div>

<script>
/* ============================================================
   CCNA STUDY GUIDE — COMPLETE EDITION (Modules 1–17)
   Merged from Part 1 (1–4), Part 2 (5–8), Part 3 (9–12), Part 4 (13–17)
   Quiz item: [question, "opt1|opt2|opt3|opt4", correctIndex, explanation]

   Modules are loaded from separate data chunks (module01..module17)
   that register into window.CCNA_MODULES.
   ============================================================ */
window.CCNA_MODULES = {};
</script>
<script>
/* ================= PART 1 · MODULE 1 ================= */
window.CCNA_MODULES.m1 = {
id:'m1',
part:1,
title:'Module 1: Introduction to Networks',
sub:'Networks in our lives · components · topologies · types · connections · reliability · trends · security · careers',
content:`
<h2>1.1 Networks Affect Our Lives</h2>
<p>Networks connect people, devices and information. They power everything from sending a text message to running global financial systems. Common uses:</p>
<ul>
  <li><strong>Communication</strong> &mdash; email, instant messaging, voice and video calls.</li>
  <li><strong>Collaboration</strong> &mdash; shared documents, wikis, project tools.</li>
  <li><strong>Information access</strong> &mdash; web, streaming, cloud apps.</li>
  <li><strong>Commerce</strong> &mdash; e-commerce, banking, point-of-sale.</li>
  <li><strong>Entertainment</strong> &mdash; gaming, streaming media, social media.</li>
  <li><strong>Critical infrastructure</strong> &mdash; power grids, traffic systems, hospitals.</li>
</ul>

<h2>1.2 Network Components</h2>
<p>Every network has three broad categories of components:</p>
<table>
  <tr><th>Category</th><th>Description</th><th>Examples</th></tr>
  <tr><td><strong>End devices (hosts)</strong></td><td>Source or destination of a message. Each has a unique address.</td><td>PCs, laptops, servers, tablets, smartphones, printers, VoIP phones, IoT devices</td></tr>
  <tr><td><strong>Intermediary devices</strong></td><td>Move data between end devices; can regenerate and retransmit signals</td><td>Switches, routers, wireless access points, firewalls, modems</td></tr>
  <tr><td><strong>Network media</strong></td><td>The physical path for data</td><td>Copper cable, fiber optic cable, wireless (radio) transmission</td></tr>
</table>
<p>End devices are also called <strong>hosts</strong>. Each host has a <strong>NIC (Network Interface Card)</strong> that provides the physical connection to the network. Not every device connects directly &mdash; printers or scanners may be <strong>peripherals</strong> connected to a host and share that host's network access.</p>

<h2>1.3 Network Representations and Topologies</h2>
<p>Network diagrams use standard icons to represent devices. Two types of topology diagram are used:</p>
<ul>
  <li><strong>Physical topology</strong> &mdash; shows the actual physical location and cable layout of devices.</li>
  <li><strong>Logical topology</strong> &mdash; shows the addressing scheme, ports, and logical flow of data. Does not show physical location.</li>
</ul>
<table>
  <tr><th>Icon</th><th>Represents</th></tr>
  <tr><td>Circle with arrow</td><td>End device</td></tr>
  <tr><td>Rectangle with arrows</td><td>Intermediary device</td></tr>
  <tr><td>Lightning bolt line</td><td>Wireless media</td></tr>
  <tr><td>Straight line</td><td>Wired media</td></tr>
</table>

<h2>1.4 Common Types of Networks</h2>
<p>Networks are described by <strong>size</strong> and <strong>geographic scope</strong>:</p>
<table>
  <tr><th>Type</th><th>Scope</th><th>Example</th></tr>
  <tr><td>SOHO (Small Office / Home Office)</td><td>Single room / home</td><td>Home Wi-Fi with a router</td></tr>
  <tr><td>SMB (Small-Medium Business)</td><td>One office / a few rooms</td><td>Small business LAN</td></tr>
  <tr><td>Enterprise</td><td>Multiple buildings / sites</td><td>Corporate campus, multinational</td></tr>
  <tr><td><strong>LAN</strong> (Local Area Network)</td><td>Single building / campus</td><td>Office Ethernet, home Wi-Fi</td></tr>
  <tr><td><strong>WAN</strong> (Wide Area Network)</td><td>Country / global</td><td>The Internet, ISP backbone, MPLS</td></tr>
  <tr><td><strong>WLAN</strong></td><td>Wireless LAN &mdash; building</td><td>Corporate Wi-Fi</td></tr>
  <tr><td><strong>SAN</strong> (Storage Area Network)</td><td>Data center</td><td>Fibre Channel storage fabric</td></tr>
  <tr><td><strong>MAN</strong> (Metropolitan Area Network)</td><td>A city</td><td>City fibre network</td></tr>
</table>
<p>A key distinction:</p>
<ul>
  <li><strong>LAN</strong> &mdash; administered by a single organisation; provides high-speed bandwidth to internal devices and end users.</li>
  <li><strong>WAN</strong> &mdash; administered by a service provider or ISP; connects LANs across large distances.</li>
</ul>

<h3>Converged networks</h3>
<p>A <strong>converged network</strong> carries multiple service types &mdash; data, voice, video, and control &mdash; over the same infrastructure. Modern networks are converged: one set of cables and devices handles everything.</p>

<h3>Network architecture tiers</h3>
<table>
  <tr><th>Architecture</th><th>Description</th></tr>
  <tr><td><strong>Fault-tolerant</strong></td><td>Has redundant paths and devices; no single point of failure</td></tr>
  <tr><td><strong>Scalable</strong></td><td>Can grow quickly to support new users and applications</td></tr>
  <tr><td><strong>QoS-enabled</strong></td><td>Manages traffic so delay-sensitive services get priority</td></tr>
  <tr><td><strong>Secure</strong></td><td>Protects confidentiality, integrity and availability of data</td></tr>
</table>

<h2>1.5 Internet Connections</h2>
<p>Home and small-office users connect to an ISP in several ways:</p>
<table>
  <tr><th>Type</th><th>Description</th><th>Notes</th></tr>
  <tr><td>Dial-up</td><td>Uses a phone line and modem</td><td>Very slow, legacy</td></tr>
  <tr><td>DSL</td><td>Digital Subscriber Line over phone line</td><td>High-speed, always-on, download &gt; upload</td></tr>
  <tr><td>Cable</td><td>Over cable TV coax</td><td>High-speed, always-on, download &gt; upload</td></tr>
  <tr><td>Satellite</td><td>Via satellite dish</td><td>Works in remote areas; higher latency</td></tr>
  <tr><td>Cellular</td><td>3G, 4G, 5G</td><td>Mobile broadband, good where wired is unavailable</td></tr>
  <tr><td>Dedicated leased line</td><td>Reserved circuit from the provider</td><td>Expensive; used by businesses for reliability</td></tr>
  <tr><td>Metro Ethernet</td><td>Ethernet WAN service across a city</td><td>Common for business WAN</td></tr>
  <tr><td>Business DSL</td><td>SDSL, ADSL variants</td><td>Business-grade DSL</td></tr>
</table>
<p>Enterprise networks often use <strong>business-class</strong> connections such as MPLS VPN, Metro Ethernet, or dedicated fiber.</p>

<h2>1.6 Reliable Networks</h2>
<h3>1.6.1 Network Architecture</h3>
<p>Four pillars of a reliable network: <strong>fault tolerance, scalability, quality of service, and security</strong>.</p>

<h3>1.6.2 Fault Tolerance</h3>
<p>A fault-tolerant network keeps working when a component fails. It does this with:</p>
<ul>
  <li><strong>Redundancy</strong> &mdash; multiple paths, multiple devices.</li>
  <li><strong>Packet switching</strong> &mdash; data is broken into packets that can take different paths.</li>
  <li><strong>No single point of failure</strong> &mdash; losing one link or device does not take the network down.</li>
</ul>

<h3>1.6.3 Scalability</h3>
<p>A scalable network can grow without redesign. It uses <strong>hierarchical design</strong> and <strong>open standards</strong> so new devices and sites can be added easily.</p>

<h3>1.6.4 Quality of Service (QoS)</h3>
<p>QoS gives priority to certain traffic so that delay-sensitive services (voice, video) work well even when the network is busy. Without QoS, real-time traffic competes equally with bulk traffic and quality suffers.</p>

<h3>1.6.5 Network Security</h3>
<p>Two main categories of security concern:</p>
<ul>
  <li><strong>Infrastructure security</strong> &mdash; physically securing devices and preventing unauthorised access to network equipment.</li>
  <li><strong>Information security</strong> &mdash; protecting data as it moves through the network. Encompasses the CIA triad: confidentiality, integrity, availability.</li>
</ul>
<p>Common security goals:</p>
<ul>
  <li>Prevent unauthorised users from accessing the network or data.</li>
  <li>Prevent users from modifying data they should not.</li>
  <li>Prevent damage to data or systems.</li>
</ul>

<h2>1.7 Network Trends</h2>
<h3>1.7.1 Recent Trends</h3>
<ul>
  <li>Bring Your Own Device (BYOD)</li>
  <li>Online collaboration</li>
  <li>Video communications</li>
  <li>Cloud computing</li>
  <li>Smart home and IoT</li>
  <li>Powerline networking</li>
  <li>Wireless broadband</li>
</ul>

<h3>1.7.2 BYOD</h3>
<p>Employees use personal devices (laptops, tablets, phones) on the corporate network. This drives need for stronger security policy and network segmentation.</p>

<h3>1.7.3 Online Collaboration</h3>
<p>Tools like Cisco Webex, Microsoft Teams, Slack and Google Workspace let teams work together in real time from anywhere.</p>

<h3>1.7.4 Video Communications</h3>
<p>Video is now a primary communication method &mdash; conferences, webinars, telemedicine, distance learning. Requires QoS and sufficient bandwidth.</p>

<h3>1.7.6 Cloud Computing</h3>
<p>Computing resources delivered as a service over the internet:</p>
<table>
  <tr><th>Model</th><th>Provides</th><th>Example</th></tr>
  <tr><td>Public cloud</td><td>Services available to anyone</td><td>AWS, Azure, Google Cloud</td></tr>
  <tr><td>Private cloud</td><td>Services within one organisation</td><td>Internal OpenStack cluster</td></tr>
  <tr><td>Hybrid cloud</td><td>Mix of public and private</td><td>On-prem + AWS backup</td></tr>
  <tr><td>Community cloud</td><td>Shared by organisations with common needs</td><td>Government, healthcare consortium</td></tr>
</table>
<p>Cloud service categories: <strong>SaaS</strong> (software), <strong>PaaS</strong> (platform), <strong>IaaS</strong> (infrastructure).</p>

<h3>1.7.7&ndash;1.7.9 Home and Wireless Trends</h3>
<ul>
  <li><strong>Smart home</strong> &mdash; IoT devices: thermostats, locks, lights, cameras.</li>
  <li><strong>Powerline networking</strong> &mdash; uses existing electrical wiring to carry network data (via adapters). Good where Wi-Fi is weak and cabling is impractical.</li>
  <li><strong>Wireless broadband</strong> &mdash; WISP (Wireless ISP), cellular, satellite. Useful in rural areas.</li>
</ul>

<h2>1.8 Network Security</h2>
<h3>1.8.1 Security Threats</h3>
<table>
  <tr><th>Threat type</th><th>Examples</th></tr>
  <tr><td>Viruses, worms, Trojan horses</td><td>Malicious code that damages or takes control</td></tr>
  <tr><td>Spyware and adware</td><td>Secretly gathers information about the user</td></tr>
  <tr><td>Zero-day attacks</td><td>Exploits a vulnerability the vendor does not yet know about</td></tr>
  <tr><td>Threat-actor attacks</td><td>Hackers, organised crime, state-sponsored actors</td></tr>
  <tr><td>Denial of service (DoS)</td><td>Overwhelms a service so legitimate users cannot access it</td></tr>
  <tr><td>Data interception and theft</td><td>Captures confidential data in transit</td></tr>
  <tr><td>Identity theft</td><td>Steals personal information to impersonate the victim</td></tr>
</table>

<h3>1.8.2 Security Solutions</h3>
<p>Home and small-office protections:</p>
<ul>
  <li><strong>Antivirus / anti-malware</strong> software on hosts.</li>
  <li><strong>Firewall</strong> &mdash; blocks unauthorised traffic at the network edge.</li>
  <li><strong>Access control lists (ACLs)</strong> &mdash; filter traffic by IP, port, protocol.</li>
  <li><strong>Intrusion Prevention System (IPS)</strong> &mdash; detects and blocks attacks.</li>
  <li><strong>Virtual Private Network (VPN)</strong> &mdash; encrypted tunnel for remote workers.</li>
  <li><strong>Strong passwords and MFA.</strong></li>
  <li><strong>Patching and updating</strong> devices regularly.</li>
</ul>
<p>Larger networks add: dedicated firewall appliances, IPS/IDS, AAA servers, DMZ, network segmentation, and security operations centers.</p>

<h2>1.9 The IT Professional</h2>
<h3>1.9.1 CCNA Certification</h3>
<p>The <strong>Cisco Certified Network Associate (CCNA)</strong> validates the skills needed to install, configure, operate and troubleshoot small-to-medium networks. It covers IP addressing, switching, routing, security, automation and network programmability.</p>

<h3>1.9.2 Networking Jobs</h3>
<table>
  <tr><th>Role</th><th>Focus</th></tr>
  <tr><td>Network Administrator</td><td>Day-to-day operation of the network</td></tr>
  <tr><td>Network Engineer</td><td>Designs and builds networks</td></tr>
  <tr><td>Network Analyst</td><td>Monitors performance, troubleshoots</td></tr>
  <tr><td>Network Architect</td><td>High-level design and standards</td></tr>
  <tr><td>Security Analyst / Engineer</td><td>Protects the network from threats</td></tr>
  <tr><td>Cloud Engineer</td><td>Cloud infrastructure and networking</td></tr>
  <tr><td>NOC Technician</td><td>Network Operations Center monitoring</td></tr>
</table>

<h3>1.9.3 Cisco Packet Tracer</h3>
<p><strong>Packet Tracer</strong> is Cisco's network simulation tool. It lets you build topologies, configure devices with real IOS-like commands, and test connectivity &mdash; without physical hardware. Essential for CCNA study.</p>

<h2>2.1 Cisco IOS Access</h2>
<h3>Operating Systems</h3>
<p>A <strong>Cisco IOS (Internetwork Operating System)</strong> is the operating system that runs on Cisco switches and routers. It provides the CLI, the command set and the device services.</p>

<h3>GUI vs CLI</h3>
<table>
  <tr><th>Interface</th><th>Description</th><th>Use case</th></tr>
  <tr><td>GUI</td><td>Graphical &mdash; buttons, menus, mouse</td><td>Easier for beginners, some devices (e.g. ASDM, Web UI)</td></tr>
  <tr><td>CLI</td><td>Command-line &mdash; text commands only</td><td>Faster for experts, scriptable, always available on Cisco gear</td></tr>
</table>
<p>Most Cisco devices are managed primarily through the CLI. The CLI is not optional: it is the primary management interface.</p>

<h3>Purpose of an OS</h3>
<p>An operating system provides:</p>
<ul>
  <li>Hardware abstraction and drivers</li>
  <li>Resource management (CPU, memory, I/O)</li>
  <li>User interface</li>
  <li>File and process management</li>
  <li>Security and access control</li>
</ul>

<h3>Access Methods</h3>
<table>
  <tr><th>Method</th><th>Description</th><th>Notes</th></tr>
  <tr><td>Console</td><td>Direct physical cable to the console port</td><td>Required for initial setup; works with no network configured</td></tr>
  <tr><td>Telnet</td><td>Remote access over the network</td><td>Unencrypted &mdash; insecure, avoid</td></tr>
  <tr><td>SSH</td><td>Secure Shell &mdash; encrypted remote access</td><td>Recommended remote access method</td></tr>
  <tr><td>AUX</td><td>Auxiliary port (older devices)</td><td>Used for modem access</td></tr>
</table>

<h3>Terminal Emulation Programs</h3>
<p>Software used to connect to a Cisco device console over a serial/USB connection:</p>
<ul>
  <li>PuTTY</li>
  <li>Tera Term</li>
  <li>SecureCRT</li>
  <li>macOS Terminal (<code>screen</code>)</li>
</ul>
<p>Common settings: 9600 baud, 8 data bits, no parity, 1 stop bit, no flow control.</p>

<h2>2.2 IOS Navigation</h2>
<h3>2.2.1 Primary Command Modes</h3>
<table>
  <tr><th>Mode</th><th>Prompt</th><th>Purpose</th></tr>

  <tr><td>Global Configuration</td><td><code>Switch(config)#</code></td><td>Commands that affect the whole device</td></tr>
  <tr><td>Interface Configuration</td><td><code>Switch(config-if)#</code></td><td>Commands that affect one interface</td></tr>
  <tr><td>Line Configuration</td><td><code>Switch(config-line)#</code></td><td>Console and VTY (Telnet/SSH) lines</td></tr>
</table>

<h3>2.2.4 Navigate Between IOS Modes</h3>
<pre class="cli"><span class="cmt">! Enter privileged EXEC from user EXEC:</span>

<h3>2.3.1 Basic IOS Command Structure</h3>
<p>Command syntax:</p>
<p><code>Switch&gt; command [keyword] [parameter]</code></p>
<ul>

  <li><strong>Parameter</strong> &mdash; a specific value (e.g. <code>192.168.1.1</code>).</li>

<h2>2.6 Ports and Addresses</h2>
<h3>2.6.1 IP Addresses</h3>
<p>An <strong>IP address</strong> uniquely identifies a device on a network. It has two parts:</p>
<ul>
  <li><strong>Network portion</strong> &mdash; identifies the network.</li>
  <li><strong>Host portion</strong> &mdash; identifies the device on that network.</li>
</ul>
<p>The <strong>subnet mask</strong> separates the two parts.</p>

<h3>2.6.2 Interfaces and Ports</h3>
<ul>
  <li><strong>Physical ports</strong> &mdash; the actual sockets on the device (FastEthernet, GigabitEthernet, console).</li>
  <li><strong>Virtual interfaces</strong> &mdash; logical interfaces such as SVIs and loopbacks.</li>
</ul>
<p>Naming convention on switches: <code>FastEthernet0/1</code>, <code>GigabitEthernet0/1</code>. On routers: <code>GigabitEthernet0/0/0</code>.</p>

<h3>2.7.4 Switch Virtual Interface Configuration</h3>
<p>A Layer 2 switch does not need an IP to forward frames, but it does need one for remote management. Configure an <strong>SVI (Switch Virtual Interface)</strong>:</p>
<pre class="cli">SW1(config)# <span class="prompt">interface vlan 1</span>
SW1(config-if)# <span class="prompt">ip address 192.168.1.10 255.255.255.0</span>
SW1(config-if)# <span class="prompt">no shutdown</span>
SW1(config-if)# <span class="prompt">exit</span>

<span class="cmt">! Set default gateway so the switch can be reached remotely from other networks:</span>
SW1(config)# <span class="prompt">ip default-gateway 192.168.1.1</span></pre>

<h2>2.8 Verify Connectivity</h2>
<h3>2.8.1 Test Interface Assignment</h3>

<h3>2.8.2 Test End-to-End Connectivity</h3>
<pre class="cli"><span class="cmt">! Basic reachability test:</span>
SW1# <span class="prompt">ping 192.168.1.20</span>

<div class="callout green"><b>Best practice</b>Always save the configuration after a successful change and verify with <code>show running-config</code>. Document device names, IPs and passwords in your network documentation.</div>

title:'Module 3: Protocols and Models',
sub:'Rules of communication · protocols · protocol suites · standards organizations · OSI and TCP/IP models · encapsulation · data access',
content:`
<h2>3.1 The Rules</h2>
<h3>3.1.2 Communications Fundamentals</h3>
<p>All communication &mdash; human or machine &mdash; follows three common elements:</p>
<ol>
  <li>A <strong>sender</strong> (source).</li>
  <li>A <strong>receiver</strong> (destination).</li>
  <li>A <strong>channel</strong> (medium) that carries the message.</li>
</ol>
<p>The rules that govern communication are called <strong>protocols</strong>.</p>

<h3>3.1.3&ndash;3.1.4 Communication Protocols and Rule Establishment</h3>
<p>Protocols must agree on:</p>
<ul>
  <li><strong>Encoding</strong> &mdash; how data is converted into signals.</li>
  <li><strong>Formatting and encapsulation</strong> &mdash; how data is packaged with addressing and control information.</li>
  <li><strong>Size</strong> &mdash; how much data can be sent at once.</li>
  <li><strong>Timing</strong> &mdash; when data can be sent and at what speed.</li>
  <li><strong>Delivery options</strong> &mdash; unicast, multicast, broadcast.</li>
</ul>

<h3>3.1.6 Message Encoding</h3>
<p><strong>Encoding</strong> converts information into a form suitable for transmission. The sender encodes, the receiver decodes. Different media use different encoding: electrical pulses (copper), light pulses (fiber), radio waves (wireless).</p>

<h3>3.1.7 Message Formatting and Encapsulation</h3>
<p>A message must be formatted with the correct <strong>addresses</strong> and control information. When a message is placed inside another format, it is called <strong>encapsulation</strong>. Each layer of a protocol stack adds its own information to the message.</p>

<h3>3.1.8 Message Size</h3>
<p>Messages are broken into smaller pieces because:</p>
<ul>
  <li>Large messages monopolise the medium.</li>
  <li>Errors require retransmission of the whole message if sent as one unit.</li>
  <li>Different media have different maximum transmission unit (MTU) sizes.</li>
</ul>

<h3>3.1.9 Message Timing</h3>
<ul>
  <li><strong>Flow control</strong> &mdash; managing the rate at which data is sent so the receiver is not overwhelmed.</li>
  <li><strong>Response timeout</strong> &mdash; how long to wait for a reply before retransmitting.</li>
  <li><strong>Access method</strong> &mdash; when a device may transmit (e.g. CSMA/CD, CSMA/CA).</li>
</ul>

<h3>3.1.10 Message Delivery Options</h3>
<table>
  <tr><th>Delivery</th><th>Description</th><th>Example</th></tr>
  <tr><td>Unicast</td><td>One-to-one</td><td>An HTTP request from a PC to a web server</td></tr>
  <tr><td>Multicast</td><td>One-to-many (a specific group)</td><td>Video streaming to subscribers</td></tr>
  <tr><td>Broadcast</td><td>One-to-all on a local network</td><td>ARP request</td></tr>
  <tr><td>Anycast</td><td>One-to-nearest of a group</td><td>DNS root servers (IPv6)</td></tr>
</table>

<h2>3.2 Protocols</h2>
<h3>3.2.2 Network Protocol Functions</h3>
<p>Protocols perform these functions:</p>
<ul>
  <li><strong>Addressing</strong> &mdash; identify sender and receiver.</li>
  <li><strong>Reliability and error detection</strong> &mdash; detect and correct lost or corrupted data.</li>
  <li><strong>Flow control</strong> &mdash; manage the rate of data transfer.</li>
  <li><strong>Sequencing</strong> &mdash; label segments so they can be reassembled in order.</li>
  <li><strong>Encapsulation</strong> &mdash; put control information around the data.</li>
</ul>

<h3>3.2.3 Protocol Interaction</h3>
<p>Multiple protocols work together as a stack. For example, when a web page loads:</p>
<ol>
  <li>HTTP requests the page.</li>
  <li>TCP ensures reliable delivery.</li>
  <li>IP addresses and routes the packets.</li>
  <li>Ethernet carries the frames on the local network.</li>
</ol>

<h2>3.3 Protocol Suites</h2>
<h3>3.3.1 Network Protocol Suites</h3>
<p>A <strong>protocol suite</strong> is a group of protocols that work together. Examples: TCP/IP (the internet standard), OSI, AppleTalk (legacy), Novell IPX/SPX (legacy).</p>

<h3>3.3.4 TCP/IP Protocol Suite</h3>
<table>
  <tr><th>Layer</th><th>Protocols</th></tr>
  <tr><td>Application</td><td>HTTP, HTTPS, DNS, DHCP, SMTP, POP3, IMAP, FTP, TFTP, SNMP</td></tr>
  <tr><td>Transport</td><td>TCP, UDP</td></tr>
  <tr><td>Internet</td><td>IPv4, IPv6, ICMPv4, ICMPv6, ARP, ND</td></tr>
  <tr><td>Network Access</td><td>Ethernet, WLAN, PPP, HDLC</td></tr>
</table>

<h3>3.3.5 TCP/IP Communication Process</h3>
<p>A complete communication involves several steps: encapsulation at each layer on the sender, transmission over the medium, then de-encapsulation at each layer on the receiver.</p>

<h2>3.4 Standards Organizations</h2>
<h3>3.4.1 Open Standards</h3>
<p>Open standards allow devices from different vendors to interoperate. They are developed by standards organizations, not vendors.</p>

<h3>3.4.2 Internet Standards</h3>
<table>
  <tr><th>Organization</th><th>Role</th></tr>
  <tr><td>ISOC</td><td>Internet Society &mdash; oversees internet policy and standards</td></tr>
  <tr><td>IAB</td><td>Internet Architecture Board &mdash; manages internet standards</td></tr>
  <tr><td>IETF</td><td>Internet Engineering Task Force &mdash; develops internet protocols (RFCs)</td></tr>
  <tr><td>IRTF</td><td>Internet Research Task Force &mdash; long-term research</td></tr>
  <tr><td>IANA</td><td>Internet Assigned Numbers Authority &mdash; manages IP, port and protocol numbers</td></tr>
  <tr><td>ICANN</td><td>Internet Corporation for Assigned Names and Numbers &mdash; coordinates IP and domain names</td></tr>
</table>

<h3>3.4.3 Electronic and Communications Standards</h3>
<table>
  <tr><th>Organization</th><th>Focus</th></tr>
  <tr><td>IEEE</td><td>Electrical and electronics standards; 802.3 Ethernet, 802.11 Wi-Fi</td></tr>
  <tr><td>ISO</td><td>International Organization for Standardization; OSI model</td></tr>
  <tr><td>ITU-T</td><td>International Telecommunication Union; telecom standards</td></tr>
  <tr><td>TIA/EIA</td><td>Telecommunications Industry Association; cabling standards (TIA/EIA-568)</td></tr>
  <tr><td>ANSI</td><td>American National Standards Institute</td></tr>
</table>

<h2>3.5 Reference Models</h2>
<h3>3.5.1 Benefits of a Layered Model</h3>
<ul>
  <li>Breaks complex communication into smaller parts.</li>
  <li>Allows interoperability between vendors.</li>
  <li>Simplifies troubleshooting &mdash; problems can be isolated to a layer.</li>
  <li>Promotes standardisation.</li>
</ul>

<h3>3.5.2 The OSI Reference Model</h3>
<table>
  <tr><th>#</th><th>Layer</th><th>Function</th><th>PDU</th></tr>
  <tr><td>7</td><td>Application</td><td>Services to end-user apps</td><td>Data</td></tr>
  <tr><td>6</td><td>Presentation</td><td>Encryption, compression, translation</td><td>Data</td></tr>
  <tr><td>5</td><td>Session</td><td>Set up, manage, tear down sessions</td><td>Data</td></tr>
  <tr><td>4</td><td>Transport</td><td>End-to-end delivery, ports, reliability</td><td>Segment</td></tr>
  <tr><td>3</td><td>Network</td><td>Logical addressing and routing (IP)</td><td>Packet</td></tr>
  <tr><td>2</td><td>Data Link</td><td>Physical addressing (MAC), framing</td><td>Frame</td></tr>
  <tr><td>1</td><td>Physical</td><td>Bits, cables, signals</td><td>Bits</td></tr>
</table>
<p>Mnemonic (top to bottom): <em>All People Seem To Need Data Processing</em>.<br>
Mnemonic (bottom to top): <em>Please Do Not Throw Sausage Pizza Away</em>.</p>

<h3>3.5.3 The TCP/IP Protocol Model</h3>
<table>
  <tr><th>TCP/IP Model</th><th>Maps to OSI</th></tr>
  <tr><td>Application</td><td>Application, Presentation, Session (5&ndash;7)</td></tr>
  <tr><td>Transport</td><td>Transport (4)</td></tr>
  <tr><td>Internet</td><td>Network (3)</td></tr>
  <tr><td>Network Access</td><td>Data Link, Physical (1&ndash;2)</td></tr>
</table>

<h3>3.5.4 OSI and TCP/IP Model Comparison</h3>
<table>
  <tr><th>OSI</th><th>TCP/IP</th></tr>
  <tr><td>Theoretical reference model</td><td>Practical, implemented model</td></tr>
  <tr><td>7 layers</td><td>4 layers</td></tr>
  <tr><td>Protocol-independent</td><td>Built around its own protocols</td></tr>
</table>

<h2>3.6 Data Encapsulation</h2>
<h3>3.6.1 Segmenting Messages</h3>
<p>Data is divided into smaller pieces (segments) so it can be sent efficiently. Benefits: multiplexing (many conversations share the medium), and only the lost segment must be retransmitted.</p>

<h3>3.6.2 Sequencing</h3>
<p>Each segment is numbered so the receiver can reassemble the data in the original order even if segments arrive out of order.</p>

<h3>3.6.3 Protocol Data Units (PDUs)</h3>
<table>
  <tr><th>Layer</th><th>PDU name</th></tr>
  <tr><td>Application</td><td>Data</td></tr>
  <tr><td>Transport</td><td>Segment (TCP) / Datagram (UDP)</td></tr>
  <tr><td>Network</td><td>Packet</td></tr>
  <tr><td>Data Link</td><td>Frame</td></tr>
  <tr><td>Physical</td><td>Bits</td></tr>
</table>

<h3>3.6.4 Encapsulation Example</h3>
<p>Sending an email:</p>
<ol>
  <li>Email data is created (Application).</li>
  <li>TCP header is added &rarr; <strong>Segment</strong>.</li>
  <li>IP header is added &rarr; <strong>Packet</strong>.</li>
  <li>Ethernet header and trailer are added &rarr; <strong>Frame</strong>.</li>
  <li>Frame is encoded into signals &rarr; <strong>Bits</strong> on the medium.</li>
</ol>

<h3>3.6.5 De-encapsulation Example</h3>
<p>At the receiver, the process is reversed: bits &rarr; frame &rarr; packet &rarr; segment &rarr; data. Each layer strips its header and passes the payload up.</p>

<h2>3.7 Data Access</h2>
<h3>3.7.1 Addresses</h3>
<p>Two types of address are used during communication:</p>
<ul>
  <li><strong>Layer 3 (logical)</strong> &mdash; the IP address. Identifies the source and destination host. Remains the same from source to destination.</li>
  <li><strong>Layer 2 (physical)</strong> &mdash; the MAC address. Identifies the source and destination NIC on the local network. Changes at every hop.</li>
</ul>

<h3>3.7.3 Devices on the Same Network</h3>
<p>If the source and destination are on the same IP network:</p>
<ul>
  <li>Source and destination IP addresses refer to the two hosts directly.</li>
  <li>Source MAC is the sender's NIC; destination MAC is the receiver's NIC.</li>
  <li>The frame is delivered directly on the local network.</li>
</ul>

<h3>3.7.5 Devices on a Remote Network</h3>
<p>If the destination is on a different network:</p>
<ul>
  <li>The source host sends the frame to the <strong>default gateway</strong> (router).</li>
  <li>Source IP = sender's IP; destination IP = final destination.</li>
  <li>Source MAC = sender's NIC; destination MAC = the router's interface MAC.</li>
  <li>The router strips the frame, forwards the packet to the next hop, and re-encapsulates it in a new frame.</li>
</ul>

<div class="callout blue"><b>Key point</b>The IP address stays the same end-to-end. The MAC address changes at every hop.</div>

title:'Module 4: Physical Layer',
sub:'Purpose of the physical layer · standards · encoding and signaling · bandwidth · copper · UTP · fiber · wireless media',
content:`
<h2>4.1 Purpose of the Physical Layer</h2>
<h3>4.1.1 The Physical Connection</h3>
<p>Before any network communication can occur, a physical connection must exist. That connection can be wired (copper or fiber) or wireless (radio, microwave, infrared).</p>

<h3>4.1.2 The Physical Layer</h3>
<p>The physical layer:</p>
<ul>
  <li>Accepts a complete frame from the Data Link layer and encodes it into signals.</li>
  <li>Transmits the bits across the medium.</li>
  <li>Retrieves individual signals from the medium and rebuilds the frame for the Data Link layer at the receiver.</li>
</ul>
<p>The physical layer standards define: <strong>physical components, encoding, and signaling</strong>.</p>

<h2>4.2 Physical Layer Characteristics</h2>
<h3>4.2.1 Physical Layer Standards</h3>
<p>Standards are defined by:</p>
<ul>
  <li><strong>ISO</strong> &mdash; OSI model</li>
  <li><strong>TIA/EIA</strong> &mdash; cabling standards (TIA/EIA-568)</li>
  <li><strong>IEEE</strong> &mdash; 802.3 Ethernet, 802.11 Wi-Fi</li>
  <li><strong>ITU-T</strong> &mdash; telecom standards</li>
  <li><strong>ANSI</strong> &mdash; FDDI, fibre</li>
</ul>

<h3>4.2.2 Physical Components</h3>
<ul>
  <li>Network interface cards (NICs)</li>
  <li>Connectors and ports (RJ-45, LC, SC)</li>
  <li>Cable materials (copper, fiber)</li>
  <li>Wireless antennas and transceivers</li>
</ul>

<h3>4.2.3 Encoding</h3>
<p><strong>Encoding</strong> converts a stream of bits into a form the medium can carry:</p>
<ul>
  <li><strong>Manchester encoding</strong> &mdash; a voltage transition in the middle of each bit period.</li>
  <li><strong>4B/5B</strong> &mdash; 4 data bits mapped to 5 code bits (Fast Ethernet).</li>
  <li><strong>8B/10B</strong> &mdash; 8 bits to 10 bits (Gigabit Ethernet).</li>
  <li><strong>PAM-5</strong> &mdash; 5 voltage levels, used for Gigabit Ethernet over copper.</li>
</ul>

<h3>4.2.4 Signaling</h3>
<p>The physical layer must generate signals appropriate to the medium:</p>
<ul>
  <li><strong>Copper</strong> &mdash; electrical pulses.</li>
  <li><strong>Fiber</strong> &mdash; light pulses.</li>
  <li><strong>Wireless</strong> &mdash; radio waves (electromagnetic).</li>
</ul>

<h3>4.2.5 Bandwidth</h3>
<p><strong>Bandwidth</strong> is the capacity of a medium to carry data. It is measured in bits per second (bps, kbps, Mbps, Gbps, Tbps). It is important to distinguish:</p>
<ul>
  <li><strong>Bandwidth</strong> &mdash; the theoretical capacity of a link (e.g. 1 Gbps).</li>
  <li><strong>Throughput</strong> &mdash; the actual rate of data transfer, which is usually lower due to overhead, latency and congestion.</li>
  <li><strong>Goodput</strong> &mdash; throughput of useful payload, excluding protocol overhead and retransmissions.</li>
</ul>

<h3>4.2.6 Bandwidth Terminology</h3>
<table>
  <tr><th>Term</th><th>Meaning</th></tr>
  <tr><td>Latency</td><td>Time for data to travel from source to destination</td></tr>
  <tr><td>Jitter</td><td>Variation in delay &mdash; harmful to voice and video</td></tr>
  <tr><td>Throughput</td><td>Actual data delivered per second</td></tr>
  <tr><td>Goodput</td><td>Useful payload data per second</td></tr>
</table>

<h2>4.3 Copper Cabling</h2>
<p>Copper cabling carries data as electrical pulses. It is the most common and cheapest medium.</p>
<ul>
  <li><strong>Conductive</strong> &mdash; copper is an excellent conductor.</li>
  <li><strong>Susceptible to EMI/RFI</strong> &mdash; electromagnetic interference degrades signal.</li>
  <li><strong>Susceptible to crosstalk</strong> &mdash; signal bleeding between adjacent wires.</li>
  <li><strong>Requires grounding</strong> &mdash; for safety and signal integrity.</li>
  <li><strong>Distance limited</strong> &mdash; attenuation (signal loss) increases with distance.</li>
</ul>

<h3>Copper cable types</h3>
<table>
  <tr><th>Type</th><th>Description</th><th>Use</th></tr>
  <tr><td>UTP</td><td>Unshielded twisted pair &mdash; 4 twisted pairs, RJ-45</td><td>Most LANs</td></tr>
  <tr><td>STP</td><td>Shielded twisted pair &mdash; foil/braid shielding</td><td>EMI-heavy environments</td></tr>
  <tr><td>Coaxial</td><td>Center conductor + braided shield</td><td>Cable broadband, older Ethernet</td></tr>
</table>

<h2>4.4 UTP Cabling</h2>
<h3>4.4.1 Properties</h3>
<ul>
  <li>Four twisted pairs of copper wire with RJ-45 connectors.</li>
  <li>Pairs are twisted to cancel crosstalk.</li>
  <li>Category rating determines maximum speed and distance.</li>
  <li>Max cable segment length: <strong>100 metres</strong> for all categories.</li>
</ul>

<h3>4.4.2 UTP Cabling Standards and Connectors</h3>
<table>
  <tr><th>Category</th><th>Speed</th><th>Notes</th></tr>
  <tr><td>Cat 3</td><td>10 Mbps</td><td>Legacy voice/telephone</td></tr>
  <tr><td>Cat 5</td><td>100 Mbps</td><td>Fast Ethernet era</td></tr>
  <tr><td>Cat 5e</td><td>1 Gbps</td><td>Very common today</td></tr>
  <tr><td>Cat 6</td><td>1 Gbps (100m) / 10 Gbps (55m)</td><td>Better shielding</td></tr>
  <tr><td>Cat 6a</td><td>10 Gbps to 100m</td><td>Modern standard</td></tr>
  <tr><td>Cat 7</td><td>10 Gbps</td><td>Fully shielded</td></tr>
  <tr><td>Cat 8</td><td>40 Gbps</td><td>Data center short runs</td></tr>
</table>

<h3>4.4.3 Straight-Through and Crossover Cables</h3>
<table>
  <tr><th>Cable type</th><th>Use</th><th>Pinout</th></tr>
  <tr><td>Straight-through</td><td>Connect dissimilar devices: PC-to-switch, switch-to-router</td><td>T568A both ends, or T568B both ends</td></tr>
  <tr><td>Crossover</td><td>Connect similar devices: switch-to-switch, PC-to-PC</td><td>T568A on one end, T568B on the other</td></tr>
  <tr><td>Rollover</td><td>Console connection (PC to Cisco device console port)</td><td>Full reverse pinout</td></tr>
</table>
<div class="callout green"><b>Auto-MDIX</b>Modern Cisco devices have Auto-MDIX, which automatically detects and adjusts for cable type. Crossover cables are rarely needed on newer gear.</div>

<h2>4.5 Fiber-Optic Cabling</h2>
<h3>4.5.1 Properties</h3>
<ul>
  <li>Carries data as pulses of light through a glass or plastic core.</li>
  <li>Immune to EMI/RFI.</li>
  <li>Very low signal loss &mdash; supports very long distances.</li>
  <li>Higher bandwidth than copper.</li>
  <li>More expensive to install and maintain.</li>
</ul>

<h3>4.5.2 Types of Fiber Media</h3>
<table>
  <tr><th>Type</th><th>Core size</th><th>Distance</th><th>Light source</th></tr>
  <tr><td>Single-mode (SMF)</td><td>~9 microns</td><td>Up to 100+ km</td><td>Laser</td></tr>
  <tr><td>Multimode (MMF)</td><td>50 or 62.5 microns</td><td>Up to ~550 m</td><td>LED or VCSEL</td></tr>
</table>

<h3>4.5.4 Fiber-Optic Connectors</h3>
<table>
  <tr><th>Connector</th><th>Description</th></tr>
  <tr><td>ST</td><td>Straight-tip; bayonet mount (older)</td></tr>
  <tr><td>SC</td><td>Subscriber connector; square, push-pull</td></tr>
  <tr><td>LC</td><td>Lucent connector; small, common on modern equipment</td></tr>
  <tr><td>Duplex multimode LC</td><td>Common on Cisco switches</td></tr>
</table>
<p>Single-mode fiber is often yellow; multimode is usually orange or aqua.</p>

<h3>4.5.5 Fiber Patch Cords</h3>
<ul>
  <li>SC-SC: older switches and patch panels.</li>
  <li>LC-LC: modern switches.</li>
  <li>LC-SC: between old and new equipment.</li>
</ul>

<h3>4.5.6 Fiber versus Copper</h3>
<table>
  <tr><th>Feature</th><th>Copper</th><th>Fiber</th></tr>
  <tr><td>Bandwidth</td><td>Lower</td><td>Higher</td></tr>
  <tr><td>Distance</td><td>100m (UTP)</td><td>Km+</td></tr>
  <tr><td>EMI</td><td>Susceptible</td><td>Immune</td></tr>
  <tr><td>Cost</td><td>Lower</td><td>Higher</td></tr>
  <tr><td>Installation</td><td>Easier</td><td>Requires skill</td></tr>
  <tr><td>Security</td><td>Can be tapped</td><td>Hard to tap</td></tr>
</table>

<h2>4.6 Wireless Media</h2>
<h3>4.6.1 Properties of Wireless Media</h3>
<ul>
  <li>Carries data using radio or microwave frequencies.</li>
  <li>No physical cable &mdash; devices must share the air.</li>
  <li>Susceptible to interference from other wireless devices, walls, and environmental factors.</li>
  <li>Security is a major concern (eavesdropping).</li>
  <li>Common standards: IEEE 802.11 (Wi-Fi), 802.15 (Bluetooth, WPAN), 802.16 (WiMAX).</li>
</ul>

<h3>4.6.2 Types of Wireless Media</h3>
<table>
  <tr><th>Standard</th><th>Description</th><th>Range</th></tr>
  <tr><td>Bluetooth (802.15)</td><td>Personal area network; low power</td><td>~10m</td></tr>
  <tr><td>Wi-Fi (802.11)</td><td>Wireless LAN</td><td>~30-100m indoor</td></tr>
  <tr><td>WiMAX (802.16)</td><td>Wireless MAN</td><td>Km</td></tr>
  <tr><td>Cellular</td><td>3G/4G/5G mobile networks</td><td>Km</td></tr>
  <tr><td>Satellite</td><td>Global coverage</td><td>Continental</td></tr>
</table>

<h3>4.6.3 Wireless LAN</h3>
<ul>
  <li>Uses <strong>CSMA/CA</strong> (Carrier Sense Multiple Access with Collision Avoidance) because wireless cannot reliably detect collisions.</li>
  <li>Wireless clients connect to an <strong>Access Point (AP)</strong>.</li>
  <li>2.4 GHz band: longer range, more interference, 3 non-overlapping channels (1, 6, 11).</li>
  <li>5 GHz band: shorter range, less interference, more channels.</li>
  <li>6 GHz band (Wi-Fi 6E): clean spectrum, high throughput.</li>
</ul>

<div class="callout blue"><b>Key CCNA point</b>Copper is limited to 100m per segment; fiber reaches kilometres; wireless uses radio and requires CSMA/CA. Choosing the right medium depends on distance, environment, bandwidth, and budget.</div>

content:`
<h2>5.1 Binary Number System</h2>
<h3>5.1.1 Binary and IPv4 Addresses</h3>
<p>Computers and network devices work with <strong>binary</strong> &mdash; a number system with only two digits: <strong>0</strong> and <strong>1</strong>. Every IPv4 address is really a 32-bit binary number, even though we write it as four decimal octets separated by dots (dotted-decimal notation).</p>
<p>Example: <code>192.168.10.11</code> in binary is:</p>
<pre class="cli">192    .   168    .    10    .    11
11000000.10101000.00001010.00001011</pre>

<h3>5.1.3 Binary Positional Notation</h3>
<p>Each bit position in an octet has a weight based on powers of 2:</p>
<table>
  <tr><th>Bit position</th><th>8</th><th>7</th><th>6</th><th>5</th><th>4</th><th>3</th><th>2</th><th>1</th></tr>
  <tr><td>Weight</td><td>128</td><td>64</td><td>32</td><td>16</td><td>8</td><td>4</td><td>2</td><td>1</td></tr>
</table>
<p>To convert binary to decimal, add the weights of the positions where a <code>1</code> appears.</p>

<h3>5.1.5 Convert Binary to Decimal</h3>
<h4>Example 1</h4>
<pre class="cli">Binary:  1 1 0 0 0 0 0 0
Weights: 128 64 32 16 8 4 2 1
Sum: 128 + 64 = 192</pre>
<p>So <code>11000000</code> = <strong>192</strong>.</p>

<h4>Example 2</h4>
<pre class="cli">Binary:  1 0 1 0 1 0 0 0
Weights: 128 64 32 16 8 4 2 1
Sum: 128 + 32 + 8 = 168</pre>
<p>So <code>10101000</code> = <strong>168</strong>.</p>

<h4>Example 3</h4>
<pre class="cli">Binary:  1 1 1 1 1 1 1 1
Weights: 128 64 32 16 8 4 2 1
Sum: 128+64+32+16+8+4+2+1 = 255</pre>
<p>So <code>11111111</code> = <strong>255</strong> &mdash; the maximum value of an octet.</p>

<h3>5.1.7 Decimal to Binary Conversion</h3>
<p>To convert decimal to binary, subtract the largest power of 2 that fits, then repeat with the remainder. Mark a <code>1</code> where you subtracted and a <code>0</code> where you did not.</p>
<h4>Example 1: Convert 172 to binary</h4>
<pre class="cli">172 - 128 = 44   -> 1  (128)
44  - 64  = no   -> 0  (64)
44  - 32  = 12   -> 1  (32)
12  - 16  = no   -> 0  (16)
12  - 8   = 4    -> 1  (8)
4   - 4   = 0    -> 1  (4)
0   - 2   = no   -> 0  (2)
0   - 1   = no   -> 0  (1)

Result: 10101100</pre>

<h4>Example 2: Convert 200 to binary</h4>
<pre class="cli">200 - 128 = 72   -> 1
72  - 64  = 8    -> 1
8   - 32  = no   -> 0
8   - 16  = no   -> 0
8   - 8   = 0    -> 1
0   - 4   = no   -> 0
0   - 2   = no   -> 0
0   - 1   = no   -> 0

Result: 11001000</pre>

<h3>5.1.11 IPv4 Addresses</h3>
<p>A full IPv4 address in binary:</p>
<pre class="cli">Decimal: 192       .168       .10        .11
Binary:  11000000  .10101000  .00001010  .00001011
Total:   32 bits</pre>
<p>The 32 bits are split into a <strong>network portion</strong> and a <strong>host portion</strong>. The split is determined by the <strong>subnet mask</strong> (or prefix length).</p>

<div class="callout blue"><b>CCNA tip</b>You must be able to convert between binary and decimal in your head or on paper. Practice until it takes you under 10 seconds per octet.</div>

<h2>5.2 Hexadecimal Number System</h2>
<h3>5.2.1 Hexadecimal and IPv6 Addresses</h3>
<p><strong>Hexadecimal</strong> is base 16. It uses digits 0&ndash;9 and letters A&ndash;F:</p>
<table>
  <tr><th>Decimal</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th><th>10</th><th>11</th><th>12</th><th>13</th><th>14</th><th>15</th></tr>
  <tr><th>Hex</th><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td><td>9</td><td>A</td><td>B</td><td>C</td><td>D</td><td>E</td><td>F</td></tr>
</table>
<p>Why hex matters for networking:</p>
<ul>
  <li><strong>IPv6 addresses</strong> are written in hexadecimal.</li>
  <li><strong>MAC addresses</strong> are written in hexadecimal (e.g. <code>00-1A-2B-3C-4D-5E</code>).</li>
  <li>Each hex digit represents exactly <strong>4 bits</strong> (a nibble). Two hex digits = 8 bits = 1 byte.</li>
</ul>

<h3>5.2.3 Decimal to Hexadecimal Conversion</h3>
<p>Divide the decimal value by 16 and track the remainders.</p>
<h4>Example: Convert 201 to hexadecimal</h4>
<pre class="cli">201 / 16 = 12 remainder 9   -> 12 = C, remainder 9
So 201 decimal = C9 hex</pre>

<h4>Example: Convert 168 to hexadecimal</h4>
<pre class="cli">168 / 16 = 10 remainder 8   -> 10 = A, remainder 8
So 168 = A8 hex</pre>

<h3>5.2.4 Hexadecimal to Decimal Conversion</h3>
<p>Multiply each hex digit by its position weight (16, 1) and add.</p>
<h4>Example: Convert C9 to decimal</h4>
<pre class="cli">C9 = (C x 16) + (9 x 1)
   = (12 x 16) + 9
   = 192 + 9
   = 201</pre>

<h4>Example: Convert FF to decimal</h4>
<pre class="cli">FF = (15 x 16) + (15 x 1) = 240 + 15 = 255</pre>
<p><code>FF</code> is the largest two-digit hex value, corresponding to <code>11111111</code> binary and <code>255</code> decimal.</p>

<h3>Practice table: Binary &harr; Hex &harr; Decimal</h3>
<table>
  <tr><th>Binary</th><th>Hex</th><th>Decimal</th></tr>
  <tr><td>0000</td><td>0</td><td>0</td></tr>
  <tr><td>0001</td><td>1</td><td>1</td></tr>
  <tr><td>0010</td><td>2</td><td>2</td></tr>
  <tr><td>0011</td><td>3</td><td>3</td></tr>
  <tr><td>0100</td><td>4</td><td>4</td></tr>
  <tr><td>0101</td><td>5</td><td>5</td></tr>
  <tr><td>0110</td><td>6</td><td>6</td></tr>
  <tr><td>0111</td><td>7</td><td>7</td></tr>
  <tr><td>1000</td><td>8</td><td>8</td></tr>
  <tr><td>1001</td><td>9</td><td>9</td></tr>
  <tr><td>1010</td><td>A</td><td>10</td></tr>
  <tr><td>1011</td><td>B</td><td>11</td></tr>
  <tr><td>1100</td><td>C</td><td>12</td></tr>
  <tr><td>1101</td><td>D</td><td>13</td></tr>
  <tr><td>1110</td><td>E</td><td>14</td></tr>
  <tr><td>1111</td><td>F</td><td>15</td></tr>
</table>
<p>Memorising this table lets you convert any IPv6 address or MAC address instantly.</p>

content:`
<h2>6.1 Purpose of the Data Link Layer</h2>
<h3>6.1.1 The Data Link Layer</h3>
<p>The <strong>Data Link layer (Layer 2)</strong> prepares Network-layer packets for transmission over a specific type of medium. It is responsible for:</p>
<ul>
  <li>Accepting packets from Layer 3 and encapsulating them into <strong>frames</strong>.</li>
  <li>Adding <strong>physical (MAC) addresses</strong> to identify source and destination NICs.</li>
  <li>Controlling how data is placed on and retrieved from the medium (access control).</li>
  <li>Detecting transmission errors using a trailer (FCS).</li>
</ul>
<p>The Data Link layer is implemented in software (the NIC driver) and hardware (the NIC itself).</p>

<h3>6.1.2 IEEE 802 LAN/MAN Data Link Sublayers</h3>
<p>IEEE 802 divides Layer 2 into two sublayers:</p>
<table>
  <tr><th>Sublayer</th><th>Role</th></tr>
  <tr><td><strong>LLC</strong> (Logical Link Control, 802.2)</td><td>Communicates with the Network layer; identifies which Layer 3 protocol is being encapsulated (e.g. IPv4, IPv6, ARP)</td></tr>
  <tr><td><strong>MAC</strong> (Media Access Control, 802.3/802.11)</td><td>Data encapsulation (framing, addressing) and media access control</td></tr>
</table>

<h3>6.1.3 Providing Access to Media</h3>
<p>Different media require different data link protocols:</p>
<ul>
  <li><strong>Ethernet</strong> &mdash; LAN wired</li>
  <li><strong>802.11 (Wi-Fi)</strong> &mdash; LAN wireless</li>
  <li><strong>PPP</strong> &mdash; point-to-point WAN</li>
  <li><strong>HDLC</strong> &mdash; Cisco point-to-point WAN</li>
  <li><strong>Frame Relay</strong> &mdash; legacy WAN</li>
</ul>

<h3>6.1.4 Data Link Layer Standards</h3>
<ul>
  <li><strong>IEEE 802.2</strong> &mdash; LLC</li>
  <li><strong>IEEE 802.3</strong> &mdash; Ethernet</li>
  <li><strong>IEEE 802.11</strong> &mdash; Wireless LAN</li>
  <li><strong>IEEE 802.15</strong> &mdash; WPAN (Bluetooth)</li>
  <li><strong>ITU-T</strong> &mdash; WAN protocols (PPP, Frame Relay, HDLC)</li>
  <li><strong>ANSI</strong> &mdash; FDDI</li>
</ul>

<h2>6.2 Topologies</h2>
<h3>6.2.1 Physical and Logical Topologies</h3>
<ul>
  <li><strong>Physical topology</strong> &mdash; the actual physical layout: which devices are connected to which, and by what cable.</li>
  <li><strong>Logical topology</strong> &mdash; how data actually flows between devices, independent of the physical layout.</li>
</ul>

<h3>6.2.2 WAN Topologies</h3>
<table>
  <tr><th>Topology</th><th>Description</th><th>Pros / Cons</th></tr>
  <tr><td>Point-to-point</td><td>Two devices directly connected</td><td>Simple; not scalable</td></tr>
  <tr><td>Hub-and-spoke</td><td>Central site connects to many remote sites</td><td>Simple management; single point of failure at the hub</td></tr>
  <tr><td>Full mesh</td><td>Every site connects to every other site</td><td>Maximum redundancy; very expensive</td></tr>
  <tr><td>Partial mesh</td><td>Some sites connect to multiple others</td><td>Balanced cost and redundancy</td></tr>
</table>

<h3>6.2.3 Point-to-Point WAN Topology</h3>
<p>A permanent link between two endpoints. Used for dedicated WAN connections. Simple and reliable; not scalable for many sites.</p>

<h3>6.2.4 LAN Topologies</h3>
<table>
  <tr><th>Topology</th><th>Description</th></tr>
  <tr><td>Star</td><td>All devices connect to a central switch or AP (most common today)</td></tr>
  <tr><td>Extended star</td><td>Multiple star networks interconnected</td></tr>
  <tr><td>Bus</td><td>All devices on one shared backbone (legacy)</td></tr>
  <tr><td>Ring</td><td>Devices in a closed loop</td></tr>
  <tr><td>Mesh</td><td>Every device connected to every other (rare in LANs)</td></tr>
</table>

<h3>6.2.5 Half and Full Duplex Communication</h3>
<table>
  <tr><th>Mode</th><th>Description</th><th>Example</th></tr>
  <tr><td>Half-duplex</td><td>Send OR receive, not both at the same time</td><td>Walkie-talkie; hubs; wireless</td></tr>
  <tr><td>Full-duplex</td><td>Send and receive simultaneously</td><td>Switch ports to end devices; modern Ethernet</td></tr>
</table>
<p>Full-duplex doubles effective throughput and eliminates collisions on that link.</p>

<h3>6.2.6 Access Control Methods</h3>
<p>Layer 2 uses two main approaches to control access to the shared medium:</p>
<ul>
  <li><strong>Contention-based access</strong> &mdash; devices compete for the medium (Ethernet, WLAN).</li>
  <li><strong>Controlled access</strong> &mdash; devices take turns using a token (legacy: Token Ring, FDDI).</li>
</ul>

<h3>6.2.7 Contention-Based Access &mdash; CSMA/CD</h3>
<p><strong>Carrier Sense Multiple Access with Collision Detection</strong> was used on half-duplex Ethernet with hubs. Steps:</p>
<ol>
  <li>Listen for traffic on the medium (carrier sense).</li>
  <li>If quiet, transmit.</li>
  <li>Keep listening while transmitting to detect collisions.</li>
  <li>If a collision is detected, stop transmitting, send a jam signal, wait a random backoff period, and retry.</li>
</ol>
<p>With modern full-duplex switched Ethernet, collisions do not occur, so CSMA/CD is effectively disabled.</p>

<h3>6.2.8 Contention-Based Access &mdash; CSMA/CA</h3>
<p><strong>Carrier Sense Multiple Access with Collision Avoidance</strong> is used on wireless (802.11) because devices cannot detect collisions reliably (they are half-duplex on the same channel). Steps:</p>
<ol>
  <li>Listen for traffic on the channel.</li>
  <li>If quiet for a set time, wait a random backoff.</li>
  <li>Transmit and wait for an acknowledgement (ACK).</li>
  <li>If no ACK, assume collision and retransmit.</li>
</ol>
<p>Optional <strong>RTS/CTS</strong> (Request to Send / Clear to Send) helps solve the hidden node problem.</p>

<h2>6.3 Data Link Frame</h2>
<h3>6.3.1 The Frame</h3>
<p>A <strong>frame</strong> is the Layer 2 PDU. Its structure depends on the protocol (Ethernet, PPP, HDLC, etc.), but all frames share a common purpose: deliver a packet from one NIC to another on the same local network.</p>

<h3>6.3.2 Frame Fields</h3>
<p>Generic frame structure:</p>
<table>
  <tr><th>Field</th><th>Purpose</th></tr>
  <tr><td>Start Frame</td><td>Signals the beginning of the frame</td></tr>
  <tr><td>Addressing</td><td>Source and destination MAC addresses</td></tr>
  <tr><td>Type / Length</td><td>Identifies the Layer 3 protocol (e.g. 0x0800 = IPv4)</td></tr>
  <tr><td>Data</td><td>The encapsulated packet</td></tr>
  <tr><td>FCS</td><td>Frame Check Sequence &mdash; CRC for error detection</td></tr>
  <tr><td>Stop Frame</td><td>Signals the end of the frame</td></tr>
</table>

<h3>6.3.3 Layer 2 Addresses</h3>
<p>Also called <strong>physical addresses</strong> or <strong>MAC addresses</strong>:</p>
<ul>
  <li>48 bits long, written as 12 hexadecimal digits.</li>
  <li>Format examples: <code>00-1A-2B-3C-4D-5E</code>, <code>00:1A:2B:3C:4D:5E</code>, <code>001A.2B3C.4D5E</code>.</li>
  <li>First 24 bits = <strong>OUI</strong> (Organizationally Unique Identifier) assigned to the vendor by IEEE.</li>
  <li>Last 24 bits = unique device identifier assigned by the vendor.</li>
  <li>Burned into the NIC at manufacture.</li>
</ul>

<h3>6.3.4 LAN and WAN Frames</h3>
<table>
  <tr><th>Type</th><th>Protocol</th><th>Example</th></tr>
  <tr><td>LAN frame</td><td>Ethernet</td><td>PC to switch to PC</td></tr>
  <tr><td>WAN frame</td><td>PPP, HDLC, Frame Relay</td><td>Router to router over serial link</td></tr>
</table>

<h3>Configuring Layer 2 on a Cisco switch</h3>
<pre class="cli"><span class="cmt">! Show the MAC address table:</span>
SW1# <span class="prompt">show mac address-table</span>

<span class="cmt">! Clear dynamic MAC entries:</span>
SW1# <span class="prompt">clear mac address-table dynamic</span>

<span class="cmt">! Show interface duplex and speed:</span>
SW1# <span class="prompt">show interfaces status</span>
SW1# <span class="prompt">show interfaces fa0/1</span>

<span class="cmt">! Configure duplex and speed (usually auto is best):</span>
SW1(config)# <span class="prompt">interface fa0/1</span>
SW1(config-if)# <span class="prompt">duplex full</span>
SW1(config-if)# <span class="prompt">speed 100</span>

<span class="cmt">! Show MAC address of an interface:</span>
SW1# <span class="prompt">show interfaces fa0/1 | include address</span></pre>

<div class="callout blue"><b>Key CCNA point</b>Ethernet uses CSMA/CD only in half-duplex mode (legacy hubs). Modern switched Ethernet is full-duplex &mdash; no collisions. Wireless uses CSMA/CA because it cannot detect collisions.</div>

content:`
<h2>7.1 Ethernet Frames</h2>
<h3>7.1.1 Ethernet Encapsulation</h3>
<p><strong>Ethernet</strong> is the dominant LAN technology, defined by IEEE 802.3. It operates at Layers 1 and 2. Ethernet frames carry Network-layer packets (typically IPv4 or IPv6) across the local network.</p>

<h3>7.1.2 Data Link Sublayers (Ethernet view)</h3>
<ul>
  <li><strong>LLC</strong> (802.2) &mdash; communicates with Layer 3.</li>
  <li><strong>MAC</strong> (802.3) &mdash; handles framing and addressing.</li>
</ul>

<h3>7.1.3 MAC Sublayer</h3>
<p>The MAC sublayer is responsible for:</p>
<ul>
  <li>Data encapsulation: Ethernet frame, MAC addressing, error detection.</li>
  <li>Media access control: placing frames on and removing them from the medium.</li>
</ul>

<h3>7.1.4 Ethernet Frame Fields</h3>
<table>
  <tr><th>Field</th><th>Size</th><th>Purpose</th></tr>
  <tr><td>Preamble + SFD</td><td>8 bytes</td><td>Synchronises and signals start of frame</td></tr>
  <tr><td>Destination MAC</td><td>6 bytes</td><td>Receiver's MAC address</td></tr>
  <tr><td>Source MAC</td><td>6 bytes</td><td>Sender's MAC address</td></tr>
  <tr><td>Type / Length</td><td>2 bytes</td><td>Identifies the encapsulated Layer 3 protocol</td></tr>
  <tr><td>Data / Payload</td><td>46&ndash;1500 bytes</td><td>The packet being carried</td></tr>
  <tr><td>FCS</td><td>4 bytes</td><td>Frame Check Sequence (CRC error detection)</td></tr>
</table>
<p>Minimum Ethernet frame size: <strong>64 bytes</strong>. Maximum: <strong>1518 bytes</strong> (without VLAN tag). Frames smaller than 64 bytes are called <strong>runts</strong> and are dropped. Frames larger than 1518 bytes are called <strong>giants</strong>.</p>

<h3>Common Ethernet Type values</h3>
<table>
  <tr><th>Type</th><th>Protocol</th></tr>
  <tr><td>0x0800</td><td>IPv4</td></tr>
  <tr><td>0x86DD</td><td>IPv6</td></tr>
  <tr><td>0x0806</td><td>ARP</td></tr>
  <tr><td>0x8100</td><td>VLAN-tagged frame (802.1Q)</td></tr>
</table>

<h2>7.2 Ethernet MAC Addresses</h2>
<h3>7.2.1 MAC Address and Hexadecimal</h3>
<p>A <strong>MAC address</strong> is a 48-bit (12 hex digit) unique identifier assigned to every NIC.</p>
<p>Formats:</p>
<ul>
  <li><code>00-1A-2B-3C-4D-5E</code> (dash)</li>
  <li><code>00:1A:2B:3C:4D:5E</code> (colon)</li>
  <li><code>001A.2B3C.4D5E</code> (dot, Cisco style)</li>
</ul>

<h3>7.2.3 Frame Processing</h3>
<p>When a switch receives a frame, it:</p>
<ol>
  <li>Checks the destination MAC.</li>
  <li>Looks up the MAC in its MAC address table.</li>
  <li>Forwards the frame out of the correct port, floods it, or filters (drops) it.</li>
</ol>

<h3>7.2.4 Unicast MAC Address</h3>
<p>A MAC address that identifies a specific NIC. The destination MAC in a unicast frame is a single device. In the first byte, the least significant bit of the first octet is <code>0</code>.</p>

<h3>7.2.5 Broadcast MAC Address</h3>
<p>All bits set to 1: <code>FF:FF:FF:FF:FF:FF</code>. A frame sent to this address is delivered to every device on the local network. Broadcasts do not cross routers.</p>

<h3>7.2.6 Multicast MAC Address</h3>
<p>A MAC address used to reach a group of devices. The first byte's least significant bit of the first octet is <code>1</code>. Multicast MAC addresses start with <code>01:00:5E</code> for IPv4 multicast.</p>

<h3>Viewing MAC addresses on Cisco devices</h3>
<pre class="cli"><span class="cmt">! Show the MAC address of an interface:</span>
SW1# <span class="prompt">show interfaces fa0/1</span>

<span class="cmt">! Show all interfaces with MAC:</span>
SW1# <span class="prompt">show interfaces | include address</span>

<span class="cmt">! Show the MAC of the switch itself:</span>
SW1# <span class="prompt">show version</span>

<span class="cmt">! Show connected Cisco neighbors (including MACs):</span>
SW1# <span class="prompt">show cdp neighbors detail</span>

<span class="cmt">! On a PC (Windows):</span>
C:\\&gt; <span class="prompt">ipconfig /all</span>
C:\\&gt; <span class="prompt">getmac</span></pre>

<h2>7.3 The MAC Address Table</h2>
<h3>7.3.1 Switch Fundamentals</h3>
<p>A <strong>switch</strong> is a Layer 2 device that forwards frames based on MAC addresses. Each port on a switch is its own <strong>collision domain</strong> &mdash; but all ports belong to the same <strong>broadcast domain</strong> unless VLANs are configured.</p>

<h3>7.3.2 Switch Learning and Forwarding</h3>
<p>The switch builds its MAC address table (also called the CAM table) by examining the <strong>source MAC</strong> of every incoming frame:</p>
<ol>
  <li>Frame arrives on a port.</li>
  <li>Switch records the source MAC &rarr; port mapping in the CAM table with a timestamp.</li>
  <li>Switch looks up the destination MAC in the table.</li>
  <li>If found, the frame is forwarded out of the matching port (<strong>forward</strong>).</li>
  <li>If not found, the switch floods the frame out of all other ports (<strong>unknown unicast flood</strong>).</li>
</ol>
<p>Entries time out after 5 minutes (300 seconds) by default.</p>

<h3>7.3.3 Filtering Frames</h3>
<p>If the destination MAC is on the same port the frame arrived on, the switch <strong>filters</strong> (drops) the frame. This is normal when two devices on the same port (via a hub) communicate.</p>

<h3>Viewing the CAM table</h3>
<pre class="cli"><span class="cmt">! Show the MAC address table:</span>
SW1# <span class="prompt">show mac address-table</span>

<span class="cmt">! Show only dynamic entries:</span>
SW1# <span class="prompt">show mac address-table dynamic</span>

<span class="cmt">! Show entries learned on a specific interface:</span>
SW1# <span class="prompt">show mac address-table interface fa0/1</span>

<span class="cmt">! Show entries for a specific VLAN:</span>
SW1# <span class="prompt">show mac address-table vlan 1</span>

<span class="cmt">! Show a specific MAC:</span>
SW1# <span class="prompt">show mac address-table address 001a.2b3c.4d5e</span>

<span class="cmt">! Change the aging time (in seconds):</span>
SW1(config)# <span class="prompt">mac address-table aging-time 600</span>

<span class="cmt">! Add a static MAC entry:</span>
SW1(config)# <span class="prompt">mac address-table static 001a.2b3c.4d5e vlan 1 interface fa0/1</span></pre>

<h2>7.4 Switch Speeds and Forwarding Methods</h2>
<h3>7.4.1 Frame Forwarding Methods</h3>
<table>
  <tr><th>Method</th><th>Description</th></tr>
  <tr><td><strong>Store-and-forward</strong></td><td>Receives the entire frame, checks the FCS, then forwards. Highest integrity.</td></tr>
  <tr><td><strong>Cut-through</strong></td><td>Forwards as soon as the destination MAC is read. Faster, no error checking.</td></tr>
  <tr><td><strong>Fragment-free</strong></td><td>Reads the first 64 bytes (minimum frame size) before forwarding. Compromise.</td></tr>
</table>

<h3>7.4.2 Cut-Through Switching</h3>
<p>Cut-through switching has two main variants:</p>
<ul>
  <li><strong>Fast-forward</strong> &mdash; forwards immediately after reading the destination MAC. Lowest latency, highest error propagation.</li>
  <li><strong>Fragment-free</strong> &mdash; reads the first 64 bytes to filter out runts, then forwards.</li>
</ul>

<h3>7.4.3 Memory Buffering on Switches</h3>
<table>
  <tr><th>Method</th><th>Description</th></tr>
  <tr><td>Port-based memory</td><td>Each port has its own buffer. A busy port can slow delivery to a busy destination even if other ports are free.</td></tr>
  <tr><td>Shared memory</td><td>All ports share one buffer pool. More efficient; allows flexible port allocation.</td></tr>
</table>

<h3>7.4.4 Duplex and Speed Settings</h3>
<p>Best practice on modern equipment: set both duplex and speed to <strong>auto</strong> on both sides of a link.</p>
<table>
  <tr><th>Setting</th><th>Result</th></tr>
  <tr><td>Auto / auto</td><td>Both negotiate correctly (best).</td></tr>
  <tr><td>Auto / full</td><td>Duplex mismatch &mdash; slow performance, late collisions, CRC errors.</td></tr>
  <tr><td>Full / full</td><td>Works, but must be set on both ends.</td></tr>
  <tr><td>Half / half</td><td>Works but unnecessary on modern switches.</td></tr>
</table>
<div class="callout red"><b>Watch out</b>Duplex mismatch is one of the most common causes of slow performance in networks. Always match settings on both ends.</div>

<h3>7.4.5 Auto-MDIX</h3>
<p><strong>Auto-MDIX</strong> automatically detects whether a straight-through or crossover cable is required and adjusts internally. Enabled by default on modern Cisco switches. Removes the need for crossover cables.</p>

<h3>Configuring switch ports</h3>
<pre class="cli"><span class="cmt">! Set a port to auto speed and duplex:</span>
SW1(config)# <span class="prompt">interface fa0/1</span>
SW1(config-if)# <span class="prompt">speed auto</span>
SW1(config-if)# <span class="prompt">duplex auto</span>

<span class="cmt">! Hard-set 100 Mbps full-duplex:</span>
SW1(config-if)# <span class="prompt">speed 100</span>
SW1(config-if)# <span class="prompt">duplex full</span>

<span class="cmt">! Enable auto-MDIX:</span>
SW1(config-if)# <span class="prompt">mdix auto</span>

<span class="cmt">! Describe the port:</span>
SW1(config-if)# <span class="prompt">description Uplink to Core Switch</span>

<span class="cmt">! Verify:</span>
SW1# <span class="prompt">show interfaces fa0/1</span>
SW1# <span class="prompt">show interfaces status</span>
SW1# <span class="prompt">show interfaces fa0/1 | include duplex|speed</span></pre>

<div class="callout blue"><b>CCNA exam tip</b>Know the difference between store-and-forward (default, error-checking) and cut-through (faster, no error checking). Know that Auto-MDIX eliminates the need for crossover cables on modern switches.</div>
