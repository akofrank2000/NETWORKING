title:'Module 8: Network Layer',
sub:'Network layer characteristics · IPv4 packet · IPv6 packet · host routing · introduction to routing',
content:`
<h2>8.1 Network Layer Characteristics</h2>
<h3>8.1.1 The Network Layer</h3>
<p>The <strong>Network layer (Layer 3)</strong> is responsible for:</p>
<ul>
  <li>Providing logical addressing (IP addresses) to devices.</li>
  <li>Encapsulating Transport-layer segments into <strong>packets</strong>.</li>
  <li>Routing packets from the source host to the destination host across networks.</li>
  <li>De-encapsulating packets at the destination and delivering them to the Transport layer.</li>
</ul>
<p>The primary protocol at this layer is <strong>IP</strong> (IPv4 and IPv6).</p>

<h3>8.1.2 IP Encapsulation</h3>
<p>The IP packet contains:</p>
<ul>
  <li>An IP header (source IP, destination IP, TTL, protocol, etc.).</li>
  <li>The Transport-layer segment (TCP or UDP) as payload.</li>
</ul>
<p>The packet is then encapsulated inside a Layer 2 frame (e.g. Ethernet) for the local link.</p>

<h3>8.1.3 Characteristics of IP</h3>
<p>IP is:</p>
<ul>
  <li><strong>Connectionless</strong> &mdash; no session is established before sending.</li>
  <li><strong>Best-effort</strong> &mdash; no guarantee of delivery, ordering or error correction.</li>
  <li><strong>Media-independent</strong> &mdash; works over any Layer 2 technology (Ethernet, Wi-Fi, PPP, etc.).</li>
</ul>

<h3>8.1.4 Connectionless</h3>
<p>IP does not establish a connection before transmitting. Each packet is treated independently and may take a different path. There is no setup or teardown like TCP.</p>

<h3>8.1.5 Best Effort</h3>
<p>IP does not guarantee delivery. If a packet is lost, corrupted, or reordered, IP does not correct it. Higher-layer protocols (TCP) handle reliability if needed.</p>

<h3>8.1.6 Media Independent</h3>
<p>IP is independent of the underlying Layer 2 technology. That means IP can be carried over Ethernet, Wi-Fi, fiber, serial links, and more. The <strong>MTU</strong> (Maximum Transmission Unit) varies by medium.</p>

<h2>8.2 IPv4 Packet</h2>
<h3>8.2.1&ndash;8.2.2 IPv4 Packet Header</h3>
<p>An IPv4 header is typically <strong>20 bytes</strong> (up to 60 with options).</p>
<table>
  <tr><th>Field</th><th>Size</th><th>Purpose</th></tr>
  <tr><td>Version</td><td>4 bits</td><td>4 for IPv4</td></tr>
  <tr><td>IHL (Header Length)</td><td>4 bits</td><td>Header length in 32-bit words</td></tr>
  <tr><td>DSCP / ToS</td><td>8 bits</td><td>Quality of Service marking</td></tr>
  <tr><td>Total Length</td><td>16 bits</td><td>Entire packet size (header + data)</td></tr>
  <tr><td>Identification</td><td>16 bits</td><td>Used for fragment reassembly</td></tr>
  <tr><td>Flags</td><td>3 bits</td><td>Fragment control (Don't Fragment, More Fragments)</td></tr>
  <tr><td>Fragment Offset</td><td>13 bits</td><td>Position of fragment in original packet</td></tr>
  <tr><td>TTL</td><td>8 bits</td><td>Hop limit; decremented by each router</td></tr>
  <tr><td>Protocol</td><td>8 bits</td><td>Identifies the payload protocol (6=TCP, 17=UDP, 1=ICMP)</td></tr>
  <tr><td>Header Checksum</td><td>16 bits</td><td>Error check on the header</td></tr>
  <tr><td>Source IP</td><td>32 bits</td><td>Sender's IP address</td></tr>
  <tr><td>Destination IP</td><td>32 bits</td><td>Receiver's IP address</td></tr>
  <tr><td>Options</td><td>0&ndash;40 bytes</td><td>Optional parameters (rarely used)</td></tr>
</table>

<h3>Key IPv4 header fields for CCNA</h3>
<ul>
  <li><strong>TTL</strong> &mdash; decremented by each router; at zero the packet is dropped and ICMP Time Exceeded is sent. Prevents loops.</li>
  <li><strong>Protocol</strong> &mdash; identifies the payload (6 = TCP, 17 = UDP, 1 = ICMP).</li>
  <li><strong>DSCP</strong> &mdash; used for QoS; voice is EF (46).</li>
  <li><strong>Identification / Flags / Fragment Offset</strong> &mdash; allow large packets to be split to fit a smaller MTU.</li>
</ul>

<h2>8.3 IPv6 Packet</h2>
<h3>8.3.1 Limitations of IPv4</h3>
<ul>
  <li><strong>Address depletion</strong> &mdash; IPv4 has about 4.3 billion addresses; these are exhausted.</li>
  <li><strong>Internet routing table growth</strong> &mdash; large routing tables.</li>
  <li><strong>NAT</strong> &mdash; breaks end-to-end connectivity.</li>
  <li>No built-in security (IPsec was added later).</li>
  <li>Limited QoS mechanisms.</li>
</ul>

<h3>8.3.2 IPv6 Overview</h3>
<ul>
  <li>128-bit addresses (340 undecillion available).</li>
  <li>Written in hexadecimal, 8 groups of 4 hex digits separated by colons.</li>
  <li>Simplified 40-byte header (no checksum, no fragmentation by routers).</li>
  <li>Built-in support for IPsec and QoS.</li>
  <li>Autoconfiguration (SLAAC).</li>
  <li>No broadcast &mdash; uses multicast and anycast.</li>
</ul>

<h3>8.3.4 IPv6 Packet Header</h3>
<table>
  <tr><th>Field</th><th>Size</th><th>Purpose</th></tr>
  <tr><td>Version</td><td>4 bits</td><td>6 for IPv6</td></tr>
  <tr><td>Traffic Class</td><td>8 bits</td><td>Similar to DSCP in IPv4</td></tr>
  <tr><td>Flow Label</td><td>20 bits</td><td>Identifies packets of a flow for QoS</td></tr>
  <tr><td>Payload Length</td><td>16 bits</td><td>Length of payload including extension headers</td></tr>
  <tr><td>Next Header</td><td>8 bits</td><td>Identifies next header or payload protocol</td></tr>
  <tr><td>Hop Limit</td><td>8 bits</td><td>Equivalent of IPv4 TTL</td></tr>
  <tr><td>Source Address</td><td>128 bits</td><td>Sender address</td></tr>
  <tr><td>Destination Address</td><td>128 bits</td><td>Destination address</td></tr>
</table>

<h2>8.4 How a Host Routes</h2>
<h3>8.4.1 Host Forwarding Decision</h3>
<p>When a host sends a packet, it must decide:</p>
<ol>
  <li>Is the destination on the same network as me?</li>
  <li>If yes, send the packet directly to the destination (using ARP for the MAC).</li>
  <li>If no, send the packet to the default gateway.</li>
</ol>

<h3>8.4.2 Default Gateway</h3>
<p>The <strong>default gateway</strong> is the router on the local network that the host sends packets to when the destination is not on the local subnet. It must be on the same subnet as the host.</p>

<h3>8.4.3 A Host Routes to the Default Gateway</h3>
<p>The host uses ARP to find the MAC of the default gateway and encapsulates the packet in a frame destined for that MAC. The IP packet still contains the destination IP of the final host.</p>

<h3>8.4.4 Host Routing Tables</h3>
<p>The host maintains its own routing table with entries for:</p>
<ul>
  <li>Loopback (127.0.0.0/8)</li>
  <li>Local subnet (connected route)</li>
  <li>Default route (via default gateway)</li>
  <li>Any additional static routes</li>
</ul>

<h3>Viewing host routing tables</h3>
<pre class="cli"><span class="cmt">! Windows:</span>
C:\\&gt; <span class="prompt">route print</span>
C:\\&gt; <span class="prompt">netstat -rn</span>

<span class="cmt">! Linux:</span>
$ <span class="prompt">ip route</span>
$ <span class="prompt">route -n</span>
$ <span class="prompt">netstat -rn</span>

<span class="cmt">! macOS:</span>
$ <span class="prompt">netstat -rn</span></pre>

<h2>8.5 Introduction to Routing</h2>
<h3>8.5.1 Router Packet Forwarding Decision</h3>
<p>A router receives a packet, examines the destination IP, and consults its routing table to decide where to send it next.</p>
<ol>
  <li>Extract destination IP from the packet.</li>
  <li>Look for a matching route in the routing table (longest prefix match wins).</li>
  <li>If a match is found, forward out the outgoing interface toward the next hop.</li>
  <li>If no match, use the default route (0.0.0.0/0) or drop the packet and send ICMP Unreachable.</li>
</ol>

<h3>8.5.2 IP Router Routing Table</h3>
<p>A routing table entry contains:</p>
<ul>
  <li>Destination network and prefix (e.g. 192.168.1.0/24)</li>
  <li>Next hop (the next router's IP)</li>
  <li>Outgoing interface</li>
  <li>Metric (cost of the route)</li>
  <li>Administrative distance (trustworthiness)</li>
</ul>

<h3>8.5.3 Static Routing</h3>
<p>Routes manually configured by an administrator. Simple, predictable, but not scalable.</p>
<pre class="cli"><span class="cmt">! Configure a static route to a network:</span>
R1(config)# <span class="prompt">ip route 192.168.2.0 255.255.255.0 10.1.1.2</span>

<span class="cmt">! Or using prefix notation:</span>
R1(config)# <span class="prompt">ip route 192.168.2.0/24 10.1.1.2</span>

<span class="cmt">! Configure a default route (all unknown destinations):</span>
R1(config)# <span class="prompt">ip route 0.0.0.0 0.0.0.0 10.1.1.2</span>

<span class="cmt">! Verify the routing table:</span>
R1# <span class="prompt">show ip route</span>
R1# <span class="prompt">show ip route static</span></pre>

<h3>8.5.4 Dynamic Routing</h3>
<p>Routes learned automatically through routing protocols. The router exchanges information with neighbours and builds the routing table dynamically.</p>
<table>
  <tr><th>Protocol</th><th>Type</th><th>Metric</th><th>Notes</th></tr>
  <tr><td>RIP</td><td>Distance vector</td><td>Hop count</td><td>Max 15 hops; small networks</td></tr>
  <tr><td>OSPF</td><td>Link state</td><td>Cost (bandwidth)</td><td>Common enterprise IGP</td></tr>
  <tr><td>EIGRP</td><td>Advanced distance vector</td><td>Composite</td><td>Cisco; fast convergence</td></tr>
  <tr><td>BGP</td><td>Path vector</td><td>Path attributes</td><td>Internet backbone; between autonomous systems</td></tr>
</table>

<h3>8.5.6 Introduction to an IPv4 Routing Table</h3>
<p>Reading a route entry:</p>
<pre class="cli">R1# <span class="prompt">show ip route</span>

title:'Module 9: Address Resolution',
sub:'MAC and IP · ARP · ARP tables · ARP issues · IPv6 Neighbor Discovery',
content:`
<h2>9.1 MAC and IP</h2>
<h3>9.1.1 Destination on Same Network</h3>
<p>When a host wants to send data to a device on the <strong>same network</strong>:</p>
<ol>
  <li>Layer 3 (IP) builds a packet with source and destination IP addresses.</li>
  <li>Layer 2 (Ethernet) must build a frame. It needs the destination MAC.</li>
  <li>If the destination MAC is unknown, the host uses <strong>ARP</strong> to find it.</li>
</ol>
<p>Once the destination MAC is known, the frame is sent directly on the local network.</p>

<h3>9.1.2 Destination on Remote Network</h3>
<p>When a host wants to send data to a device on a <strong>remote network</strong>:</p>
<ol>
  <li>Layer 3 still uses the destination's IP address (unchanged end-to-end).</li>
  <li>Layer 2 must use the <strong>default gateway's MAC</strong> as the destination MAC.</li>
  <li>The host uses ARP to find the MAC of the default gateway.</li>
</ol>
<p>At each hop, the router strips the frame and re-encapsulates the packet in a new frame with new source and destination MACs. The IP addresses never change.</p>

<div class="callout blue"><b>Key CCNA rule</b>The IP address is the same from source to destination. The MAC address changes at every hop.</div>

<h2>9.2 ARP</h2>
<h3>9.2.1 ARP Overview</h3>
<p><strong>ARP (Address Resolution Protocol)</strong> is a Layer 2 protocol used to resolve an IPv4 address to a MAC address. There are two messages:</p>
<ul>
  <li><strong>ARP Request</strong> &mdash; broadcast sent by the sender: "Who has IP 192.168.1.10? Tell 192.168.1.20."</li>
  <li><strong>ARP Reply</strong> &mdash; unicast sent by the owner of that IP: "I have 192.168.1.10, my MAC is 00:1A:2B:3C:4D:5E."</li>
</ul>

<h3>9.2.2 ARP Functions</h3>
<ol>
  <li>Sender checks its ARP table for a matching entry.</li>
  <li>If not found, sender broadcasts an ARP request.</li>
  <li>All devices on the local network receive the broadcast.</li>
  <li>Only the device with the matching IP replies with its MAC.</li>
  <li>The sender adds the MAC to its ARP cache and builds the frame.</li>
</ol>

<h3>9.2.6 Removing Entries from an ARP Table</h3>
<p>Entries time out automatically (Windows: 2 minutes for stale, up to 10 minutes for complete). You can clear them manually:</p>
<pre class="cli"><span class="cmt">! Windows:</span>
C:\\&gt; <span class="prompt">arp -a</span>
C:\\&gt; <span class="prompt">arp -d</span>
C:\\&gt; <span class="prompt">arp -d 192.168.1.10</span>

<span class="cmt">! Linux:</span>
$ <span class="prompt">ip neigh show</span>
$ <span class="prompt">ip neigh flush all</span>
$ <span class="prompt">arp -n</span>

<span class="cmt">! Cisco IOS:</span>
Router# <span class="prompt">show arp</span>
Router# <span class="prompt">show ip arp</span>
Router# <span class="prompt">clear arp-cache</span>
Router# <span class="prompt">clear ip arp 192.168.1.10</span></pre>

<h3>9.2.7 ARP Tables on Networking Devices</h3>
<p>Routers and Layer 3 switches also keep ARP tables. Each interface can have its own ARP entries. You can also configure <strong>static ARP</strong> entries:</p>
<pre class="cli">Router(config)# <span class="prompt">arp 192.168.1.10 001a.2b3c.4d5e arpa</span>

<span class="cmt">! Set ARP timeout (in seconds):</span>
Router(config)# <span class="prompt">interface g0/0</span>
Router(config-if)# <span class="prompt">arp timeout 300</span></pre>

<h3>9.2.8 ARP Issues</h3>
<h4>ARP Broadcasts</h4>
<p>ARP requests are broadcasts, so every device on the local network processes them. Too many ARP broadcasts can waste bandwidth and CPU &mdash; especially on large flat networks.</p>
<h4>ARP Spoofing / ARP Poisoning</h4>
<p>An attacker sends forged ARP replies to associate their MAC with another device's IP (often the default gateway). Traffic intended for the gateway is redirected to the attacker &mdash; a man-in-the-middle attack.</p>
<p>Mitigations:</p>
<ul>
  <li><strong>Dynamic ARP Inspection (DAI)</strong> on switches &mdash; validates ARP packets against a trusted DHCP snooping database.</li>
  <li><strong>DHCP Snooping</strong> &mdash; builds a trusted IP-to-MAC binding table.</li>
  <li><strong>Static ARP entries</strong> for critical devices.</li>
  <li><strong>Port security</strong> to prevent MAC spoofing.</li>
</ul>

<h2>9.3 IPv6 Neighbor Discovery</h2>
<h3>9.3.1&ndash;9.3.2 IPv6 Neighbor Discovery Messages</h3>
<p>IPv6 does not use ARP. Instead, it uses <strong>Neighbor Discovery (ND)</strong>, defined in ICMPv6, with these message types:</p>
<table>
  <tr><th>Message</th><th>Purpose</th></tr>
  <tr><td><strong>NS</strong> (Neighbor Solicitation)</td><td>Requests the MAC address of a target IPv6 address (like an ARP request)</td></tr>
  <tr><td><strong>NA</strong> (Neighbor Advertisement)</td><td>Provides the MAC address in reply (like an ARP reply)</td></tr>
  <tr><td><strong>RS</strong> (Router Solicitation)</td><td>Host asks routers for configuration information</td></tr>
  <tr><td><strong>RA</strong> (Router Advertisement)</td><td>Router advertises prefix, default gateway, and other parameters</td></tr>
  <tr><td><strong>Redirect</strong></td><td>Router tells a host a better next-hop</td></tr>
</table>

<h3>9.3.3 IPv6 Neighbor Discovery &mdash; Address Resolution</h3>
<ol>
  <li>Host A needs Host B's MAC. It sends a Neighbor Solicitation to the <strong>solicited-node multicast address</strong> of Host B's IPv6 address.</li>
  <li>The solicited-node multicast address is based on the last 24 bits of the target address (format: <code>FF02::1:FFxx:xxxx</code>).</li>
  <li>Host B receives the NS and replies with a Neighbor Advertisement containing its MAC.</li>
  <li>Host A caches the result and builds the frame.</li>
</ol>
<p>Because NS uses multicast (not broadcast), it is more efficient than IPv4 ARP.</p>

<h3>9.3.4 Verify IPv6 Neighbor Discovery on Cisco IOS</h3>
<pre class="cli"><span class="cmt">! Show IPv6 neighbors (like show ip arp for IPv6):</span>
Router# <span class="prompt">show ipv6 neighbors</span>

<span class="cmt">! Show IPv6 interface configuration:</span>
Router# <span class="prompt">show ipv6 interface brief</span>
Router# <span class="prompt">show ipv6 interface g0/0</span>

<span class="cmt">! Show IPv6 routing table:</span>
Router# <span class="prompt">show ipv6 route</span>

<span class="cmt">! Enable IPv6 unicast routing on the router:</span>
Router(config)# <span class="prompt">ipv6 unicast-routing</span>

<span class="cmt">! Configure an IPv6 address:</span>
Router(config)# <span class="prompt">interface g0/0</span>
Router(config-if)# <span class="prompt">ipv6 address 2001:db8:acad:1::1/64</span>
Router(config-if)# <span class="prompt">ipv6 address fe80::1 link-local</span>
Router(config-if)# <span class="prompt">no shutdown</span></pre>

<h3>Windows IPv6 neighbor commands</h3>
<pre class="cli"><span class="cmt">! Show IPv6 neighbors:</span>
C:\\&gt; <span class="prompt">netsh interface ipv6 show neighbors</span>

<span class="cmt">! Show IPv6 addresses:</span>
C:\\&gt; <span class="prompt">ipconfig /all</span>

<span class="cmt">! Show routes:</span>
C:\\&gt; <span class="prompt">netsh interface ipv6 show route</span>
C:\\&gt; <span class="prompt">route print -6</span></pre>

<div class="callout green"><b>CCNA exam tip</b>Know that ARP is used for IPv4, and Neighbor Discovery (with NS/NA) is used for IPv6. Both serve the same purpose: resolve a Layer 3 address to a Layer 2 MAC address.</div>

<h2>11.1 IPv4 Address Structure</h2>
<h3>11.1.1 Network and Host Portions</h3>
<p>An IPv4 address is 32 bits, split into a <strong>network portion</strong> (identifies the network) and a <strong>host portion</strong> (identifies the device).</p>
<p>Example: <code>192.168.10.25/24</code></p>
<ul>
  <li>Network portion: <code>192.168.10</code> (first 24 bits)</li>
  <li>Host portion: <code>.25</code> (last 8 bits)</li>
</ul>

<h3>11.1.2 The Subnet Mask</h3>
<p>The <strong>subnet mask</strong> is a 32-bit value that separates the network and host portions. It uses 1s for network bits and 0s for host bits.</p>
<table>
  <tr><th>Prefix</th><th>Subnet mask</th><th>Host bits</th><th>Hosts</th></tr>
  <tr><td>/24</td><td>255.255.255.0</td><td>8</td><td>254</td></tr>
  <tr><td>/25</td><td>255.255.255.128</td><td>7</td><td>126</td></tr>
  <tr><td>/26</td><td>255.255.255.192</td><td>6</td><td>62</td></tr>
  <tr><td>/27</td><td>255.255.255.224</td><td>5</td><td>30</td></tr>
  <tr><td>/28</td><td>255.255.255.240</td><td>4</td><td>14</td></tr>
  <tr><td>/29</td><td>255.255.255.248</td><td>3</td><td>6</td></tr>
  <tr><td>/30</td><td>255.255.255.252</td><td>2</td><td>2</td></tr>
</table>

<h3>11.1.3 The Prefix Length</h3>
<p>The prefix length is a shorthand for the subnet mask. <code>/24</code> means the first 24 bits are the network portion.</p>

<h3>11.1.4 Determining the Network &mdash; Logical AND</h3>
<p>The network address is found by performing a binary <strong>AND</strong> of the IP address and the subnet mask. In AND logic: 1 AND 1 = 1; anything else = 0.</p>
<p>Example: IP <code>192.168.10.25</code>, mask <code>255.255.255.0</code></p>
<pre class="cli">IP:    11000000.10101000.00001010.00011001
Mask:  11111111.11111111.11111111.00000000
AND:   11000000.10101000.00001010.00000000  = 192.168.10.0</pre>

<h3>11.1.6 Network, Host, and Broadcast Addresses</h3>
<p>Every subnet has three special addresses:</p>
<ul>
  <li><strong>Network address</strong> &mdash; all host bits zero. Identifies the subnet.</li>
  <li><strong>First usable host</strong> &mdash; network address + 1.</li>
  <li><strong>Last usable host</strong> &mdash; broadcast address &minus; 1.</li>
  <li><strong>Broadcast address</strong> &mdash; all host bits one. Reaches all hosts on the subnet.</li>
</ul>
<p>Example for <code>192.168.10.0/24</code>:</p>
<table>
  <tr><th>Address</th><th>Value</th></tr>
  <tr><td>Network</td><td>192.168.10.0</td></tr>
  <tr><td>First host</td><td>192.168.10.1</td></tr>
  <tr><td>Last host</td><td>192.168.10.254</td></tr>
  <tr><td>Broadcast</td><td>192.168.10.255</td></tr>
</table>

<h2>11.2 IPv4 Unicast, Broadcast, and Multicast</h2>
<h3>11.2.1 Unicast</h3>
<p>One-to-one communication. The destination address identifies a single host. Standard traffic: HTTP, FTP, SSH, DNS responses.</p>
<p>Unicast range in the first octet: <code>0.0.0.0</code> to <code>223.255.255.255</code>.</p>

<h3>11.2.2 Broadcast</h3>
<p>One-to-all within the local network. Two types:</p>
<ul>
  <li><strong>Directed broadcast</strong> &mdash; sent to all hosts in a specific subnet, e.g. <code>192.168.10.255</code>. Routers do not forward these by default.</li>
  <li><strong>Limited broadcast</strong> &mdash; <code>255.255.255.255</code>. Stays on the local network.</li>
</ul>

<h3>11.2.3 Multicast</h3>
<p>One-to-many communication. The sender sends to a single multicast address, and all members of the group receive it. Range: <code>224.0.0.0</code> to <code>239.255.255.255</code>.</p>
<p>Common multicast addresses:</p>
<table>
  <tr><th>Address</th><th>Use</th></tr>
  <tr><td>224.0.0.1</td><td>All hosts on this subnet</td></tr>
  <tr><td>224.0.0.2</td><td>All routers on this subnet</td></tr>
  <tr><td>224.0.0.5 / .6</td><td>OSPF</td></tr>
  <tr><td>224.0.0.9</td><td>RIPv2</td></tr>
  <tr><td>224.0.0.10</td><td>EIGRP</td></tr>
</table>

<h2>11.3 Types of IPv4 Addresses</h2>
<h3>11.3.1 Public and Private IPv4 Addresses</h3>
<p><strong>Private ranges</strong> (RFC 1918) &mdash; not routable on the internet:</p>
<table>
  <tr><th>Range</th><th>Prefix</th><th>Number of addresses</th></tr>
  <tr><td>10.0.0.0 &ndash; 10.255.255.255</td><td>10.0.0.0/8</td><td>~16.7 million</td></tr>
  <tr><td>172.16.0.0 &ndash; 172.31.255.255</td><td>172.16.0.0/12</td><td>~1 million</td></tr>
  <tr><td>192.168.0.0 &ndash; 192.168.255.255</td><td>192.168.0.0/16</td><td>~65,000</td></tr>
</table>
<p>Public addresses are routable on the internet and assigned by IANA / RIRs.</p>

<h3>11.3.2 Routing to the Internet (NAT)</h3>
<p>Because private addresses are not routable on the internet, NAT (Network Address Translation) translates private addresses to a public address at the network edge.</p>

<h3>11.3.4 Special Use IPv4 Addresses</h3>
<table>
  <tr><th>Address</th><th>Purpose</th></tr>
  <tr><td>0.0.0.0/8</td><td>"This network"</td></tr>
  <tr><td>127.0.0.0/8</td><td>Loopback (127.0.0.1)</td></tr>
  <tr><td>169.254.0.0/16</td><td>APIPA (link-local)</td></tr>
  <tr><td>192.0.2.0/24</td><td>TEST-NET-1 (documentation)</td></tr>
  <tr><td>198.51.100.0/24</td><td>TEST-NET-2</td></tr>
  <tr><td>203.0.113.0/24</td><td>TEST-NET-3</td></tr>
  <tr><td>224.0.0.0/4</td><td>Multicast</td></tr>
  <tr><td>240.0.0.0/4</td><td>Reserved (class E)</td></tr>
  <tr><td>255.255.255.255</td><td>Limited broadcast</td></tr>
</table>

<h3>11.3.5 Legacy Classful Addressing</h3>
<table>
  <tr><th>Class</th><th>First octet</th><th>Default mask</th><th>Purpose</th></tr>
  <tr><td>A</td><td>1&ndash;126</td><td>/8</td><td>Very large networks</td></tr>
  <tr><td>B</td><td>128&ndash;191</td><td>/16</td><td>Medium networks</td></tr>
  <tr><td>C</td><td>192&ndash;223</td><td>/24</td><td>Small networks</td></tr>
  <tr><td>D</td><td>224&ndash;239</td><td>Multicast</td><td>Multicast</td></tr>
  <tr><td>E</td><td>240&ndash;255</td><td>Reserved</td><td>Experimental</td></tr>
</table>
<p>Classful addressing was replaced by <strong>CIDR</strong> (Classless Inter-Domain Routing), which allows any prefix length.</p>

<h3>11.3.6 Assignment of IP Addresses</h3>
<ul>
  <li><strong>IANA</strong> &mdash; global coordination.</li>
  <li><strong>RIRs</strong> &mdash; Regional Internet Registries (ARIN, RIPE, APNIC, LACNIC, AFRINIC) allocate to ISPs and organisations.</li>
  <li><strong>ISPs</strong> &mdash; allocate to customers.</li>
  <li><strong>Organisations</strong> &mdash; assign to devices statically or via DHCP.</li>
</ul>

<h2>11.4 Network Segmentation</h2>
<h3>11.4.1 Broadcast Domains and Segmentation</h3>
<p>A <strong>broadcast domain</strong> is a group of devices that receive each other's broadcasts. Routers (and VLANs) separate broadcast domains. Switches forward broadcasts to all ports (unless VLANs are configured).</p>

<h3>11.4.2 Problems with Large Broadcast Domains</h3>
<ul>
  <li>Broadcast traffic wastes bandwidth.</li>
  <li>Every host must process every broadcast, consuming CPU.</li>
  <li>Security risk: broadcast information reaches every device.</li>
  <li>Harder to troubleshoot and manage.</li>
</ul>

<h3>11.4.3 Reasons for Segmenting Networks</h3>
<ul>
  <li>Reduce broadcast traffic.</li>
  <li>Improve performance by isolating traffic.</li>
  <li>Improve security by controlling what can reach what.</li>
  <li>Simplify administration and troubleshooting.</li>
  <li>Enforce policy per segment.</li>
</ul>

<h2>11.5 Subnet an IPv4 Network</h2>
<h3>11.5.1 Subnet on an Octet Boundary</h3>
<p>When you borrow bits in the last octet, subnets step by a fixed block size. Block size = 256 &minus; mask octet.</p>

<h3>11.5.2 Subnet within an Octet Boundary</h3>
<p>Example: subnet <code>192.168.1.0/24</code> into four subnets (borrow 2 bits &rarr; /26).</p>
<table>
  <tr><th>Subnet</th><th>Network</th><th>Range</th><th>Broadcast</th></tr>
  <tr><td>1</td><td>192.168.1.0</td><td>.1 &ndash; .62</td><td>.63</td></tr>
  <tr><td>2</td><td>192.168.1.64</td><td>.65 &ndash; .126</td><td>.127</td></tr>
  <tr><td>3</td><td>192.168.1.128</td><td>.129 &ndash; .190</td><td>.191</td></tr>
  <tr><td>4</td><td>192.168.1.192</td><td>.193 &ndash; .254</td><td>.255</td></tr>
</table>

<h3>The magic number method</h3>
<ol>
  <li>Subtract the mask's interesting octet from 256 to get the block size.</li>
  <li>Subnets step by that block size.</li>
  <li>The broadcast is one less than the next subnet's network address.</li>
</ol>
<p>Example: mask 255.255.255.224 &rarr; block size = 256 &minus; 224 = 32 &rarr; subnets at .0, .32, .64, .96, .128, .160, .192, .224.</p>

<h3>11.5.5 Configuring IPv4 on a router interface</h3>
<pre class="cli">R1(config)# <span class="prompt">interface g0/0/0</span>
R1(config-if)# <span class="prompt">ip address 192.168.1.1 255.255.255.192</span>
R1(config-if)# <span class="prompt">no shutdown</span>

<span class="cmt">! Or using prefix notation:</span>
R1(config-if)# <span class="prompt">ip address 192.168.1.1 255.255.255.192</span></pre>

<h2>11.6 Subnet a Slash 16 and a Slash 8 Prefix</h2>
<h3>11.6.1 Create Subnets with a Slash 16 Prefix</h3>
<p>Example: <code>172.16.0.0/16</code>. To create 100 subnets you need to borrow 7 bits (2<sup>7</sup> = 128). New prefix: <code>/23</code> (mask 255.255.254.0).</p>

<h3>11.6.2 Create 100 Subnets with a Slash 16 Prefix</h3>
<p>Borrowing 7 bits from the host portion leaves 9 host bits: 2<sup>9</sup> &minus; 2 = 510 hosts per subnet.</p>

<h3>11.6.3 Create 1000 Subnets with a Slash 8 Prefix</h3>
<p>Example: <code>10.0.0.0/8</code>. To create 1000 subnets, borrow 10 bits (2<sup>10</sup> = 1024). New prefix: <code>/18</code> (mask 255.255.192.0). Hosts per subnet: 2<sup>14</sup> &minus; 2 = 16,382.</p>

<h2>11.7 Subnet to Meet Requirements</h2>
<h3>11.7.2 Minimize Unused Host IPv4 Addresses and Maximize Subnets</h3>
<p>Given a network and requirements, choose the smallest subnet that fits the largest host requirement. Then subnet the remainder.</p>

<h3>11.7.3 Example &mdash; Efficient IPv4 Subnetting</h3>
<p>Network: <code>192.168.20.0/24</code>. Need:</p>
<ul>
  <li>LAN A: 100 hosts</li>
  <li>LAN B: 50 hosts</li>
  <li>LAN C: 20 hosts</li>
  <li>WAN link: 2 hosts</li>
</ul>
<p>Solution using VLSM:</p>
<table>
  <tr><th>Subnet</th><th>Prefix</th><th>Range</th></tr>
  <tr><td>LAN A</td><td>/25 (255.255.255.128)</td><td>192.168.20.0 &ndash; 192.168.20.127</td></tr>
  <tr><td>LAN B</td><td>/26 (255.255.255.192)</td><td>192.168.20.128 &ndash; 192.168.20.191</td></tr>
  <tr><td>LAN C</td><td>/27 (255.255.255.224)</td><td>192.168.20.192 &ndash; 192.168.20.223</td></tr>
  <tr><td>WAN link</td><td>/30 (255.255.255.252)</td><td>192.168.20.224 &ndash; 192.168.20.227</td></tr>
</table>

<h2>11.8 VLSM</h2>
<h3>11.8.1&ndash;11.8.4 VLSM Basics and Example</h3>
<p><strong>VLSM (Variable Length Subnet Masking)</strong> lets you use different prefix lengths within the same address block, allocating exactly what each subnet needs.</p>
<p>Key rules:</p>
<ol>
  <li>Always allocate the <strong>largest requirement first</strong>.</li>
  <li>Subnets do not need to be equal size.</li>
  <li>Use /30 for point-to-point WAN links (2 usable hosts).</li>
  <li>Use /31 for point-to-point if supported (RFC 3021) &mdash; but CCNA typically uses /30.</li>
</ol>

<h3>11.8.5 VLSM Topology Address Assignment Example</h3>
<p>Given <code>172.16.0.0/22</code> (four /24s), you might assign:</p>
<ul>
  <li>LAN with 500 hosts: /23 (510 hosts)</li>
  <li>LAN with 200 hosts: /24 (254 hosts)</li>
  <li>LAN with 100 hosts: /25 (126 hosts)</li>
  <li>WAN link: /30</li>
</ul>

<h2>11.9 Structured Design</h2>
<h3>11.9.1 IPv4 Network Address Planning</h3>
<p>Plan IP addressing on paper before configuring devices. Consider:</p>
<ul>
  <li>How many subnets are needed now and in the future?</li>
  <li>How many hosts per subnet?</li>
  <li>Which subnets need growth room?</li>
  <li>Where will DHCP be used vs static addressing?</li>
  <li>How will routing summarise the address space?</li>
</ul>

<h3>11.9.2 Device Address Assignment</h3>
<table>
  <tr><th>Device</th><th>Recommended method</th></tr>
  <tr><td>Routers</td><td>Static</td></tr>
  <tr><td>Servers</td><td>Static</td></tr>
  <tr><td>Switches</td><td>Static (SVI)</td></tr>
  <tr><td>Printers</td><td>Static or DHCP reservation</td></tr>
  <tr><td>Workstations</td><td>DHCP</td></tr>
  <tr><td>IP phones</td><td>DHCP with option 150 (TFTP)</td></tr>
  <tr><td>Wireless clients</td><td>DHCP</td></tr>
</table>

<h3>Useful subnetting commands</h3>
<pre class="cli"><span class="cmt">! Verify the interface IP and mask:</span>
R1# <span class="prompt">show ip interface brief</span>
R1# <span class="prompt">show ip interface g0/0/0</span>

<span class="cmt">! Show the routing table (see connected subnets):</span>
R1# <span class="prompt">show ip route</span>

<span class="cmt">! Show a specific subnet's routes:</span>
R1# <span class="prompt">show ip route 192.168.1.0</span></pre>

<h2>12.1 IPv4 Issues</h2>
<h3>12.1.1 Need for IPv6</h3>
<ul>
  <li><strong>Address exhaustion</strong> &mdash; IPv4 provides about 4.3 billion addresses; these are depleted.</li>
  <li><strong>Internet routing table growth</strong> &mdash; more networks than the design anticipated.</li>
  <li><strong>NAT</strong> &mdash; broke end-to-end connectivity and added complexity.</li>
  <li><strong>No built-in security</strong> &mdash; IPsec was added later but not universally supported.</li>
  <li><strong>Limited QoS</strong> &mdash; no built-in flow identification.</li>
</ul>

<h3>12.1.2 IPv4 and IPv6 Coexistence</h3>
<p>Three coexistence strategies during migration:</p>
<table>
  <tr><th>Strategy</th><th>Description</th></tr>
  <tr><td><strong>Dual stack</strong></td><td>Devices run IPv4 and IPv6 simultaneously; each interface has both addresses</td></tr>
  <tr><td><strong>Tunnelling</strong></td><td>IPv6 packets encapsulated inside IPv4 packets (or vice versa) to cross a network that only supports one protocol</td></tr>
  <tr><td><strong>Translation (NAT64)</strong></td><td>Translates between IPv4 and IPv6 for communication between the two</td></tr>
</table>

<h2>12.2 IPv6 Address Representation</h2>
<h3>12.2.1 IPv6 Addressing Formats</h3>
<p>An IPv6 address is 128 bits, written as <strong>eight groups of four hexadecimal digits</strong> separated by colons:</p>
<pre class="cli">2001:0db8:0000:0000:0000:0000:0000:0001</pre>

<h3>12.2.2 Rule 1 &mdash; Omit Leading Zeros</h3>
<p>Drop leading zeros within each group:</p>
<pre class="cli">2001:0db8:0000:0000:0000:0000:0000:0001
becomes
2001:db8:0:0:0:0:0:1</pre>

<h3>12.2.3 Rule 2 &mdash; Double Colon</h3>
<p>Replace a <strong>single consecutive run</strong> of all-zero groups with <code>::</code>. Can be used only <strong>once</strong> per address.</p>
<pre class="cli">2001:db8:0:0:0:0:0:1
becomes
2001:db8::1

ff02:0:0:0:0:0:0:1
becomes
ff02::1</pre>

<h2>12.3 IPv6 Address Types</h2>
<h3>12.3.1 Unicast, Multicast, Anycast</h3>
<table>
  <tr><th>Type</th><th>Description</th></tr>
  <tr><td>Unicast</td><td>One-to-one &mdash; identifies a single interface</td></tr>
  <tr><td>Multicast</td><td>One-to-many &mdash; reaches all members of a group</td></tr>
  <tr><td>Anycast</td><td>One-to-nearest &mdash; reaches the closest member of a group</td></tr>
</table>
<p>IPv6 has <strong>no broadcast</strong>.</p>

<h3>12.3.2 IPv6 Prefix Length</h3>
<p>The prefix length indicates the network portion. Most IPv6 subnets use <code>/64</code> &mdash; the host portion is the last 64 bits.</p>

<h3>12.3.3 Types of IPv6 Unicast Addresses</h3>
<table>
  <tr><th>Type</th><th>Prefix</th><th>Description</th></tr>
  <tr><td>Global Unicast (GUA)</td><td>2000::/3</td><td>Internet-routable, like public IPv4</td></tr>
  <tr><td>Link-Local (LLA)</td><td>FE80::/10</td><td>Automatic, local link only, used for ND and next-hop</td></tr>
  <tr><td>Unique Local (ULA)</td><td>FC00::/7</td><td>Private addressing within an organisation</td></tr>
  <tr><td>Loopback</td><td>::1/128</td><td>Equivalent of 127.0.0.1</td></tr>
  <tr><td>Unspecified</td><td>::/128</td><td>Used as a source when no address is assigned yet</td></tr>
</table>

<h3>12.3.5 IPv6 GUA</h3>
<p>Global Unicast Addresses are the equivalent of public IPv4 addresses. Currently allocated from <code>2001::/3</code>.</p>

<h3>12.3.6 IPv6 GUA Structure</h3>
<pre class="cli">|  Global Routing Prefix  | Subnet ID |     Interface ID      |
|        48 bits          |  16 bits  |       64 bits         |
|         /48             |   /64     |</pre>
<p>The /48 global routing prefix is assigned to organisations. The /16 subnet ID lets the organisation create up to 65,536 subnets. The 64-bit Interface ID identifies the host within the subnet.</p>

<h3>12.3.7 IPv6 LLA</h3>
<p>A Link-Local Address is automatically generated on every IPv6-enabled interface. It starts with <code>FE80::/10</code>. It is used for:</p>
<ul>
  <li>Neighbor Discovery</li>
  <li>Next-hop addresses in IPv6 routing protocols</li>
  <li>Communication on the local link only (never routed)</li>
</ul>
<p>Cisco routers automatically generate an LLA using the EUI-64 format. You can override it with a manually configured LLA:</p>
<pre class="cli">Router(config-if)# <span class="prompt">ipv6 address fe80::1 link-local</span></pre>

<h2>12.4 Static GUA and LLA Configuration</h2>
<h3>12.4.1 Static GUA Configuration on a Router</h3>
<pre class="cli">Router(config)# <span class="prompt">ipv6 unicast-routing</span>
Router(config)# <span class="prompt">interface g0/0/0</span>
Router(config-if)# <span class="prompt">ipv6 address 2001:db8:acad:1::1/64</span>
Router(config-if)# <span class="prompt">ipv6 address fe80::1 link-local</span>
Router(config-if)# <span class="prompt">no shutdown</span>
Router(config-if)# <span class="prompt">exit</span>

<span class="cmt">! Verify:</span>
Router# <span class="prompt">show ipv6 interface brief</span>
Router# <span class="prompt">show ipv6 interface g0/0/0</span>
Router# <span class="prompt">show ipv6 route</span></pre>

<h3>12.4.2 Static GUA Configuration on a Windows Host</h3>
<p>In the network adapter properties:</p>
<ul>
  <li>IPv6 address: <code>2001:db8:acad:1::10</code></li>
  <li>Subnet prefix length: <code>64</code></li>
  <li>Default gateway: <code>2001:db8:acad:1::1</code> (or the LLA of the router)</li>
  <li>DNS: IPv6 address of the DNS server</li>
</ul>

<h3>12.4.3 Static Configuration of a Link-Local Unicast Address</h3>
<pre class="cli">Router(config-if)# <span class="prompt">ipv6 address fe80::1 link-local</span></pre>
<p>Link-local addresses are usually auto-generated, but a manual LLA is easier to remember and use as a next-hop in routing.</p>

<h2>12.5 Dynamic Addressing for IPv6 GUAs</h2>
<h3>12.5.1 RS and RA Messages</h3>
<p>Routers periodically send <strong>Router Advertisements (RA)</strong> and respond to <strong>Router Solicitations (RS)</strong> sent by hosts. RAs carry the prefix, prefix length, default gateway and flags indicating how hosts should obtain their IPv6 addresses.</p>

<h3>12.5.2 Method 1 &mdash; SLAAC</h3>
<p><strong>Stateless Address Autoconfiguration</strong> &mdash; the host builds its own IPv6 address using the RA prefix and a self-generated Interface ID. No server is needed. The host also self-configures its default gateway.</p>
<p>RA flags: <code>A=1</code> (autonomous) and <code>O=0</code> (no other config).</p>

<h3>12.5.3 Method 2 &mdash; SLAAC and Stateless DHCPv6</h3>
<p>The host uses SLAAC for its address but contacts a DHCPv6 server (stateless) for other information such as DNS servers.</p>
<p>RA flags: <code>A=1</code> and <code>O=1</code>.</p>

<h3>12.5.4 Method 3 &mdash; Stateful DHCPv6</h3>
<p>The DHCPv6 server provides the full address and all options. The host uses the RA for the default gateway and requests its address from DHCPv6.</p>
<p>RA flag: <code>M=1</code> (managed).</p>

<h3>12.5.5 EUI-64 Process vs Randomly Generated</h3>
<p>Two methods to generate the Interface ID:</p>
<ul>
  <li><strong>EUI-64</strong> &mdash; derived from the MAC address. Split the MAC in half, insert <code>FFFE</code> in the middle, and flip the 7th bit (universal/local bit). Predictable but exposes the MAC.</li>
  <li><strong>Randomly generated</strong> &mdash; modern operating systems generate a random Interface ID for privacy. Cannot be reverse-engineered to find the MAC.</li>
</ul>

<h3>EUI-64 example</h3>
<pre class="cli">MAC:    00:1A:2B:3C:4D:5E
Split:  00:1A:2B  |  3C:4D:5E
Insert FFFE:  00:1A:2B:FF:FE:3C:4D:5E
Flip 7th bit of first byte (00 -> 02):  02:1A:2B:FF:FE:3C:4D:5E
Interface ID: 021a:2bff:fe3c:4d5e
Full address with prefix 2001:db8:acad:1::/64:
2001:db8:acad:1:021a:2bff:fe3c:4d5e</pre>

<h3>Configure EUI-64 on a Cisco interface</h3>
<pre class="cli">Router(config-if)# <span class="prompt">ipv6 address 2001:db8:acad:1::/64 eui-64</span></pre>

<h2>12.6 Dynamic Addressing for IPv6 LLAs</h2>
<h3>12.6.1 Dynamic LLAs</h3>
<p>Every IPv6-enabled interface generates an LLA automatically using EUI-64 or a random value. Cisco IOS uses EUI-64 by default.</p>

<h3>12.6.2&ndash;12.6.3 Dynamic LLAs on Windows and Cisco Routers</h3>
<pre class="cli"><span class="cmt">! Windows:</span>
C:\\&gt; <span class="prompt">ipconfig /all</span>
C:\\&gt; <span class="prompt">netsh interface ipv6 show address</span>

<span class="cmt">! Cisco:</span>
Router# <span class="prompt">show ipv6 interface brief</span>
Router# <span class="prompt">show ipv6 interface g0/0/0</span></pre>

<h3>12.6.4 Verify IPv6 Address Configuration</h3>
<pre class="cli">Router# <span class="prompt">show ipv6 interface brief</span>
GigabitEthernet0/0/0   [up/up]
    FE80::1
    2001:DB8:ACAD:1::1
GigabitEthernet0/0/1   [up/up]
    FE80::2
    2001:DB8:ACAD:2::1

<span class="cmt">! Detailed info:</span>
Router# <span class="prompt">show ipv6 interface g0/0/0</span>

<span class="cmt">! IPv6 routing table:</span>
Router# <span class="prompt">show ipv6 route</span>

<span class="cmt">! Enable IPv6 routing if not already enabled:</span>
Router(config)# <span class="prompt">ipv6 unicast-routing</span></pre>

<h2>12.7 IPv6 Multicast Addresses</h2>
<h3>12.7.1&ndash;12.7.2 Assigned and Well-Known Multicast Addresses</h3>
<p>Multicast addresses begin with <code>FF00::/8</code>. The second byte defines the scope:</p>
<table>
  <tr><th>Scope</th><th>Value</th></tr>
  <tr><td>Interface-local</td><td>1</td></tr>
  <tr><td>Link-local</td><td>2</td></tr>
  <tr><td>Site-local</td><td>5</td></tr>
  <tr><td>Global</td><td>E</td></tr>
</table>
<p>Well-known addresses:</p>
<table>
  <tr><th>Address</th><th>Purpose</th></tr>
  <tr><td>FF02::1</td><td>All nodes on the local link</td></tr>
  <tr><td>FF02::2</td><td>All routers on the local link</td></tr>
  <tr><td>FF02::5 / FF02::6</td><td>OSPFv3 (all SPF / DR routers)</td></tr>
  <tr><td>FF02::A</td><td>EIGRPv6</td></tr>
  <tr><td>FF02::1:FF00:0/104</td><td>Solicited-node multicast</td></tr>
</table>

<h3>12.7.3 Solicited-Node IPv6 Multicast Addresses</h3>
<p>Every unicast and anycast IPv6 address has a corresponding solicited-node multicast address. Format: <code>FF02::1:FFxx:xxxx</code>, where the last 24 bits are taken from the unicast address.</p>
<p>Example: <code>2001:db8:acad:1::10</code> has solicited-node multicast <code>FF02::1:FF00:0010</code>.</p>

<h2>12.8 Subnet an IPv6 Network</h2>
<h3>12.8.1 Subnet Using the Subnet ID</h3>
<p>IPv6 subnetting uses the <strong>Subnet ID</strong> field, typically 16 bits wide (between a /48 and a /64). This lets an organisation create 65,536 subnets from a single /48.</p>

<h3>12.8.2 IPv6 Subnetting Example</h3>
<p>Given <code>2001:db8:acad::/48</code>, subnet into /64 subnets:</p>
<table>
  <tr><th>Subnet ID</th><th>Prefix</th></tr>
  <tr><td>0000</td><td>2001:db8:acad:0::/64</td></tr>
  <tr><td>0001</td><td>2001:db8:acad:1::/64</td></tr>
  <tr><td>0002</td><td>2001:db8:acad:2::/64</td></tr>
  <tr><td>...</td><td>...</td></tr>
  <tr><td>FFFF</td><td>2001:db8:acad:ffff::/64</td></tr>
</table>

<h3>12.8.3 IPv6 Subnet Allocation</h3>
<p>Common /64 subnet allocations:</p>
<ul>
  <li>2001:db8:acad:1::/64 &mdash; LAN A</li>
  <li>2001:db8:acad:2::/64 &mdash; LAN B</li>
  <li>2001:db8:acad:3::/64 &mdash; LAN C</li>
  <li>2001:db8:acad:4::/64 &mdash; Server farm</li>
</ul>
<p>WAN links can use /64, /126 (like a /30 in IPv4) or /127 for point-to-point.</p>

<h3>12.8.4 Router Configured with IPv6 Subnets</h3>
<pre class="cli">R1(config)# <span class="prompt">ipv6 unicast-routing</span>

R1(config)# <span class="prompt">interface g0/0/0</span>
R1(config-if)# <span class="prompt">description LAN-A</span>
R1(config-if)# <span class="prompt">ipv6 address 2001:db8:acad:1::1/64</span>
R1(config-if)# <span class="prompt">ipv6 address fe80::1 link-local</span>
R1(config-if)# <span class="prompt">no shutdown</span>
R1(config-if)# <span class="prompt">exit</span>

R1(config)# <span class="prompt">interface g0/0/1</span>
R1(config-if)# <span class="prompt">description LAN-B</span>
R1(config-if)# <span class="prompt">ipv6 address 2001:db8:acad:2::1/64</span>
R1(config-if)# <span class="prompt">ipv6 address fe80::1 link-local</span>
R1(config-if)# <span class="prompt">no shutdown</span>
R1(config-if)# <span class="prompt">end</span>

<span class="cmt">! Verify:</span>
R1# <span class="prompt">show ipv6 interface brief</span>
R1# <span class="prompt">show ipv6 route</span>

<span class="cmt">! Test connectivity:</span>
R1# <span class="prompt">ping 2001:db8:acad:2::1</span>
R1# <span class="prompt">ping ipv6 2001:db8:acad:2::1</span>
R1# <span class="prompt">traceroute ipv6 2001:db8:acad:ffff::1</span></pre>

<h2>13.1 ICMP Messages</h2>
<h3>13.1.1 ICMPv4 and ICMPv6 Messages</h3>
<p><strong>ICMP (Internet Control Message Protocol)</strong> is a Layer 3 protocol used by network devices to send error and informational messages. It does not carry user data.</p>
<ul>
  <li><strong>ICMPv4</strong> &mdash; used with IPv4. Defined in RFC 792.</li>
  <li><strong>ICMPv6</strong> &mdash; used with IPv6. Defined in RFC 4443. Includes Neighbor Discovery and Router Advertisement messages that IPv6 depends on.</li>
</ul>
<p>ICMP is encapsulated directly inside IP. That means it has no TCP or UDP header, and therefore no port numbers.</p>

<h3>13.1.2 Host Reachability</h3>
<p>The most common ICMP message is <strong>Echo Request / Echo Reply</strong>, used by the <code>ping</code> command to test whether a host is reachable.</p>
<ul>
  <li>The sender sends an <strong>ICMP Echo Request</strong>.</li>
  <li>The receiver replies with an <strong>ICMP Echo Reply</strong>.</li>
  <li>If no reply arrives, the host is unreachable, blocked, or slow.</li>
</ul>

<h3>13.1.3 Destination or Service Unreachable</h3>
<p>When a router or host cannot deliver a packet, it sends an ICMP <strong>Destination Unreachable</strong> message back to the source. Common codes:</p>
<table>
  <tr><th>Code</th><th>Meaning</th></tr>
  <tr><td>0</td><td>Network unreachable &mdash; no route to the destination network</td></tr>
  <tr><td>1</td><td>Host unreachable &mdash; the network exists but the host does not respond</td></tr>
  <tr><td>2</td><td>Protocol unreachable &mdash; the protocol is not supported</td></tr>
  <tr><td>3</td><td>Port unreachable &mdash; no service listening on that port (common with UDP)</td></tr>
  <tr><td>4</td><td>Fragmentation needed but DF bit set &mdash; path MTU issue</td></tr>
</table>

<h3>13.1.4 Time Exceeded</h3>
<p>Every IP packet has a <strong>TTL (Time To Live)</strong> field that is decremented by one at every router. If TTL reaches zero, the router drops the packet and sends an ICMP <strong>Time Exceeded</strong> message back to the source.</p>
<p>This mechanism:</p>
<ul>
  <li>Prevents packets looping forever.</li>
  <li>Powers the <code>traceroute</code> command (each hop returns a Time Exceeded message).</li>
</ul>

<h3>13.1.5 ICMPv6 Messages</h3>
<p>ICMPv6 includes all the ICMPv4 message types plus IPv6-specific ones:</p>
<table>
  <tr><th>Message</th><th>Purpose</th></tr>
  <tr><td>Echo Request / Echo Reply</td><td>Ping (same as IPv4)</td></tr>
  <tr><td>Destination Unreachable</td><td>Same as IPv4</td></tr>
  <tr><td>Packet Too Big</td><td>Fragmentation is not done by IPv6 routers, so this replaces the "fragmentation needed" message</td></tr>
  <tr><td>Time Exceeded</td><td>Same as IPv4</td></tr>
  <tr><td>Router Solicitation (RS)</td><td>Host asks for router info</td></tr>
  <tr><td>Router Advertisement (RA)</td><td>Router announces prefix and options</td></tr>
  <tr><td>Neighbor Solicitation (NS)</td><td>Address resolution (like ARP)</td></tr>
  <tr><td>Neighbor Advertisement (NA)</td><td>Address resolution reply</td></tr>
  <tr><td>Redirect</td><td>Router tells host a better next-hop</td></tr>
</table>
<div class="callout blue"><b>Key CCNA point</b>IPv6 relies on ICMPv6 for its core operation (ND, SLAAC, address resolution). Blocking ICMPv6 breaks IPv6. Blocking ICMPv4 is common practice but should be done selectively.</div>

<h2>13.2 Ping and Traceroute Tests</h2>
<h3>13.2.1 Ping &mdash; Test Connectivity</h3>
<p><code>ping</code> sends ICMP Echo Requests and measures the round-trip time. It confirms:</p>
<ul>
  <li>Layer 3 reachability</li>
  <li>Round-trip latency</li>
  <li>Packet loss</li>
</ul>
<pre class="cli"><span class="cmt">! Windows:</span>
C:\\&gt; <span class="prompt">ping 8.8.8.8</span>
C:\\&gt; <span class="prompt">ping -n 10 8.8.8.8</span>          <span class="cmt">! Send 10 pings</span>
C:\\&gt; <span class="prompt">ping -t 8.8.8.8</span>              <span class="cmt">! Continuous ping (Ctrl+C to stop)</span>
C:\\&gt; <span class="prompt">ping -l 1500 8.8.8.8</span>         <span class="cmt">! Set packet size</span>

<span class="cmt">! Linux / macOS:</span>
$ <span class="prompt">ping -c 10 8.8.8.8</span>
$ <span class="prompt">ping -s 1500 8.8.8.8</span>

<span class="cmt">! Cisco IOS:</span>
Router# <span class="prompt">ping 8.8.8.8</span>
Router# <span class="prompt">ping ip 8.8.8.8 source g0/0/0</span>
Router# <span class="prompt">ping ipv6 2001:db8:acad:1::1</span>
Router# <span class="prompt">ping</span>
Protocol [ip]:
Target IP address: <span class="prompt">8.8.8.8</span>
Repeat count [5]: <span class="prompt">10</span>
Datagram size [100]:
Timeout in seconds [2]:
Extended commands [n]:
Sweep range of sizes [n]:</pre>

<h3>13.2.2 Ping the Loopback</h3>
<p>Pinging the loopback address (<code>127.0.0.1</code> for IPv4, <code>::1</code> for IPv6) tests whether the host's own TCP/IP stack is working. If this fails, the problem is local to the host.</p>
<pre class="cli">C:\\&gt; <span class="prompt">ping 127.0.0.1</span>
Router# <span class="prompt">ping 127.0.0.1</span>
Router# <span class="prompt">ping ipv6 ::1</span></pre>

<h3>13.2.3 Ping the Default Gateway</h3>
<p>Pinging the default gateway tests connectivity from the host to the local router. If this fails, the issue is on the local network (cable, switch, VLAN, IP config).</p>

<h3>13.2.4 Ping a Remote Host</h3>
<p>Pinging a remote host tests end-to-end connectivity and routing across the internet.</p>
<p>A logical ping sequence:</p>
<ol>
  <li><code>ping 127.0.0.1</code> &mdash; TCP/IP stack works</li>
  <li><code>ping</code> own IP &mdash; NIC works</li>
  <li><code>ping</code> default gateway &mdash; local network works</li>
  <li><code>ping 8.8.8.8</code> &mdash; internet routing works</li>
  <li><code>ping www.example.com</code> &mdash; DNS works</li>
</ol>

<h3>13.2.5 Traceroute &mdash; Test the Path</h3>
<p><code>traceroute</code> (or <code>tracert</code> on Windows) shows each router (hop) along the path to a destination. It works by sending packets with progressively increasing TTL values, forcing each router in turn to return an ICMP Time Exceeded message.</p>
<pre class="cli"><span class="cmt">! Windows:</span>
C:\\&gt; <span class="prompt">tracert 8.8.8.8</span>
C:\\&gt; <span class="prompt">tracert -d 8.8.8.8</span>           <span class="cmt">! Do not resolve names</span>

<span class="cmt">! Linux / macOS:</span>
$ <span class="prompt">traceroute 8.8.8.8</span>
$ <span class="prompt">traceroute -n 8.8.8.8</span>

<span class="cmt">! Cisco IOS:</span>
Router# <span class="prompt">traceroute 8.8.8.8</span>

title:'Module 14: Transport Layer',
sub:'TCP and UDP overviews · headers · port numbers · three-way handshake · reliability and flow control',
content:`
<h2>14.1 Transportation of Data</h2>
<h3>14.1.1&ndash;14.1.2 Role and Responsibilities</h3>
<p>The <strong>Transport layer (Layer 4)</strong> is responsible for:</p>
<ul>
  <li><strong>Tracking individual conversations</strong> &mdash; keeping separate streams of data apart.</li>
  <li><strong>Segmenting data</strong> &mdash; dividing application data into segments.</li>
  <li><strong>Reassembling segments</strong> &mdash; putting them back in order at the destination.</li>
  <li><strong>Identifying applications</strong> &mdash; using port numbers to identify which application gets the data.</li>
  <li><strong>Multiplexing</strong> &mdash; many applications can share the same network connection.</li>
</ul>

<h3>14.1.3 Transport Layer Protocols</h3>
<table>
  <tr><th>Protocol</th><th>Characteristic</th></tr>
  <tr><td>TCP</td><td>Connection-oriented, reliable, ordered delivery</td></tr>
  <tr><td>UDP</td><td>Connectionless, best-effort, low overhead</td></tr>
</table>

<h3>14.1.4 Transmission Control Protocol (TCP)</h3>
<p>TCP provides:</p>
<ul>
  <li><strong>Reliable delivery</strong> &mdash; lost data is retransmitted.</li>
  <li><strong>Ordered delivery</strong> &mdash; segments are reassembled in the correct order.</li>
  <li><strong>Error checking</strong> &mdash; uses checksums.</li>
  <li><strong>Flow control</strong> &mdash; the receiver tells the sender how much data it can accept.</li>
  <li><strong>Congestion control</strong> &mdash; reduces sending rate when the network is congested.</li>
  <li><strong>Connection setup and teardown</strong> &mdash; three-way handshake and four-way close.</li>
</ul>

<h3>14.1.5 User Datagram Protocol (UDP)</h3>
<p>UDP provides:</p>
<ul>
  <li><strong>Best-effort delivery</strong> &mdash; no retransmission.</li>
  <li><strong>Unordered delivery</strong> &mdash; segments may arrive out of order.</li>
  <li><strong>Low overhead</strong> &mdash; only 8-byte header.</li>
  <li><strong>No flow or congestion control</strong> &mdash; sends as fast as needed.</li>
</ul>

<h3>14.1.6 The Right Transport Layer Protocol for the Right Application</h3>
<table>
  <tr><th>Use TCP</th><th>Use UDP</th></tr>
  <tr><td>Web (HTTP/HTTPS)</td><td>DNS</td></tr>
  <tr><td>Email (SMTP, POP3, IMAP)</td><td>DHCP</td></tr>
  <tr><td>File transfer (FTP, SFTP)</td><td>TFTP</td></tr>
  <tr><td>Remote access (Telnet, SSH)</td><td>VoIP (RTP)</td></tr>
  <tr><td>Any transfer that must be complete and ordered</td><td>Streaming video, online gaming, live voice</td></tr>
</table>

<h2>14.2 TCP Overview</h2>
<h3>14.2.1&ndash;14.2.3 TCP Features and Header</h3>
<p>TCP header is <strong>20 bytes</strong> minimum (up to 60 with options).</p>
<table>
  <tr><th>Field</th><th>Purpose</th></tr>
  <tr><td>Source Port</td><td>Sender's port</td></tr>
  <tr><td>Destination Port</td><td>Receiver's port</td></tr>
  <tr><td>Sequence Number</td><td>Order of segments; used for reassembly</td></tr>
  <tr><td>Acknowledgement Number</td><td>Confirms received data</td></tr>
  <tr><td>Header Length</td><td>Length of the TCP header</td></tr>
  <tr><td>Control Bits (Flags)</td><td>SYN, ACK, FIN, RST, PSH, URG</td></tr>
  <tr><td>Window Size</td><td>How much data the receiver can accept</td></tr>
  <tr><td>Checksum</td><td>Error detection</td></tr>
  <tr><td>Urgent Pointer</td><td>Marks urgent data</td></tr>
</table>

<h3>TCP flags</h3>
<table>
  <tr><th>Flag</th><th>Meaning</th></tr>
  <tr><td>SYN</td><td>Synchronise &mdash; start connection</td></tr>
  <tr><td>ACK</td><td>Acknowledge &mdash; confirm receipt</td></tr>
  <tr><td>FIN</td><td>Finish &mdash; graceful close</td></tr>
  <tr><td>RST</td><td>Reset &mdash; abrupt close</td></tr>
  <tr><td>PSH</td><td>Push &mdash; pass to application immediately</td></tr>
  <tr><td>URG</td><td>Urgent &mdash; urgent pointer is valid</td></tr>
</table>

<h3>14.2.4 Applications that Use TCP</h3>
<table>
  <tr><th>Application</th><th>Port</th></tr>
  <tr><td>FTP (data / control)</td><td>20 / 21</td></tr>
  <tr><td>SSH</td><td>22</td></tr>
  <tr><td>Telnet</td><td>23</td></tr>
  <tr><td>SMTP</td><td>25</td></tr>
  <tr><td>HTTP</td><td>80</td></tr>
  <tr><td>POP3</td><td>110</td></tr>
  <tr><td>IMAP</td><td>143</td></tr>
  <tr><td>HTTPS</td><td>443</td></tr>
  <tr><td>SMB</td><td>445</td></tr>
  <tr><td>RDP</td><td>3389</td></tr>
</table>

<h2>14.3 UDP Overview</h2>
<h3>14.3.1&ndash;14.3.3 UDP Features and Header</h3>
<p>UDP header is only <strong>8 bytes</strong>.</p>
<table>
  <tr><th>Field</th><th>Size</th><th>Purpose</th></tr>
  <tr><td>Source Port</td><td>2 bytes</td><td>Sender's port</td></tr>
  <tr><td>Destination Port</td><td>2 bytes</td><td>Receiver's port</td></tr>
  <tr><td>Length</td><td>2 bytes</td><td>Total length of UDP datagram</td></tr>
  <tr><td>Checksum</td><td>2 bytes</td><td>Error detection (optional)</td></tr>
</table>
<p>UDP has no sequence numbers, no acknowledgements and no window size.</p>

<h3>14.3.4 Applications that Use UDP</h3>
<table>
  <tr><th>Application</th><th>Port</th></tr>
  <tr><td>DHCP (server / client)</td><td>67 / 68</td></tr>
  <tr><td>TFTP</td><td>69</td></tr>
  <tr><td>DNS</td><td>53 (also TCP for large)</td></tr>
  <tr><td>SNMP</td><td>161</td></tr>
  <tr><td>SNMP trap</td><td>162</td></tr>
  <tr><td>NTP</td><td>123</td></tr>
  <tr><td>SIP</td><td>5060</td></tr>
  <tr><td>RTP</td><td>Dynamic</td></tr>
</table>

<h2>14.4 Port Numbers</h2>
<h3>14.4.1 Multiple Separate Communications</h3>
<p>The source port is dynamically chosen by the client (usually from the range 49152&ndash;65535) and identifies the local application. The destination port is the well-known port of the service being accessed. The combination lets a single host keep many conversations apart.</p>

<h3>14.4.2 Socket Pairs</h3>
<p>A <strong>socket</strong> is a source or destination IP + port. A <strong>socket pair</strong> uniquely identifies a conversation:</p>
<pre class="cli">Source IP:port         Destination IP:port
192.168.1.10:51234  <->  93.184.216.34:443</pre>

<h3>14.4.3 Port Number Groups</h3>
<table>
  <tr><th>Range</th><th>Name</th><th>Use</th></tr>
  <tr><td>0&ndash;1023</td><td>Well-known</td><td>Standard services (HTTP, DNS, SSH)</td></tr>
  <tr><td>1024&ndash;49151</td><td>Registered</td><td>Vendor / application specific</td></tr>
  <tr><td>49152&ndash;65535</td><td>Dynamic / private</td><td>Ephemeral client source ports</td></tr>
</table>

<h3>14.4.4 The netstat Command</h3>
<pre class="cli"><span class="cmt">! Windows:</span>
C:\\&gt; <span class="prompt">netstat -a</span>            <span class="cmt">! All connections</span>
C:\\&gt; <span class="prompt">netstat -n</span>            <span class="cmt">! Show addresses numerically</span>
C:\\&gt; <span class="prompt">netstat -an</span>           <span class="cmt">! All connections numerically</span>
C:\\&gt; <span class="prompt">netstat -ano</span>          <span class="cmt">! Include process IDs</span>
C:\\&gt; <span class="prompt">netstat -b</span>            <span class="cmt">! Include executable name (admin)</span>

<span class="cmt">! Linux:</span>
$ <span class="prompt">netstat -tuln</span>         <span class="cmt">! Listening TCP/UDP ports</span>
$ <span class="prompt">ss -tuln</span>              <span class="cmt">! Modern replacement</span>

<span class="cmt">! Cisco IOS:</span>
Router# <span class="prompt">show control-plane host open-ports</span>
Router# <span class="prompt">show ip sockets</span></pre>

<h2>14.5 TCP Communication Process</h2>
<h3>14.5.1 TCP Server Processes</h3>
<p>A TCP server listens on a specific port. When a client connects, the server establishes a session (often a separate child process or thread per connection) to serve that client.</p>

<h3>14.5.2 TCP Connection Establishment &mdash; The Three-Way Handshake</h3>
<pre class="cli">Client                                    Server
  |----- SYN (seq=x) ------------------->  |
  |                                        |
  |<---- SYN-ACK (seq=y, ack=x+1) --------  |
  |                                        |
  |----- ACK (ack=y+1) ----------------->  |
  |                                        |
  |========= Connection Established =======|</pre>
<ol>
  <li><strong>SYN</strong> &mdash; client sends a SYN segment with an initial sequence number.</li>
  <li><strong>SYN-ACK</strong> &mdash; server acknowledges and sends its own initial sequence number.</li>
  <li><strong>ACK</strong> &mdash; client acknowledges the server. Connection established.</li>
</ol>

<h3>14.5.3 Session Termination &mdash; Four-Way Close</h3>
<pre class="cli">Client                                    Server
  |----- FIN --------------------------->  |
  |<---- ACK ------------------------------ |
  |<---- FIN ------------------------------ |
  |----- ACK --------------------------->  |
  |                                        |
  |========= Connection Closed ============|</pre>
<p>Sometimes closed with just FIN, ACK, FIN, ACK. A connection can also be reset abruptly with RST.</p>

<h2>14.6 Reliability and Flow Control</h2>
<h3>14.6.1 TCP Reliability &mdash; Guaranteed and Ordered Delivery</h3>
<p>TCP guarantees that data arrives intact and in order by using:</p>
<ul>
  <li><strong>Sequence numbers</strong> &mdash; each segment is numbered.</li>
  <li><strong>Acknowledgements (ACKs)</strong> &mdash; the receiver confirms what it received.</li>
  <li><strong>Retransmission</strong> &mdash; if an ACK is not received within a timeout, the segment is resent.</li>
  <li><strong>Reassembly</strong> &mdash; the receiver reorders segments by sequence number.</li>
</ul>

<h3>14.6.5 TCP Flow Control &mdash; Window Size</h3>
<p>The <strong>window size</strong> is how much data the receiver can accept before it needs an acknowledgement. If the receiver is slow, it advertises a smaller window. A window of 0 tells the sender to stop sending until further notice (zero-window).</p>

<h3>14.6.6 TCP Flow Control &mdash; Maximum Segment Size (MSS)</h3>
<p><strong>MSS</strong> is the largest amount of data (in bytes) TCP will send in one segment, negotiated during the handshake. It is typically MTU &minus; 40 bytes (20 IP header + 20 TCP header). For a 1500-byte MTU, MSS is usually 1460 bytes.</p>

<h3>14.6.7 TCP Flow Control &mdash; Congestion Avoidance</h3>
<p>TCP reduces its sending rate when the network is congested. Common algorithms:</p>
<ul>
  <li><strong>Slow start</strong> &mdash; the sender begins small and grows the window quickly.</li>
  <li><strong>Congestion avoidance</strong> &mdash; grows the window more slowly once a threshold is reached.</li>
  <li><strong>Fast retransmit / fast recovery</strong> &mdash; recovers quickly after a lost segment.</li>
</ul>

<h2>14.7 UDP Communication</h2>
<h3>14.7.1 UDP Low Overhead versus Reliability</h3>
<p>UDP has no setup, no acknowledgements and no retransmission. This makes it ideal for applications where speed matters more than perfect delivery, and where the application itself handles reliability if needed.</p>

<h3>14.7.2 UDP Datagram Reassembly</h3>
<p>UDP does not resequence. Segments may arrive out of order. The application must handle reassembly if ordering matters. DNS and DHCP are simple request/response protocols that do not need ordering.</p>

<h3>14.7.3&ndash;14.7.4 UDP Server and Client Processes</h3>
<p>UDP servers listen on a well-known port. Clients send a single datagram and expect a single reply. There is no persistent session &mdash; a request followed by a reply, then the transaction is complete.</p>

<div class="callout green"><b>CCNA exam tip</b>Memorise the well-known port numbers. Know the flags in the TCP header (SYN, ACK, FIN, RST). Be able to describe the three-way handshake and the four-way close.</div>

<h2>15.1 Application, Presentation, and Session</h2>
<h3>15.1.1 Application Layer</h3>
<p>The <strong>Application layer (Layer 7)</strong> is the closest to the user. It provides the interface between applications and the underlying network. Protocols at this layer include:</p>

  <tr><td>DNS</td><td>Name resolution</td><td>UDP/TCP 53</td></tr>
  <tr><td>DHCP</td><td>IP configuration</td><td>UDP 67/68</td></tr>
  <tr><td>SNMP</td><td>Network management</td><td>UDP 161/162</td></tr>
</table>

<h2>15.2 Peer-to-Peer</h2>
<h3>15.2.1 Client-Server Model</h3>
<p>In the client-server model:</p>
<ul>
  <li>The <strong>server</strong> provides services and is always listening on a well-known port.</li>
  <li>The <strong>client</strong> initiates the request.</li>
  <li>Centralised management, security and backup.</li>
  <li>The server may become a bottleneck or single point of failure.</li>
</ul>

<h3>15.2.2 Peer-to-Peer Networks</h3>
<ul>
  <li>Every device can act as client and server.</li>
  <li>No central administration.</li>
  <li>Cheaper and simpler for small networks.</li>
  <li>Weak security and management.</li>
  <li>Difficult to back up consistently.</li>
</ul>

<h3>15.2.3&ndash;15.2.4 Peer-to-Peer Applications</h3>
<p>Common P2P applications:</p>
<ul>
  <li>BitTorrent &mdash; file sharing</li>
  <li>Skype (partly) &mdash; voice/video</li>
  <li>Blockchain networks</li>
  <li>Direct Connect</li>
</ul>
<p>Modern P2P networks often use a hybrid approach (central index + distributed transfers).</p>

<h2>15.3 Web and Email Protocols</h2>
<h3>15.3.1 HTTP and HTML</h3>
<p><strong>HTTP (Hypertext Transfer Protocol)</strong> defines how web browsers request and receive web pages. It uses TCP port 80.</p>
<p>HTTP methods:</p>
<table>
  <tr><th>Method</th><th>Purpose</th></tr>
  <tr><td>GET</td><td>Request a resource</td></tr>
  <tr><td>POST</td><td>Submit data to the server</td></tr>
  <tr><td>PUT</td><td>Upload/replace a resource</td></tr>
  <tr><td>DELETE</td><td>Remove a resource</td></tr>
  <tr><td>HEAD</td><td>Request headers only</td></tr>
</table>
<p><strong>HTML</strong> is the language used to build web pages. The browser interprets HTML and renders the page.</p>

<h3>15.3.2 HTTP and HTTPS</h3>
<ul>
  <li><strong>HTTP</strong> &mdash; unencrypted, port 80.</li>
  <li><strong>HTTPS</strong> &mdash; HTTP over TLS/SSL, encrypted, port 443.</li>
</ul>
<p>HTTPS provides confidentiality, integrity and authentication (via certificates).</p>

<h3>15.3.3&ndash;15.3.4 Email Protocols &mdash; SMTP, POP, IMAP</h3>
<table>
  <tr><th>Protocol</th><th>Purpose</th><th>Port</th></tr>
  <tr><td>SMTP</td><td>Send email (client to server, server to server)</td><td>TCP 25</td></tr>
  <tr><td>POP3</td><td>Download email and delete from server (default)</td><td>TCP 110</td></tr>
  <tr><td>IMAP</td><td>Sync email; keeps messages on server</td><td>TCP 143</td></tr>
  <tr><td>SMTPS</td><td>SMTP over TLS</td><td>TCP 465 or 587</td></tr>
  <tr><td>POP3S</td><td>POP3 over TLS</td><td>TCP 995</td></tr>
  <tr><td>IMAPS</td><td>IMAP over TLS</td><td>TCP 993</td></tr>
</table>

<h3>Email process</h3>
<ol>
  <li>Sender's client submits the message to their mail server using SMTP.</li>
  <li>The sending server looks up the recipient's domain MX record in DNS.</li>
  <li>The sending server delivers the message to the recipient's mail server via SMTP.</li>
  <li>The recipient's client retrieves the message using POP3 or IMAP.</li>
</ol>

<h2>15.4 IP Addressing Services</h2>
<h3>15.4.1 Domain Name System (DNS)</h3>
<p><strong>DNS</strong> resolves names to IP addresses. It is a distributed, hierarchical database.</p>

<h3>15.4.2 DNS Message Format</h3>
<p>DNS messages contain:</p>
<ul>
  <li>Header (query/response, opcode, flags, counts)</li>
  <li>Question section</li>
  <li>Answer section</li>
  <li>Authority section</li>
  <li>Additional section</li>
</ul>

<h3>15.4.3 DNS Hierarchy</h3>
<pre class="cli">                    . (root)
                   /    |    \\
                 com    org   net    ...
                /  \\
        example.com  another.com
             |
       www.example.com</pre>
<ul>
  <li><strong>Root servers</strong> &mdash; 13 root server clusters, managed globally.</li>
  <li><strong>TLD servers</strong> &mdash; .com, .org, .net, country TLDs.</li>
  <li><strong>Authoritative servers</strong> &mdash; hold the records for a specific domain.</li>
  <li><strong>Recursive resolvers</strong> &mdash; query on behalf of clients (usually the ISP's DNS).</li>
</ul>

<h3>DNS record types</h3>
<table>
  <tr><th>Record</th><th>Purpose</th></tr>
  <tr><td>A</td><td>Name to IPv4 address</td></tr>
  <tr><td>AAAA</td><td>Name to IPv6 address</td></tr>
  <tr><td>CNAME</td><td>Alias</td></tr>
  <tr><td>MX</td><td>Mail server</td></tr>
  <tr><td>NS</td><td>Name server for a zone</td></tr>
  <tr><td>TXT</td><td>Text (SPF, DKIM)</td></tr>
  <tr><td>PTR</td><td>Reverse lookup</td></tr>
</table>

<h3>15.4.4 The nslookup Command</h3>
<pre class="cli"><span class="cmt">! Windows and Linux:</span>
C:\\&gt; <span class="prompt">nslookup www.example.com</span>
C:\\&gt; <span class="prompt">nslookup</span>
&gt; <span class="prompt">server 8.8.8.8</span>
&gt; <span class="prompt">set type=mx</span>
&gt; <span class="prompt">example.com</span>
&gt; <span class="prompt">exit</span>

<span class="cmt">! Linux alternative:</span>
$ <span class="prompt">dig example.com</span>
$ <span class="prompt">dig -t MX example.com</span>
$ <span class="prompt">host example.com</span>

<span class="cmt">! Windows PowerShell:</span>
PS&gt; <span class="prompt">Resolve-DnsName example.com</span>

<span class="cmt">! Flush and display DNS cache:</span>
C:\\&gt; <span class="prompt">ipconfig /flushdns</span>
C:\\&gt; <span class="prompt">ipconfig /displaydns</span></pre>

<h3>15.4.6&ndash;15.4.7 DHCP Operation</h3>
<p><strong>DHCP</strong> automatically provides IP configuration to clients.</p>
<p>DORA process:</p>
<ol>
  <li><strong>Discover</strong> &mdash; client broadcasts looking for a DHCP server.</li>
  <li><strong>Offer</strong> &mdash; server offers an IP.</li>
  <li><strong>Request</strong> &mdash; client formally requests that IP.</li>
  <li><strong>Acknowledge</strong> &mdash; server confirms the lease.</li>
</ol>
<p>DHCP uses UDP ports 67 (server) and 68 (client). Lease renewal happens at 50% and 87.5% of the lease duration.</p>

<h2>15.5 File Sharing Services</h2>
<h3>15.5.1 File Transfer Protocol (FTP)</h3>
<p><strong>FTP</strong> transfers files between a client and server. Uses two connections:</p>
<ul>
  <li><strong>Control connection</strong> &mdash; TCP port 21, commands.</li>
  <li><strong>Data connection</strong> &mdash; TCP port 20 (active) or a dynamic port (passive).</li>
</ul>
<p>Two modes:</p>
<ul>
  <li><strong>Active</strong> &mdash; server initiates the data connection back to the client. Problematic with NAT/firewalls.</li>
  <li><strong>Passive</strong> &mdash; client initiates the data connection. Friendlier with firewalls.</li>
</ul>
<p>FTP is unencrypted. Alternatives:</p>
<table>
  <tr><th>Protocol</th><th>Encryption</th><th>Port</th></tr>
  <tr><td>FTP</td><td>None</td><td>20/21</td></tr>
  <tr><td>FTPS</td><td>TLS</td><td>989/990</td></tr>
  <tr><td>SFTP</td><td>SSH</td><td>22</td></tr>
  <tr><td>TFTP</td><td>None (UDP)</td><td>69</td></tr>
</table>

<h3>15.5.2 Server Message Block (SMB)</h3>
<p><strong>SMB</strong> is a client-server file sharing protocol used by Windows. It allows shared access to files, printers, serial ports and communications between nodes.</p>
<ul>
  <li>Uses TCP port 445 (or 139 for legacy).</li>
  <li>Supports file locking, permissions and authentication.</li>
  <li>Linux uses Samba to implement SMB.</li>
  <li>Modern versions (SMB3) add encryption and integrity checking.</li>
</ul>

<div class="callout blue"><b>CCNA exam tip</b>Memorise the well-known ports and the purpose of each Application-layer protocol. Know that HTTP is unencrypted and HTTPS is HTTP over TLS. Know the difference between POP3 (download) and IMAP (sync).</div>

<h2>16.1 Security Threats and Vulnerabilities</h2>
<h3>16.1.1 Types of Threats</h3>
<table>
  <tr><th>Threat</th><th>Description</th></tr>
  <tr><td>Information theft</td><td>Stealing confidential data</td></tr>
  <tr><td>Data loss and manipulation</td><td>Destroying or altering data</td></tr>
  <tr><td>Identity theft</td><td>Stealing personal information to impersonate a user</td></tr>
  <tr><td>Disruption of service</td><td>Preventing legitimate access</td></tr>
</table>

<h3>16.1.2 Types of Vulnerabilities</h3>
<table>
  <tr><th>Category</th><th>Examples</th></tr>
  <tr><td>Technological</td><td>Protocol weaknesses, OS flaws, misconfigured devices</td></tr>
  <tr><td>Configuration</td><td>Default passwords, open ports, unneeded services</td></tr>
  <tr><td>Policy</td><td>Weak password policy, lack of training, no BYOD rules</td></tr>
  <tr><td>Physical</td><td>Unlocked server rooms, exposed cabling, no surveillance</td></tr>
</table>

<h3>16.1.3 Physical Security</h3>
<ul>
  <li>Locked server rooms and equipment cabinets.</li>
  <li>Access control (badges, biometrics).</li>
  <li>Surveillance cameras and alarms.</li>
  <li>Proper cabling (no exposed runs in public areas).</li>
  <li>Secure disposal of equipment and media.</li>
  <li>Uninterruptible Power Supply (UPS) for critical devices.</li>
</ul>

<h2>16.2 Network Attacks</h2>
<h3>16.2.1 Types of Malware</h3>
<table>
  <tr><th>Type</th><th>Description</th></tr>
  <tr><td>Virus</td><td>Attaches to a file and spreads when the file runs</td></tr>
  <tr><td>Worm</td><td>Self-replicating; spreads across networks automatically</td></tr>
  <tr><td>Trojan horse</td><td>Disguised as legitimate software</td></tr>
  <tr><td>Ransomware</td><td>Encrypts data and demands payment</td></tr>
  <tr><td>Spyware</td><td>Secretly gathers user information</td></tr>
  <tr><td>Adware</td><td>Displays unwanted advertisements</td></tr>
  <tr><td>Rootkit</td><td>Hides malicious software from detection</td></tr>
  <tr><td>Keylogger</td><td>Records keystrokes to steal credentials</td></tr>
</table>

<h3>16.2.2 Reconnaissance Attacks</h3>
<p>Attackers gather information about the target before launching an attack.</p>
<ul>
  <li><strong>Ping sweeps</strong> &mdash; discover live hosts.</li>
  <li><strong>Port scans</strong> &mdash; find open ports.</li>
  <li><strong>DNS queries</strong> &mdash; map the network.</li>
  <li><strong>WHOIS lookups</strong> &mdash; find registration information.</li>
  <li><strong>Social engineering / phishing</strong> &mdash; gather information from people.</li>
  <li><strong>Dumpster diving</strong> &mdash; retrieve discarded documents.</li>
</ul>
<p>Mitigation: firewall filtering, IDS/IPS, disabling unnecessary services, security awareness training, and enforcing confidentiality on public information.</p>

<h3>16.2.3 Access Attacks</h3>
<p>Attackers try to gain unauthorised access.</p>
<table>
  <tr><th>Type</th><th>Description</th></tr>
  <tr><td>Password attack</td><td>Brute force, dictionary, rainbow tables</td></tr>
  <tr><td>Trust exploitation</td><td>Abusing a trusted relationship between systems</td></tr>
  <tr><td>Port redirection</td><td>Using a compromised host to redirect traffic</td></tr>
  <tr><td>Man-in-the-middle</td><td>Intercepting and possibly altering traffic</td></tr>
  <tr><td>Session hijacking</td><td>Stealing a valid session token</td></tr>
  <tr><td>Spoofing</td><td>Faking an IP, MAC or email address</td></tr>
</table>
<p>Mitigation: strong authentication, encryption, MFA, patching, segmented networks, and monitoring.</p>

<h3>16.2.4 Denial of Service Attacks</h3>
<p><strong>DoS</strong> &mdash; a single attacker overwhelms a service.<br>
<strong>DDoS</strong> &mdash; many attackers (often a botnet) overwhelm a service.</p>
<p>Common types:</p>
<ul>
  <li><strong>SYN flood</strong> &mdash; many half-open TCP connections exhaust server resources.</li>
  <li><strong>ICMP flood</strong> &mdash; ping flood overwhelms the target.</li>
  <li><strong>UDP flood</strong> &mdash; saturates bandwidth.</li>
  <li><strong>Amplification / reflection</strong> &mdash; DNS or NTP used to magnify the attack.</li>
  <li><strong>Application-layer</strong> &mdash; HTTP floods that look legitimate.</li>
</ul>
<p>Mitigation: rate limiting, firewall rules, DDoS protection services, IPS, traffic filtering.</p>

<h2>16.3 Network Attack Mitigations</h2>
<h3>16.3.1 The Defense-in-Depth Approach</h3>
<p>Multiple layers of overlapping defences:</p>
<ul>
  <li>Physical controls</li>
  <li>Perimeter firewalls</li>
  <li>Internal segmentation (VLANs, ACLs)</li>
  <li>Endpoint antivirus / EDR</li>
  <li>Application hardening / patching</li>
  <li>Data encryption</li>
  <li>User awareness training</li>
  <li>Logging, monitoring and incident response</li>
</ul>

<h3>16.3.2 Keep Backups</h3>
<p>Backups protect against ransomware, hardware failure and accidental deletion. Best practices:</p>
<ul>
  <li>Follow the <strong>3-2-1 rule</strong>: 3 copies, on 2 different media, with 1 offsite.</li>
  <li>Test restores regularly.</li>
  <li>Keep at least one offline copy to defeat ransomware.</li>
  <li>Encrypt backup media.</li>
</ul>

<h3>16.3.3 Upgrade, Update, and Patch</h3>
<ul>
  <li>Apply operating system and firmware patches promptly.</li>
  <li>Replace devices that no longer receive security updates.</li>
  <li>Use centralised patch management (WSUS, SCCM, Intune).</li>
  <li>Subscribe to vendor security advisories.</li>
</ul>

<h3>16.3.4 Authentication, Authorization, and Accounting (AAA)</h3>
<table>
  <tr><th>A</th><th>Meaning</th></tr>
  <tr><td>Authentication</td><td>Who are you? (password, certificate, biometric)</td></tr>
  <tr><td>Authorization</td><td>What are you allowed to do?</td></tr>
  <tr><td>Accounting</td><td>What did you do? (logs, session records)</td></tr>
</table>
<p>AAA servers: <strong>RADIUS</strong> (open standard) and <strong>TACACS+</strong> (Cisco).</p>

<h3>16.3.5&ndash;16.3.6 Firewalls and Types of Firewalls</h3>
<table>
  <tr><th>Type</th><th>Description</th></tr>
  <tr><td>Packet filter (stateless)</td><td>Filters individual packets by IP/port/protocol</td></tr>
  <tr><td>Stateful</td><td>Tracks the state of connections</td></tr>
  <tr><td>Application-layer gateway / proxy</td><td>Understands the application protocol</td></tr>
  <tr><td>Next-Generation Firewall (NGFW)</td><td>Adds IPS, application awareness, URL filtering, TLS inspection</td></tr>
  <tr><td>Host-based</td><td>Software firewall on an individual device</td></tr>
</table>
<p>Common placements:</p>
<ul>
  <li>Perimeter firewall between the internet and internal networks.</li>
  <li>DMZ for public-facing servers.</li>
  <li>Internal firewalls between segments.</li>
</ul>

<h3>16.3.7 Endpoint Security</h3>
<ul>
  <li><strong>Antivirus / anti-malware</strong> &mdash; signature and behaviour-based protection.</li>
  <li><strong>EDR</strong> &mdash; endpoint detection and response; behavioural monitoring and forensics.</li>
  <li><strong>Host-based firewall</strong> &mdash; filters traffic on the host.</li>
  <li><strong>Disk encryption</strong> &mdash; BitLocker, FileVault.</li>
  <li><strong>Patching</strong> &mdash; OS and application updates.</li>
  <li><strong>Application control</strong> &mdash; AppLocker, WDAC.</li>
</ul>
